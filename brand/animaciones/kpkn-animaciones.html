<style>
/* Layout: one black stage on top, grouped animation picker + format switch beneath. Single dark look on purpose. */
:root {
  --bg: #050505;
  --stage: #000000;
  --ink: #F2EEE6;
  --muted: #8F8A82;
  --line: #2A2826;
  --chip: #141312;
  --font-display: "Syne", "Arial Black", system-ui, sans-serif;
  --font-ui: "Syne", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--font-ui); font-size: 15px; padding-inline: 16px; padding-block: 24px 40px; }
.wrap { max-width: 1040px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 20px; }
h1 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 22px; letter-spacing: -0.01em; text-wrap: balance; }
header p { margin: 0; color: var(--muted); font-size: 13px; }

.stage {
  position: relative; width: 100%; max-width: 100%; aspect-ratio: 16 / 9; margin: 0 auto;
  background: var(--stage); border-radius: 6px; overflow: hidden; container-type: size;
  border: 1px solid var(--line);
}
.stage[data-fmt="9x16"] { aspect-ratio: 9 / 16; max-width: min(100%, 420px); }
.stage[data-fmt="1x1"] { aspect-ratio: 1 / 1; max-width: min(100%, 620px); }
.scene { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2.4cqh; }
.scene svg { width: min(46cqw, 52cqh); height: auto; overflow: visible; display: block; }
.word {
  --ws: 1;
  display: flex; font-family: var(--font-display); font-weight: 800; line-height: 1;
  font-size: calc(min(11cqh, 13cqw) * var(--ws)); letter-spacing: -0.01em; white-space: pre;
}
.word span { display: inline-block; will-change: transform, opacity; }

.controls { display: flex; flex-direction: column; gap: 14px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.label { color: var(--muted); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; min-width: 96px; }
button {
  font: inherit; color: var(--ink); background: var(--chip); border: 1px solid var(--line);
  border-radius: 999px; padding: 9px 16px; cursor: pointer; min-height: 40px;
}
button:hover { border-color: #57524C; }
button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
button[aria-pressed="true"] { background: var(--ink); color: #000; border-color: var(--ink); }
.desc { color: var(--muted); font-size: 14px; margin: 0; min-height: 2.8em; max-width: 70ch; }
</style>

<script>
(function () {
  // ---------- geometry of the "Torre anidada" ----------
  const BASE = [
    { cy: 61,   rx: 38, ry: 12,  off: 2,   dx: 5,   dy: 3.5 },
    { cy: 46,   rx: 28, ry: 9,   off: 1.5, dx: 4,   dy: 2.5 },
    { cy: 33,   rx: 18, ry: 6.5, off: 1,   dx: 3.5, dy: 2.2 },
    { cy: 21.6, rx: 11, ry: 4.2, off: 0.6, dx: 2.6, dy: 1.5 }, // 4th disc, only for "Nuevo récord"
  ];
  const FLAT_CY = [54, 60, 66, 70];
  const WHITE = [242, 238, 230], WARM = [255, 214, 186], COOL = [205, 220, 255], PURE = [255, 255, 255];
  const GOLD = [245, 200, 110], DIM = [70, 74, 84];
  const T_COL = [143, 178, 255], T_MUS = [244, 154, 110], T_ENE = [247, 207, 115]; // softened ring colours

  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const mix = (a, b, t) => a + (b - a) * t;
  const seg = (t, a, b) => clamp((t - a) / (b - a));
  const eOutCubic = t => 1 - Math.pow(1 - t, 3);
  const eInOut = t => (t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
  const eOutBack = t => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
  const eInQuad = t => t * t;
  const ring = (dt, k = 7, w = 22) => (dt < 0 ? 0 : Math.exp(-k * dt) * Math.cos(w * dt));
  const rgb = c => `rgb(${c.map(Math.round).join(",")})`;
  const cmix = (a, b, t) => a.map((v, i) => mix(v, b[i], clamp(t)));
  const colMix = (a, b, t) => rgb(cmix(a, b, t));
  const TAU = Math.PI * 2;

  function discPath(i, p) {
    const b = BASE[i];
    const s = p.s ?? 1, q = p.q ?? 0, f = p.f ?? 1;
    const cx = 50 + (p.x ?? 0);
    const cy = mix(FLAT_CY[i], b.cy, f) + (p.y ?? 0);
    const rx = b.rx * s * (1 + q);
    const ry = mix(b.rx * s, b.ry * s, f) * (1 - q);
    const irx = Math.max(0.1, rx - b.dx * s);
    const iry = Math.max(0.1, mix(irx, ry * (b.ry - b.dy) / b.ry, f));
    const icy = cy - b.off * s * f;
    const icx = cx + (p.ix ?? 0) * b.dx * s * 0.8;
    const e = (x, y, a, c) => `M${(x - a).toFixed(2)} ${y.toFixed(2)}a${a.toFixed(2)} ${c.toFixed(2)} 0 1 0 ${(2 * a).toFixed(2)} 0a${a.toFixed(2)} ${c.toFixed(2)} 0 1 0 ${(-2 * a).toFixed(2)} 0Z`;
    return e(cx, cy, rx, ry) + e(icx, icy, irx, iry);
  }
  const per = (text, fn) => [...text].map((c, i) => fn(i, c));

  // ---------- animations ----------
  const GLYPHS = "KPNXA0∆≡";
  const ANIMS = [
    // ===== Presentación =====
    { group: "intro", name: "Apilar", dur: 3.6,
      desc: "Los discos caen uno sobre otro y se aplastan al aterrizar. Después sube el texto letra por letra.",
      frame(t) {
        const discs = [0, 1, 2].map(i => {
          const t0 = 0.2 + 0.42 * i, land = t0 + 0.42;
          let q = 0.22 * ring(t - land, 6, 20);
          for (let j = i + 1; j < 3; j++) q += 0.07 * ring(t - (0.62 + 0.42 * j), 7, 22);
          return { y: (1 - eInQuad(seg(t, t0, land))) * -90, q, a: t < t0 ? 0 : 1 };
        });
        const flash = Math.max(0, ...[0, 1, 2].map(i => ring(t - (0.62 + 0.42 * i), 5, 0)));
        const letters = per("KPKN", i => { const k = eOutCubic(seg(t, 1.75 + 0.08 * i, 2.3 + 0.08 * i)); return { y: (1 - k) * 0.7, o: k }; });
        return { discs, letters, col: colMix(WHITE, WARM, flash * 0.55) };
      } },
    { group: "intro", name: "Respirar", dur: 4.2,
      desc: "Arranca como los tres anillos vistos de frente y se inclina hasta formar la torre. Respira suave todo el rato.",
      frame(t) {
        const f = eInOut(seg(t, 0.9, 2.3));
        const discs = [0, 1, 2].map(i => { const k = eOutCubic(seg(t, 0.05 + 0.12 * i, 0.75 + 0.12 * i));
          return { f, s: mix(0.7, 1, k) * (1 + 0.025 * Math.sin(t * TAU / 1.8 + i * 0.7)), a: k }; });
        const k = eOutCubic(seg(t, 2.1, 3.3));
        return { discs, letters: per("KPKN", () => ({ o: k })), ls: mix(0.7, -0.01, k), col: colMix(COOL, WHITE, eInOut(seg(t, 0.4, 3))) };
      } },
    { group: "intro", name: "Pulso", dur: 3.8,
      desc: "Cada disco aparece con un rebote y la torre late dos veces de abajo hacia arriba. Cada letra entra con un latido.",
      frame(t) {
        const beats = [1.35, 1.95];
        const discs = [0, 1, 2].map(i => {
          let s = Math.max(0, eOutBack(seg(t, 0.15 + 0.22 * i, 0.65 + 0.22 * i)));
          for (const b of beats) { const d = t - b - 0.07 * i; if (d > 0) s += 0.12 * Math.exp(-6 * d) * Math.sin(Math.min(d * 14, Math.PI)); }
          return { s, a: t < 0.15 + 0.22 * i ? 0 : 1 };
        });
        let glow = 0; for (const b of beats) { const d = t - b; if (d > 0) glow = Math.max(glow, Math.exp(-4 * d)); }
        const letters = per("KPKN", i => { const k = seg(t, 1.35 + 0.17 * i, 1.6 + 0.17 * i); return { o: k, sc: mix(1.5, 1, eOutCubic(k)) }; });
        return { discs, letters, col: colMix(WHITE, WARM, glow * 0.7) };
      } },
    { group: "intro", name: "Carga", dur: 4.0,
      desc: "El disco base llena la pantalla y se reduce a su lugar; los otros dos suben desde adentro. El texto se descubre de izquierda a derecha.",
      frame(t) {
        const z = eInOut(seg(t, 0, 1.1));
        const k1 = seg(t, 1.0, 1.65), k2 = seg(t, 1.25, 1.9);
        const discs = [
          { s: mix(3.4, 1, z), y: mix(-14, 0, z) },
          { s: mix(0.55, 1, eOutBack(k1)), y: mix(15, 0, eOutBack(k1)), a: k1 > 0 ? 1 : 0 },
          { s: mix(0.45, 1, eOutBack(k2)), y: mix(28, 0, eOutBack(k2)), a: k2 > 0 ? 1 : 0 },
        ];
        return { discs, letters: per("KPKN", () => ({})), clip: eInOut(seg(t, 1.95, 2.75)), col: colMix(PURE, WHITE, z) };
      } },
    { group: "intro", name: "Deformar", dur: 4.2,
      desc: "La torre ondula como líquido y cambia levemente de tono hasta fijarse nítida. Las letras se revuelven antes de quedar en KPKN.",
      frame(t) {
        const A = 1 - eInOut(seg(t, 0.4, 2.5)), settle = ring(t - 2.5, 6, 18);
        const discs = [0, 1, 2].map(i => ({
          q: A * 0.32 * Math.sin(t * 7.5 + i * 1.3) + 0.06 * settle, y: A * 4 * Math.sin(t * 5 + i * 2.1),
          x: A * 3 * Math.cos(t * 4.2 + i), f: mix(1, 0.55 + 0.45 * Math.sin(t * 3 + i), A), a: eOutCubic(seg(t, 0, 0.4)) }));
        const letters = per("KPKN", i => ({ o: seg(t, 1.5, 1.9), ch: t < 2.4 + 0.18 * i ? GLYPHS[Math.floor(t * 18 + i * 3) % GLYPHS.length] : null }));
        const h = Math.sin(t * 2.4);
        return { discs, letters, col: h > 0 ? colMix(WHITE, WARM, h * A * 0.8) : colMix(WHITE, COOL, -h * A * 0.8) };
      } },

    // ===== Cargando (bucles sin corte) =====
    { group: "load", name: "Apilando", dur: 2.4, loop: true,
      desc: "Bucle de carga: los discos se apilan uno a uno y se levantan en orden inverso. Sirve para pantallas de carga largas.",
      frame(t) {
        const p = t % 2.4;
        const discs = [0, 1, 2].map(i => {
          const tin = 0.1 + 0.28 * i, tout = 1.55 + 0.16 * (2 - i);
          const kin = eOutBack(seg(p, tin, tin + 0.35)), kout = eInOut(seg(p, tout, tout + 0.35));
          return { y: (1 - kin) * -14 - kout * 10, a: clamp(seg(p, tin, tin + 0.15) - kout), q: 0.12 * ring(p - tin - 0.35, 8, 24) };
        });
        return { discs, text: "CARGANDO", size: 0.42, ls: 0.35, letters: per("CARGANDO", i => ({ o: 0.45 + 0.55 * Math.max(0, Math.sin(p / 2.4 * TAU * 2 - i * 0.5)) })), col: rgb(WHITE) };
      } },
    { group: "load", name: "Ola", dur: 1.6, loop: true,
      desc: "Bucle de carga corto: una ola de luz recorre los discos de abajo hacia arriba. Discreto, para cargas breves.",
      frame(t) {
        const p = t % 1.6;
        const discs = [0, 1, 2].map(i => { const w = Math.max(0, Math.sin(p / 1.6 * TAU - i * 0.9));
          return { s: 1 + 0.05 * w, a: 0.3 + 0.7 * w, y: -2 * w }; });
        return { discs, text: "CARGANDO", size: 0.42, ls: 0.35, letters: per("CARGANDO", () => ({ o: 0.7 })), col: rgb(WHITE) };
      } },
    { group: "load", name: "Girando", dur: 1.2, loop: true,
      desc: "Bucle de sincronización: los discos giran como discos de pesas en la barra, cada uno desfasado.",
      frame(t) {
        const p = t % 1.2;
        const discs = [0, 1, 2].map(i => ({ ix: Math.sin(p / 1.2 * TAU + i * 1.1), q: 0.03 * Math.cos(p / 1.2 * TAU + i * 1.1) }));
        return { discs, text: "SINCRONIZANDO", size: 0.36, ls: 0.3, letters: per("SINCRONIZANDO", () => ({ o: 0.75 })), col: rgb(WHITE) };
      } },

    // ===== Momentos =====
    { group: "app", name: "Meta cumplida", dur: 3.2,
      desc: "La torre se agacha, salta y al caer suelta tres ondas desde la base, con un destello dorado. Para cuando el usuario completa su meta del día.",
      frame(t) {
        const crouch = eInOut(seg(t, 0, 0.3)) * (1 - seg(t, 0.3, 0.45));
        const up = eOutCubic(seg(t, 0.35, 0.85)), down = eInQuad(seg(t, 0.85, 1.25));
        const land = ring(t - 1.25, 6, 22);
        const discs = [0, 1, 2].map(i => ({ y: -(up - down) * (16 + 2 * i), q: 0.14 * crouch + 0.2 * land * (1 - i * 0.25) }));
        const fx = [0, 1, 2].map(k => { const d = seg(t, 1.25 + 0.13 * k, 2.15 + 0.13 * k);
          return { rx: mix(38, 78, eOutCubic(d)), ry: mix(12, 26, eOutCubic(d)), cy: 61, o: d > 0 && d < 1 ? 1 - d : 0, w: mix(2.2, 0.6, d) }; });
        const glow = Math.max(0, ring(t - 1.25, 2.5, 0));
        const letters = per("META CUMPLIDA", i => { const k = eOutBack(seg(t, 1.45 + 0.035 * i, 1.85 + 0.035 * i)); return { y: (1 - k) * 0.6, o: clamp(k) }; });
        return { discs, fx, text: "META CUMPLIDA", size: 0.5, letters, col: colMix(WHITE, GOLD, glow * 0.9) };
      } },
    { group: "app", name: "Nuevo récord", dur: 3.4,
      desc: "Aparece un cuarto disco dorado que cae sobre la torre: una capa más que antes. Para un récord personal.",
      frame(t) {
        const make = eInOut(seg(t, 0.1, 0.5));
        const land = 1.0, impact = ring(t - land, 6, 22);
        const discs = [0, 1, 2].map(i => ({ y: make * 5, q: 0.1 * impact * (1 - i * 0.2) }));
        const fall = seg(t, 0.55, land);
        discs.push({ y: 5 + (1 - eInQuad(fall)) * -70, a: t < 0.55 ? 0 : 1, q: 0.25 * impact, col: colMix(PURE, GOLD, seg(t, land, land + 0.4)) });
        const letters = per("NUEVO RÉCORD", i => { const k = eOutCubic(seg(t, 1.35 + 0.04 * i, 1.85 + 0.04 * i)); return { y: (1 - k) * 0.6, o: k }; });
        return { discs, text: "NUEVO RÉCORD", size: 0.5, letters, col: rgb(WHITE), wordCol: colMix(WHITE, GOLD, seg(t, 1.6, 2.4)) };
      } },
    { group: "app", name: "Racha", dur: 3.6,
      desc: "Los tres rings se encienden uno tras otro con su color (columna, músculo, energía) mientras el contador sube los días de racha.",
      frame(t) {
        const cols = [T_COL, T_MUS, T_ENE];
        const discs = [0, 1, 2].map(i => { const k = seg(t, 0.4 + 0.5 * i, 0.8 + 0.5 * i);
          return { col: colMix(DIM, cols[i], k), s: 1 + 0.08 * Math.sin(Math.PI * k) }; });
        const n = Math.max(1, Math.min(7, Math.floor(1 + seg(t, 0.3, 2.0) * 6.999)));
        const pop = ring(t - 2.0, 5, 14);
        const text = n + (n === 1 ? " DÍA" : " DÍAS");
        return { discs, text, size: 0.62, letters: per(text, () => ({ sc: 1 + 0.12 * Math.max(0, pop) })), col: rgb(WHITE) };
      } },
    { group: "app", name: "Recuperado", dur: 4.0,
      desc: "La torre parte apagada y se va llenando de luz de abajo hacia arriba, con una respiración lenta. El porcentaje sube hasta 100%.",
      frame(t) {
        const discs = [0, 1, 2].map(i => { const k = eInOut(seg(t, 0.2 + 0.7 * i, 1.2 + 0.7 * i));
          return { col: colMix(DIM, cmix(COOL, WHITE, k), k), s: 1 + 0.02 * Math.sin(t * TAU / 2.2 + i) }; });
        const pct = Math.round(eInOut(seg(t, 0.2, 2.6)) * 100);
        const text = pct + "% RECUPERADO";
        return { discs, text, size: 0.46, letters: per(text, () => ({ o: 0.4 + 0.6 * seg(t, 0, 0.6) })), col: rgb(WHITE), wordCol: colMix(COOL, WHITE, seg(t, 2.4, 3)) };
      } },
    { group: "app", name: "Sin conexión", dur: 3.4,
      desc: "La torre tambalea, el disco de arriba se desliza y vuelve a su lugar. Para errores o falta de conexión, sin dramatismo.",
      frame(t) {
        const wob = Math.sin(t * 9) * Math.exp(-1.2 * Math.max(0, t - 0.3)) * seg(t, 0.1, 0.3);
        const slide = Math.sin(Math.PI * seg(t, 0.5, 1.6));
        const back = ring(t - 1.6, 5, 18);
        const discs = [0, 1, 2].map(i => ({ x: wob * (1 + i * 1.6) + (i === 2 ? slide * 14 + back * 2 : 0), y: i === 2 ? slide * 3 : 0, q: i === 2 ? 0.1 * back : 0 }));
        return { discs, text: "SIN CONEXIÓN", size: 0.46, ls: 0.12, letters: per("SIN CONEXIÓN", () => ({ o: seg(t, 0.4, 0.9) })), col: rgb(WHITE), wordCol: rgb([200, 196, 190]) };
      } },
  ];

  // ---------- renderer ----------
  const paths = [0, 1, 2, 3].map(i => document.getElementById("d" + i));
  const fxEls = [0, 1, 2].map(i => document.getElementById("e" + i));
  const word = document.getElementById("word");
  let spans = [], curText = null;
  const HOLD = 1.8, FADE = 0.45;
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function setText(text) {
    if (text === curText) return;
    curText = text; word.textContent = "";
    spans = [...text].map(c => { const s = document.createElement("span"); s.textContent = c === " " ? " " : c; word.appendChild(s); return s; });
    word.setAttribute("aria-label", text);
  }
  function draw(st, fadeOut) {
    const a = 1 - fadeOut, text = st.text || "KPKN";
    paths.forEach((p, i) => {
      const d = st.discs[i];
      if (!d) { p.style.opacity = "0"; return; }
      p.setAttribute("d", discPath(i, d));
      p.setAttribute("fill", d.col || st.col);
      p.style.opacity = String(clamp(d.a ?? 1) * a);
    });
    fxEls.forEach((el, i) => {
      const f = st.fx && st.fx[i];
      if (!f) { el.style.opacity = "0"; return; }
      el.setAttribute("cx", 50); el.setAttribute("cy", f.cy); el.setAttribute("rx", f.rx); el.setAttribute("ry", f.ry);
      el.setAttribute("stroke", st.col); el.setAttribute("stroke-width", f.w); el.style.opacity = String(f.o * a);
    });
    setText(text);
    word.style.setProperty("--ws", st.size ?? 1);
    word.style.color = st.wordCol || st.col;
    word.style.letterSpacing = (st.ls ?? -0.01) + "em";
    word.style.clipPath = st.clip == null ? "none" : `inset(-20% ${(1 - st.clip) * 100}% -20% 0)`;
    word.style.opacity = String(a);
    const maxW = stage.clientWidth * 0.86, natW = word.offsetWidth;
    word.style.transform = natW > maxW ? `scale(${(maxW / natW).toFixed(4)})` : "none";
    const L = st.letters || [];
    spans.forEach((s, i) => {
      const l = L[i] || {}, ch = l.ch || text[i];
      s.textContent = ch === " " ? " " : ch;
      s.style.opacity = String(l.o ?? 1);
      s.style.transform = `translateY(${l.y ?? 0}em) scale(${l.sc ?? 1})`;
    });
  }
  function frameAt(A, t) {
    if (A.loop) return [A.frame(t), 0];
    const fade = t > A.dur + HOLD ? (t - A.dur - HOLD) / FADE : 0;
    return [A.frame(Math.min(t, A.dur)), clamp(fade)];
  }
  const totalOf = A => (A.loop ? A.dur * 3 : A.dur + HOLD + FADE);

  let cur = 0, start = performance.now(), sequence = false;
  const desc = document.getElementById("desc");
  const btns = ANIMS.map((A, i) => {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = A.name; b.setAttribute("aria-pressed", "false");
    b.addEventListener("click", () => select(i));
    document.getElementById("g-" + A.group).appendChild(b); return b;
  });
  function select(i) {
    cur = i; start = performance.now();
    btns.forEach((b, j) => b.setAttribute("aria-pressed", j === i ? "true" : "false"));
    desc.textContent = ANIMS[i].desc;
    if (reduce) draw(ANIMS[i].frame(ANIMS[i].loop ? 0 : ANIMS[i].dur), 0);
  }
  document.getElementById("replay").addEventListener("click", () => select(cur));
  const seqBtn = document.getElementById("seq");
  seqBtn.addEventListener("click", () => { sequence = !sequence; seqBtn.setAttribute("aria-pressed", String(sequence)); });
  const stage = document.getElementById("stage");
  document.querySelectorAll("button[data-fmt]").forEach(b => b.addEventListener("click", () => {
    stage.dataset.fmt = b.dataset.fmt;
    document.querySelectorAll("button[data-fmt]").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
  }));

  function tick(now) {
    if (window.__kpknPause) return;
    const A = ANIMS[cur], t = (now - start) / 1000;
    if (t >= totalOf(A)) {
      if (sequence) select((cur + 1) % ANIMS.length); else if (!A.loop) start = now;
      if (A.loop && !sequence) { /* keep looping */ }
    }
    const tt = A.loop ? (now - start) / 1000 : Math.min((now - start) / 1000, totalOf(A));
    const [st, fade] = frameAt(A, tt);
    draw(st, fade);
    requestAnimationFrame(tick);
  }
  // Hook used to export videos frame by frame.
  window.__kpkn = { ANIMS, HOLD, FADE, totalOf, renderAt(i, t) { const [st, fade] = frameAt(ANIMS[i], t); draw(st, fade); } };

  select(0);
  draw(ANIMS[0].frame(ANIMS[0].dur), 0);
  if (!reduce) { start = performance.now(); requestAnimationFrame(tick); }
})();
</script>
</html>
