<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Avanzado: drop-set y rest-pause</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Syne:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#F2EEE6}a:hover{color:#ffffff}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #000000; color: #F2EEE6; font-family: Inter, sans-serif; position: relative; overflow: hidden;">
  <div style="padding: 22px 20px 0 20px; opacity: 0.45;">
    <div style="font-family: Syne, sans-serif; font-weight: 700; font-size: 24px;">Sentadilla Trasera con…</div>
    <div style="font-size: 13px; color: rgba(242,238,230,0.62); margin-top: 2px;">Principal · Pierna A</div>
  </div>

  <div style="margin: 28px 16px 0 16px; border-radius: 28px; background: #111111; border: 1px solid rgba(242,238,230,0.07); overflow: hidden;">
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; background: #1B1B1B; border-bottom: 1px solid rgba(242,238,230,0.06);">
      <button style="height: 32px; padding: 0 12px 0 8px; border-radius: 16px; border: none; background: #111111; color: #F2EEE6; font-family: Inter, sans-serif; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 4px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>Serie 1</button>
      <div style="font-size: 12px; font-weight: 600; letter-spacing: 1.6px; color: rgba(242,238,230,0.62);">AVANZADO</div>
    </div>

    <div style="padding: 14px 16px 16px 16px; display: flex; flex-direction: column; gap: 16px;">
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 18px; background: #0B0B0B;">
        <button style="height: 30px; border-radius: 15px; border: none; background: transparent; color: rgba(242,238,230,0.62); font-family: Inter, sans-serif; font-size: 12px; font-weight: 600;">Normal</button>
        <button style="height: 30px; border-radius: 15px; border: none; background: #F2EEE6; color: #0B0B0B; font-family: Inter, sans-serif; font-size: 12px; font-weight: 600;">Drop-set</button>
        <button style="height: 30px; border-radius: 15px; border: none; background: transparent; color: rgba(242,238,230,0.62); font-family: Inter, sans-serif; font-size: 12px; font-weight: 600;">Rest-pause</button>
        <button style="height: 30px; border-radius: 15px; border: none; background: transparent; color: rgba(242,238,230,0.62); font-family: Inter, sans-serif; font-size: 12px; font-weight: 600;">Myo-reps</button>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px;">
        <div style="font-size: 12px; font-weight: 600; letter-spacing: 1.6px; color: rgba(242,238,230,0.62);">CADENA DE LA SERIE</div>
        <div style="display: flex; align-items: center; gap: 6px;">
          <div style="width: 70px; height: 58px; border-radius: 16px; background: #1A1A1A; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;">
            <span style="font-size: 10px; color: rgba(242,238,230,0.5);">Principal</span>
            <span style="font-family: Syne, sans-serif; font-weight: 700; font-size: 15px;">95</span>
            <span style="font-size: 11px; color: rgba(242,238,230,0.7);">× 6</span>
          </div>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="rgba(242,238,230,0.35)" stroke-width="2.4" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
          <div style="width: 70px; height: 58px; border-radius: 16px; background: #1A1A1A; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;">
            <span style="font-size: 10px; color: rgba(242,238,230,0.5);">Drop 1</span>
            <span style="font-family: Syne, sans-serif; font-weight: 700; font-size: 15px;">75</span>
            <span style="font-size: 11px; color: rgba(242,238,230,0.7);">× 8</span>
          </div>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="rgba(242,238,230,0.35)" stroke-width="2.4" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
          <div style="width: 70px; height: 58px; border-radius: 16px; background: rgba(244,154,110,0.10); border: 1px solid #F49A6E; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; box-sizing: border-box;">
            <span style="font-size: 10px; color: #F49A6E;">Drop 2</span>
            <span style="font-family: Syne, sans-serif; font-weight: 700; font-size: 15px;">60</span>
            <span style="font-size: 11px; color: rgba(242,238,230,0.45);">× —</span>
          </div>
          <button aria-label="Añadir drop" style="width: 44px; height: 58px; border-radius: 16px; border: 1px dashed rgba(242,238,230,0.25); background: transparent; color: rgba(242,238,230,0.7); display: flex; align-items: center; justify-content: center;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg></button>
        </div>
      </div>

      <div style="border-radius: 20px; background: #0B0B0B; padding: 12px; display: flex; flex-direction: column; gap: 10px;">
        <div style="display: flex; align-items: center; justify-content: space-between;">
          <div style="font-size: 13px; font-weight: 600;">Drop 2</div>
          <div style="display: flex; gap: 6px;">
            <button style="height: 26px; padding: 0 10px; border-radius: 13px; border: 1px solid rgba(242,238,230,0.12); background: transparent; color: #F2EEE6; font-family: Inter, sans-serif; font-size: 12px;">−20 %</button>
            <button style="height: 26px; padding: 0 10px; border-radius: 13px; border: 1px solid #F2EEE6; background: transparent; color: #F2EEE6; font-family: Inter, sans-serif; font-size: 12px;">−20 % · 60</button>
            <button style="height: 26px; padding: 0 10px; border-radius: 13px; border: 1px solid rgba(242,238,230,0.12); background: transparent; color: #F2EEE6; font-family: Inter, sans-serif; font-size: 12px;">−30 %</button>
          </div>
        </div>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;">
          <div style="height: 44px; border-radius: 14px; background: #161616; display: flex; align-items: center; justify-content: space-between; padding: 0 6px;">
            <button aria-label="Menos carga" style="width: 32px; height: 32px; border-radius: 16px; border: none; background: #222222; color: #F2EEE6; font-size: 18px;">−</button>
            <span style="font-size: 15px; font-weight: 600;">60 kg</span>
            <button aria-label="Más carga" style="width: 32px; height: 32px; border-radius: 16px; border: none; background: #222222; color: #F2EEE6; font-size: 18px;">+</button>
          </div>
          <div style="height: 44px; border-radius: 14px; background: #161616; display: flex; align-items: center; justify-content: space-between; padding: 0 6px;">
            <button aria-label="Menos reps" style="width: 32px; height: 32px; border-radius: 16px; border: none; background: #222222; color: #F2EEE6; font-size: 18px;">−</button>
            <span style="font-size: 15px; font-weight: 600; color: rgba(242,238,230,0.55);">reps</span>
            <button aria-label="Más reps" style="width: 32px; height: 32px; border-radius: 16px; border: none; background: #222222; color: #F2EEE6; font-size: 18px;">+</button>
          </div>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 6px;">
        <div style="font-size: 12px; font-weight: 600; letter-spacing: 1.6px; color: rgba(242,238,230,0.38);">ASÍ SE VE UN REST-PAUSE</div>
        <div style="display: flex; align-items: center; gap: 6px; font-size: 13px;">
          <span style="height: 30px; padding: 0 10px; border-radius: 15px; background: #1A1A1A; display: flex; align-items: center;">95 × 6</span>
          <span style="font-size: 11px; color: rgba(242,238,230,0.5);">15 s</span>
          <span style="height: 30px; padding: 0 10px; border-radius: 15px; background: #1A1A1A; display: flex; align-items: center;">95 × 3</span>
          <span style="font-size: 11px; color: rgba(242,238,230,0.5);">15 s</span>
          <span style="height: 30px; padding: 0 10px; border-radius: 15px; border: 1px solid #F49A6E; display: flex; align-items: center;">95 × —</span>
        </div>
      </div>

      <label style="display: flex; flex-direction: column; gap: 6px;">
        <span style="font-size: 12px; font-weight: 600; letter-spacing: 1.6px; color: rgba(242,238,230,0.62);">NOTA DE LA SERIE</span>
        <input type="text" placeholder="Rodilla estable, bajar más lento" style="height: 40px; border-radius: 14px; border: 1px solid rgba(242,238,230,0.10); background: #0B0B0B; color: #F2EEE6; padding: 0 12px; font-family: Inter, sans-serif; font-size: 14px;">
      </label>
    </div>
  </div>
</div>
</x-dc>

  renderVals() { return {}; }

</script>
</body>
</html>
