<style>

a{color:#F2EEE6}a:hover{color:#ffffff}
@keyframes eq{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
.b{display:inline-block;width:4px;border-radius:2px;transform-origin:bottom;animation:eq 1.1s ease-in-out infinite}

    <div style="font-family: Syne, sans-serif; font-weight: 700; font-size: 20px;">Modo de voz</div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
      <button style="border-radius: 22px; border: 1px solid #F2EEE6; background: rgba(242,238,230,0.06); color: #F2EEE6; padding: 16px 12px; display: flex; flex-direction: column; align-items: flex-start; gap: 10px; text-align: left; font-family: Inter, sans-serif;">

        </div>
        <div style="height: 22px; display: flex; align-items: flex-end; gap: 3px;">
          <span class="b" style="height: 14px; background: #F2EEE6; animation-delay: 0s;"></span>
          <span class="b" style="height: 22px; background: #F2EEE6; animation-delay: .2s;"></span>
          <span class="b" style="height: 18px; background: #F2EEE6; animation-delay: .4s;"></span>
          <span class="b" style="height: 10px; background: #F2EEE6; animation-delay: .1s;"></span>
        </div>
        <div style="font-size: 15px; font-weight: 600;">Te habla</div>
        <div style="font-size: 12px; color: rgba(242,238,230,0.62); line-height: 16px;">Dice tus series y avisa el descanso.</div>
      </button>
      <button style="border-radius: 22px; border: 1px solid rgba(242,238,230,0.10); background: #161616; color: #F2EEE6; padding: 16px 12px; display: flex; flex-direction: column; align-items: flex-start; gap: 10px; text-align: left; font-family: Inter, sans-serif;">
        <div style="width: 44px; height: 44px; border-radius: 22px; background: #222222; color: #F2EEE6; display: flex; align-items: center; justify-content: center;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0"></path><path d="M12 18v3"></path></svg>
        </div>
        <div style="height: 22px; display: flex; align-items: flex-end; gap: 3px; opacity: 0.45;">
          <span style="display: inline-block; width: 4px; height: 8px; border-radius: 2px; background: #F2EEE6;"></span>
          <span style="display: inline-block; width: 4px; height: 12px; border-radius: 2px; background: #F2EEE6;"></span>
          <span style="display: inline-block; width: 4px; height: 9px; border-radius: 2px; background: #F2EEE6;"></span>
          <span style="display: inline-block; width: 4px; height: 6px; border-radius: 2px; background: #F2EEE6;"></span>
        </div>
        <div style="font-size: 15px; font-weight: 600;">Manos libres</div>
        <div style="font-size: 12px; color: rgba(242,238,230,0.62); line-height: 16px;">Dicta «noventa y cinco por seis».</div>
      </button>
    </div>

    <div style="border-radius: 18px; background: #161616; padding: 12px 14px; display: flex; align-items: center; gap: 12px;">
      <div style="width: 36px; height: 36px; border-radius: 18px; background: rgba(67,209,140,0.15); color: #43D18C; display: flex; align-items: center; justify-content: center;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M4 10v4h4l5 4V6L8 10z"></path></svg></div>

        <div style="font-size: 12px; color: rgba(242,238,230,0.55);">«Serie 2 de 4: 95 kg por 6.»</div>
      </div>
      <button style="height: 32px; padding: 0 12px; border-radius: 16px; border: 1px solid rgba(242,238,230,0.12); background: transparent; color: #F2EEE6; font-family: Inter, sans-serif; font-size: 12px; font-weight: 600;">Escuchar</button>
    </div>

    <button style="height: 44px; border-radius: 22px; border: none; background: #F2EEE6; color: #0B0B0B; font-family: Inter, sans-serif; font-size: 14px; font-weight: 600;">Activar «Te habla»</button>
  </div>
