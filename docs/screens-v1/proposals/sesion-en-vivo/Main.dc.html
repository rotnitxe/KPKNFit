<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Tarjeta de la serie con esfuerzo</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Syne:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#F2EEE6}a:hover{color:#ffffff}
@keyframes rise{0%{transform:translateY(10px) scale(.5);opacity:0}25%{opacity:1}100%{transform:translateY(-30px) scale(1.15);opacity:0}}
@keyframes flick{0%,100%{filter:brightness(1)}50%{filter:brightness(1.25)}}
@keyframes shim{0%{background-position:160% 0}55%,100%{background-position:-60% 0}}
@keyframes halo{0%,100%{box-shadow:0 0 0 0 rgba(247,207,115,.0),0 0 18px 4px rgba(244,154,110,.35)}50%{box-shadow:0 0 0 6px rgba(247,207,115,.12),0 0 26px 8px rgba(244,154,110,.55)}}
.shim{background:linear-gradient(100deg,rgba(242,238,230,.62) 38%,#F2EEE6 50%,rgba(242,238,230,.62) 62%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shim 5.4s ease-in-out infinite}
.p{position:absolute;bottom:6px;border-radius:50%;animation:rise 2.4s ease-out infinite}
.lv3 .p{animation-duration:1.7s}
.lv4 .p{animation-duration:1.2s}
.lv5 .p{animation-duration:.8s}
.lv5 .fill{animation:flick .9s ease-in-out infinite}
.lv5 .thumb{animation:halo 1.2s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.shim,.p,.fill,.thumb{animation:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #000000; color: #F2EEE6; font-family: Inter, sans-serif; position: relative; overflow: hidden;">

  <div style="position: absolute; left: 0; top: 0; width: 390px; height: 190px; background: radial-gradient(120% 90% at 85% 0%, rgba(244,154,110,0.28) 0%, rgba(244,154,110,0.0) 60%), radial-gradient(80% 80% at 10% 10%, rgba(143,178,255,0.16) 0%, rgba(143,178,255,0) 60%); opacity: 0.9;"></div>
  <div style="position: absolute; left: 0; top: 120px; width: 390px; height: 90px; background: linear-gradient(180deg, rgba(0,0,0,0) 0%, #000000 100%);"></div>

  <div style="position: relative; padding: 22px 20px 0 20px; display: flex; flex-direction: column; gap: 12px;">
    <div style="display: flex; align-items: center; gap: 10px;">
      <div style="flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; -webkit-mask-image: linear-gradient(90deg, #000 85%, transparent 100%); mask-image: linear-gradient(90deg, #000 85%, transparent 100%);">
        <div style="font-family: Syne, sans-serif; font-weight: 700; font-size: 24px; letter-spacing: -0.2px;">Sentadilla Trasera con Barra Alta</div>
        <div style="font-size: 13px; color: rgba(242,238,230,0.62); margin-top: 2px;">Principal · Pierna A</div>
      </div>
      <button aria-label="Historial del ejercicio" style="width: 40px; height: 40px; border-radius: 20px; border: 1px solid rgba(242,238,230,0.10); background: rgba(17,17,17,0.85); color: #F2EEE6; display: flex; align-items: center; justify-content: center; padding: 0;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"></path><path d="M3 4v4h4"></path><path d="M12 7v5l3 2"></path></svg>
      </button>
      <button aria-label="Modo de voz" style="width: 40px; height: 40px; border-radius: 20px; border: 1px solid rgba(242,238,230,0.10); background: rgba(17,17,17,0.85); color: #F2EEE6; display: flex; align-items: center; justify-content: center; padding: 0;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0"></path><path d="M12 18v3"></path></svg>
      </button>
    </div>
    <div style="display: flex; gap: 8px; flex-wrap: wrap;">
      <div style="height: 30px; padding: 0 12px; border-radius: 15px; background: rgba(17,17,17,0.85); border: 1px solid rgba(242,238,230,0.08); display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="13" r="8"></circle><path d="M12 9v4"></path><path d="M10 2h4"></path></svg>32:10 / 1:00:00</div>
      <div style="height: 30px; padding: 0 12px; border-radius: 15px; background: rgba(17,17,17,0.85); border: 1px solid rgba(242,238,230,0.08); display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600;"><span style="width: 7px; height: 7px; border-radius: 4px; background: #43D18C;"></span>80 %</div>
      <div style="height: 30px; padding: 0 12px; border-radius: 15px; background: rgba(17,17,17,0.85); border: 1px solid rgba(242,238,230,0.08); display: flex; align-items: center; font-size: 13px; color: rgba(242,238,230,0.62);">Sin etiquetas</div>
    </div>
  </div>

  <div style="position: relative; margin-top: 16px; padding: 0 28px; text-align: center; font-size: 14px; line-height: 22px; min-height: 22px;">
    <span class="shim">Serie 1 de 4: 95 kg × 4–6 a RIR 2. </span><span style="background: #F2EEE6; color: #0B0B0B; border-radius: 6px; padding: 2px 6px; font-weight: 600;">Aplícalo</span>
  </div>

  <div style="position: relative; margin: 16px 16px 0 16px; border-radius: 28px; background: #111111; border: 1px solid rgba(242,238,230,0.07); overflow: hidden;">
    <div style="background: #1B1B1B; padding: 16px 16px 14px 16px; border-bottom: 1px solid rgba(242,238,230,0.06);">
      <div style="display: flex; align-items: center; justify-content: space-between;">
        <div style="font-size: 12px; font-weight: 600; letter-spacing: 1.6px; color: rgba(242,238,230,0.62);">CARGA (kg)</div>
        <div style="font-size: 12px; color: rgba(242,238,230,0.38);">Externa</div>
      </div>
      <div style="font-family: Syne, sans-serif; font-weight: 700; font-size: 34px; line-height: 44px; text-align: center; margin: 4px 0 10px 0;">95</div>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px;">
        <button style="height: 44px; border-radius: 14px; border: 1px solid rgba(242,238,230,0.10); background: #111111; color: #F2EEE6; font-family: Inter, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; padding: 0;"><span style="font-size: 11px; color: rgba(242,238,230,0.55);">Anterior</span><span style="font-size: 15px; font-weight: 600;">92,5</span></button>
        <button style="height: 44px; border-radius: 14px; border: 1px solid #F49A6E; background: rgba(244,154,110,0.10); color: #F2EEE6; font-family: Inter, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; padding: 0;"><span style="font-size: 11px; color: rgba(244,154,110,0.95);">Sugerida</span><span style="font-size: 15px; font-weight: 600;">95</span></button>
        <button style="height: 44px; border-radius: 14px; border: 1px solid rgba(242,238,230,0.10); background: #111111; color: #F2EEE6; font-family: Inter, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; padding: 0;"><span style="font-size: 11px; color: rgba(242,238,230,0.55);">+2,5</span><span style="font-size: 15px; font-weight: 600;">97,5</span></button>
      </div>
    </div>

    <div style="padding: 14px 16px 16px 16px; display: flex; flex-direction: column; gap: 14px;">
      <div style="display: flex; flex-direction: column; gap: 8px;">
        <div style="font-size: 12px; font-weight: 600; letter-spacing: 1.6px; color: rgba(242,238,230,0.62);">REPS</div>
        <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px;">
          <button style="height: 40px; border-radius: 20px; border: none; background: #1A1A1A; color: rgba(242,238,230,0.55); font-family: Syne, sans-serif; font-weight: 700; font-size: 17px;">4</button>
          <button style="height: 40px; border-radius: 20px; border: none; background: #1A1A1A; color: rgba(242,238,230,0.75); font-family: Syne, sans-serif; font-weight: 700; font-size: 17px;">5</button>
          <button style="height: 40px; border-radius: 20px; border: none; background: #F2EEE6; color: #0B0B0B; font-family: Syne, sans-serif; font-weight: 700; font-size: 17px;">6</button>
          <button style="height: 40px; border-radius: 20px; border: none; background: #1A1A1A; color: rgba(242,238,230,0.75); font-family: Syne, sans-serif; font-weight: 700; font-size: 17px;">7</button>
          <button style="height: 40px; border-radius: 20px; border: none; background: #1A1A1A; color: rgba(242,238,230,0.55); font-family: Syne, sans-serif; font-weight: 700; font-size: 17px;">8</button>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px;">
        <div style="display: flex; align-items: baseline; justify-content: space-between;">
          <div style="font-size: 12px; font-weight: 600; letter-spacing: 1.6px; color: rgba(242,238,230,0.62);">ESFUERZO</div>
          <div style="font-size: 14px; font-weight: 600;">{{levelLabel}} <span style="font-weight: 400; color: rgba(242,238,230,0.55);">· {{levelHint}}</span></div>
        </div>
        <div class="{{fireClass}}" style="position: relative; height: 46px; border-radius: 23px; background: #1A1A1A; box-shadow: inset 0 2px 6px rgba(0,0,0,0.6); overflow: visible;">
          <div class="fill" style="position: absolute; left: 0; top: 0; bottom: 0; width: {{fillPct}}; border-radius: 23px; background: {{fillBg}}; overflow: hidden;">
            <sc-for list="{{particles}}" as="pt" hint-placeholder-count="0">
              <sc-if value="{{pt.show}}" hint-placeholder-val="{{false}}">
                <span class="p" style="left: {{pt.left}}; width: {{pt.size}}; height: {{pt.size}}; background: {{pt.color}}; animation-delay: {{pt.delay}};"></span>
              </sc-if>
            </sc-for>
          </div>
          <div style="position: absolute; top: -5px; left: calc(41.67% - 1px); width: 2px; height: 56px; border-radius: 1px; background: rgba(242,238,230,0.35);"></div>
          <div class="thumb" style="position: absolute; top: 5px; left: {{thumbLeft}}; width: 36px; height: 36px; border-radius: 18px; background: #F2EEE6; box-shadow: 0 2px 8px rgba(0,0,0,0.5);"></div>
          <div style="position: absolute; inset: 0; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr));">
            <sc-for list="{{stops}}" as="st" hint-placeholder-count="6">
              <button aria-label="{{st.aria}}" onClick="{{st.pick}}" style="border: none; background: transparent; padding: 0; cursor: pointer;"></button>
            </sc-for>
          </div>
        </div>
        <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); font-size: 11px; color: rgba(242,238,230,0.45); text-align: center;">
          <span>RIR 4</span><span>3</span><span style="color: #F2EEE6; font-weight: 600;">2 · plan</span><span>1</span><span>0</span><span style="color: #F49A6E; font-weight: 600;">Fallo</span>
        </div>
      </div>

      <div style="display: flex; align-items: center; gap: 8px;">
        <button style="height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid rgba(242,238,230,0.12); background: #161616; color: #F2EEE6; font-family: Inter, sans-serif; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 6h10"></path><path d="M18 6h2"></path><circle cx="16" cy="6" r="2"></circle><path d="M4 18h4"></path><path d="M12 18h8"></path><circle cx="10" cy="18" r="2"></circle><path d="M4 12h16"></path></svg>Avanzado</button>
        <button style="height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid rgba(242,238,230,0.12); background: #161616; color: #F2EEE6; font-family: Inter, sans-serif; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="3"></rect><circle cx="12" cy="13.5" r="3.5"></circle><path d="M8 7l1.5-3h5L16 7"></path></svg>Modo visual</button>
        <div style="flex: 1;"></div>
        <button aria-label="Registrar serie" style="width: 56px; height: 56px; border-radius: 28px; border: none; background: #F2EEE6; color: #0B0B0B; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 18px rgba(0,0,0,0.5);">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
        </button>
      </div>
    </div>
  </div>

  <div style="position: relative; margin-top: 12px; display: flex; align-items: center; justify-content: center; gap: 12px;">
    <button aria-label="Serie anterior" style="width: 32px; height: 32px; border-radius: 16px; border: none; background: #121212; color: rgba(242,238,230,0.7); display: flex; align-items: center; justify-content: center; padding: 0;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></button>
    <div style="display: flex; gap: 6px; align-items: center;"><span style="width: 18px; height: 6px; border-radius: 3px; background: #F2EEE6;"></span><span style="width: 6px; height: 6px; border-radius: 3px; background: rgba(242,238,230,0.25);"></span><span style="width: 6px; height: 6px; border-radius: 3px; background: rgba(242,238,230,0.25);"></span><span style="width: 6px; height: 6px; border-radius: 3px; background: rgba(242,238,230,0.25);"></span></div>
    <button aria-label="Serie siguiente" style="width: 32px; height: 32px; border-radius: 16px; border: none; background: #121212; color: rgba(242,238,230,0.7); display: flex; align-items: center; justify-content: center; padding: 0;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 78px; background: #0D0D0D; border-top-left-radius: 26px; border-top-right-radius: 26px; border-top: 1px solid rgba(242,238,230,0.07); display: flex; flex-direction: column; align-items: center; padding-top: 8px; box-sizing: border-box;">
    <div style="width: 36px; height: 4px; border-radius: 2px; background: rgba(242,238,230,0.22);"></div>
    <div style="display: flex; gap: 8px; margin-top: 12px; align-items: center;">
      <div style="height: 34px; padding: 0 14px; border-radius: 17px; background: #F2EEE6; color: #0B0B0B; font-size: 13px; font-weight: 600; display: flex; align-items: center;">1/4 · Sentadilla trasera</div>
      <div style="height: 34px; padding: 0 14px; border-radius: 17px; background: #161616; color: rgba(242,238,230,0.7); font-size: 13px; display: flex; align-items: center;">Peso muerto rumano</div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { level: 0 };
  }
  renderVals() {
    const level = this.state.level;
    const labels = ['RIR 4', 'RIR 3', 'RIR 2', 'RIR 1', 'RIR 0', 'Fallo'];
    const hints = ['cómodo', 'firme', 'exigente', 'muy duro', 'al límite', 'todo'];
    const fills = [
      'linear-gradient(90deg, #3A3A3A, #5A5753)',
      'linear-gradient(90deg, #3A3A3A, #8A847B)',
      'linear-gradient(90deg, #4A4640, #CFC8BC)',
      'linear-gradient(90deg, #5B4A3A, #F7CF73)',
      'linear-gradient(90deg, #6B3E2C, #F49A6E 70%, #F7CF73)',
      'linear-gradient(90deg, #7A2E1F, #F06A3E 55%, #F7CF73 85%, #FFF1C8)'
    ];
    const counts = [0, 0, 2, 6, 11, 16];
    const colors = ['#F7CF73', '#F49A6E', '#FFE2B0', '#F06A3E'];
    const particles = [];
    for (let i = 0; i < 16; i++) {
      const left = (6 + (i * 37) % 88);
      const size = 3 + (i * 7) % 5;
      particles.push({
        show: i < counts[level],
        left: left + '%',
        size: size + 'px',
        color: colors[i % colors.length],
        delay: ((i * 0.23) % 1.6).toFixed(2) + 's'
      });
    }
    const pct = 16.66 + level * 16.67;
    const stops = labels.map((label, i) => ({
      aria: 'Esfuerzo ' + label,
      pick: () => this.setState({ level: i })
    }));
    return {
      levelLabel: labels[level],
      levelHint: hints[level],
      fireClass: 'lv' + level,
      fillPct: Math.min(100, pct).toFixed(1) + '%',
      fillBg: fills[level],
      thumbLeft: 'calc(' + Math.min(100, pct).toFixed(1) + '% - 41px)',
      particles,
      stops
    };
  }
}
</script>
</body>
</html>
