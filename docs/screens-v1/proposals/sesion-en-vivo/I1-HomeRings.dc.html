<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>RINGS de Inicio vivos</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Syne:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#F2EEE6}a:hover{color:#ffffff}
@keyframes glint{0%{stroke-dashoffset:420}60%,100%{stroke-dashoffset:-420}}
.gl{animation:glint 6s ease-in-out infinite}
@keyframes hop{
  0%{transform:translate(219px,212px) scale(1,1)}
  6%{transform:translate(219px,212px) scale(1.12,.78);animation-timing-function:ease-out}
  14%{transform:translate(214px,152px) scale(.94,1.1);animation-timing-function:ease-in}
  21%{transform:translate(202px,138px) scale(1.14,.8)}
  25%,30%{transform:translate(202px,138px) scale(1,1)}
  35%{transform:translate(202px,138px) scale(1.12,.78);animation-timing-function:ease-out}
  43%{transform:translate(196px,84px) scale(.94,1.1);animation-timing-function:ease-in}
  50%{transform:translate(185px,72px) scale(1.14,.8)}
  54%,68%{transform:translate(185px,72px) scale(1,1)}
  73%{transform:translate(185px,72px) scale(1.12,.78);animation-timing-function:ease-out}
  81%{transform:translate(256px,34px) scale(.92,1.12);animation-timing-function:ease-in}
  93%{transform:translate(219px,212px) scale(1.16,.76)}
  100%{transform:translate(219px,212px) scale(1,1)}
}
.hop{animation:hop 7.5s linear infinite}
@keyframes wave{0%,56%,70%,100%{transform:rotate(0deg)}60%,66%{transform:rotate(-70deg)}63%{transform:rotate(-40deg)}}
.arm{transform-box:fill-box;transform-origin:0% 0%;animation:wave 7.5s ease-in-out infinite}
@keyframes to0{0%{transform:translate(219px,150px) scale(.94,1.1)}70%{transform:translate(219px,212px) scale(1.16,.76)}100%{transform:translate(219px,212px) scale(1,1)}}
@keyframes to1{0%{transform:translate(202px,70px) scale(.94,1.1)}70%{transform:translate(202px,138px) scale(1.16,.76)}100%{transform:translate(202px,138px) scale(1,1)}}
@keyframes to2{0%{transform:translate(185px,14px) scale(.94,1.1)}70%{transform:translate(185px,72px) scale(1.16,.76)}100%{transform:translate(185px,72px) scale(1,1)}}
.to0{animation:to0 .55s cubic-bezier(.3,0,.6,1) forwards}
.to1{animation:to1 .55s cubic-bezier(.3,0,.6,1) forwards}
.to2{animation:to2 .55s cubic-bezier(.3,0,.6,1) forwards}
@keyframes flashB{0%,3%{opacity:.75}12%,90%{opacity:.22}94%,100%{opacity:.75}}
@keyframes flashM{0%,19%{opacity:.22}22%{opacity:.75}32%,100%{opacity:.22}}
@keyframes flashT{0%,48%{opacity:.22}51%{opacity:.75}62%,100%{opacity:.22}}
.fB{animation:flashB 7.5s linear infinite}
.fM{animation:flashM 7.5s linear infinite}
.fT{animation:flashT 7.5s linear infinite}
.ring{transition:opacity .3s ease}
.panel{transition:opacity .25s ease}
@media (prefers-reduced-motion: reduce){.gl,.hop,.arm,.fB,.fM,.fT,.to0,.to1,.to2{animation:none}.orb{display:none}.hop{transform:translate(219px,212px)}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #000000; color: #F2EEE6; font-family: Inter, sans-serif; position: relative; overflow: hidden;">
  <div style="padding: 22px 20px 0 20px;">
    <div style="font-size: 13px; color: rgba(242,238,230,0.55);">Jueves 16 de octubre</div>
    <div style="font-family: Syne, sans-serif; font-weight: 700; font-size: 30px; line-height: 36px;">Hoy</div>
  </div>

  <div style="margin-top: 14px; padding: 0 20px; display: flex; justify-content: space-between; align-items: baseline;">
    <span style="font-size: 12px; font-weight: 600; letter-spacing: 1.6px; color: rgba(242,238,230,0.55);">TUS RINGS</span>
    <span style="font-size: 12px; color: rgba(242,238,230,0.45);">actualizado hace 1 h</span>
  </div>

  <div style="position: relative; width: 330px; height: 253px; margin: 4px auto 0 auto;">
    <svg width="330" height="253" viewBox="0 0 300 230" role="img" aria-label="Músculos 89 %, Energía 88 %, Columna 82 %">
      <defs>
        <filter id="i1g" x="-20%" y="-40%" width="140%" height="180%"><feGaussianBlur stdDeviation="5"></feGaussianBlur></filter>
        <filter id="i1d" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="2.2"></feGaussianBlur></filter>
        <linearGradient id="i1B" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5E7EC4"></stop><stop offset="1" stop-color="#B9CFFF"></stop></linearGradient>
        <linearGradient id="i1M" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#C7704A"></stop><stop offset="1" stop-color="#FFC2A3"></stop></linearGradient>
        <linearGradient id="i1E" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#C9A04A"></stop><stop offset="1" stop-color="#FFE7A8"></stop></linearGradient>
        <path id="oB" d="M12 178 a138 40 0 1 0 276 0 a138 40 0 1 0 -276 0"></path>
        <path id="oM" d="M46 112 a104 30 0 1 0 208 0 a104 30 0 1 0 -208 0"></path>
        <path id="oT" d="M80 54 a70 21 0 1 0 140 0 a70 21 0 1 0 -140 0"></path>
      </defs>

      <g class="ring" opacity="{{opB}}">
        <ellipse cx="150" cy="178" rx="138" ry="40" fill="none" stroke="#151515" stroke-width="18"></ellipse>
        <ellipse class="fB" cx="150" cy="178" rx="138" ry="40" fill="none" stroke="#8FB2FF" stroke-width="18" stroke-dasharray="470 560" stroke-linecap="round" opacity="0.22" filter="url(#i1g)"></ellipse>
        <ellipse cx="150" cy="178" rx="138" ry="40" fill="none" stroke="url(#i1B)" stroke-width="18" stroke-dasharray="470 560" stroke-linecap="round"></ellipse>
        <ellipse class="gl" cx="150" cy="178" rx="138" ry="40" fill="none" stroke="rgba(255,255,255,0.55)" stroke-width="5" stroke-dasharray="40 900" stroke-linecap="round"></ellipse>
      </g>
      <g class="ring" opacity="{{opM}}">
        <ellipse cx="150" cy="112" rx="104" ry="30" fill="none" stroke="#151515" stroke-width="16"></ellipse>
        <ellipse class="fM" cx="150" cy="112" rx="104" ry="30" fill="none" stroke="#F49A6E" stroke-width="16" stroke-dasharray="395 460" stroke-linecap="round" opacity="0.22" filter="url(#i1g)"></ellipse>
        <ellipse cx="150" cy="112" rx="104" ry="30" fill="none" stroke="url(#i1M)" stroke-width="16" stroke-dasharray="395 460" stroke-linecap="round"></ellipse>
        <ellipse class="gl" cx="150" cy="112" rx="104" ry="30" fill="none" stroke="rgba(255,255,255,0.55)" stroke-width="4" stroke-dasharray="34 900" stroke-linecap="round" style="animation-delay: 1.2s"></ellipse>
      </g>
      <g class="ring" opacity="{{opT}}">
        <ellipse cx="150" cy="54" rx="70" ry="21" fill="none" stroke="#151515" stroke-width="14"></ellipse>
        <ellipse class="fT" cx="150" cy="54" rx="70" ry="21" fill="none" stroke="#F7CF73" stroke-width="14" stroke-dasharray="265 320" stroke-linecap="round" opacity="0.22" filter="url(#i1g)"></ellipse>
        <ellipse cx="150" cy="54" rx="70" ry="21" fill="none" stroke="url(#i1E)" stroke-width="14" stroke-dasharray="265 320" stroke-linecap="round"></ellipse>
        <ellipse class="gl" cx="150" cy="54" rx="70" ry="21" fill="none" stroke="rgba(255,255,255,0.55)" stroke-width="3.5" stroke-dasharray="26 900" stroke-linecap="round" style="animation-delay: 2.4s"></ellipse>
      </g>

      <g class="orb">
        <circle r="5" fill="#B9CFFF" opacity="0.6" filter="url(#i1d)"><animateMotion dur="9s" repeatCount="indefinite"><mpath href="#oB"></mpath></animateMotion></circle>
        <circle r="2.2" fill="#FFFFFF"><animateMotion dur="9s" repeatCount="indefinite"><mpath href="#oB"></mpath></animateMotion></circle>
        <circle r="1.6" fill="#B9CFFF"><animateMotion dur="13s" begin="-6s" repeatCount="indefinite"><mpath href="#oB"></mpath></animateMotion></circle>
        <circle r="5" fill="#FFC2A3" opacity="0.6" filter="url(#i1d)"><animateMotion dur="6.5s" begin="-2s" repeatCount="indefinite"><mpath href="#oM"></mpath></animateMotion></circle>
        <circle r="2.2" fill="#FFFFFF"><animateMotion dur="6.5s" begin="-2s" repeatCount="indefinite"><mpath href="#oM"></mpath></animateMotion></circle>
        <circle r="1.6" fill="#FFC2A3"><animateMotion dur="10s" begin="-7s" repeatCount="indefinite"><mpath href="#oM"></mpath></animateMotion></circle>
        <circle r="5" fill="#FFE7A8" opacity="0.6" filter="url(#i1d)"><animateMotion dur="4.2s" begin="-1s" repeatCount="indefinite"><mpath href="#oT"></mpath></animateMotion></circle>
        <circle r="2.2" fill="#FFFFFF"><animateMotion dur="4.2s" begin="-1s" repeatCount="indefinite"><mpath href="#oT"></mpath></animateMotion></circle>
      </g>

      <g class="{{charCls}}">
        <g transform="translate(0,-2)">
          <ellipse cx="0" cy="2" rx="7" ry="2" fill="rgba(0,0,0,0.55)"></ellipse>
          <path d="M-4 0 L-1 -9 L0 -14 M4 0 L1 -9 L0 -14" fill="none" stroke="#F2EEE6" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path>
          <path d="M0 -14 L0 -25" stroke="#F2EEE6" stroke-width="3" stroke-linecap="round"></path>
          <path d="M0 -23 L-6 -16" stroke="#F2EEE6" stroke-width="2.4" stroke-linecap="round"></path>
          <path class="arm" d="M0 -23 L7 -17" stroke="#F2EEE6" stroke-width="2.4" stroke-linecap="round"></path>
          <circle cx="0" cy="-30" r="4.4" fill="#F2EEE6"></circle>
          <path d="M-4.2 -31.5 a4.4 4.4 0 0 1 8.4 0" fill="none" stroke="{{charAccent}}" stroke-width="2.2" stroke-linecap="round"></path>
        </g>
      </g>
    </svg>
    <button aria-label="Energía 88 %" onClick="{{pickT}}" style="position: absolute; left: 82px; top: 26px; width: 166px; height: 64px; border: none; background: transparent; cursor: pointer;"></button>
    <button aria-label="Músculos 89 %" onClick="{{pickM}}" style="position: absolute; left: 40px; top: 94px; width: 250px; height: 70px; border: none; background: transparent; cursor: pointer;"></button>
    <button aria-label="Columna 82 %" onClick="{{pickB}}" style="position: absolute; left: 4px; top: 168px; width: 322px; height: 82px; border: none; background: transparent; cursor: pointer;"></button>
  </div>

  <div style="margin: 6px 20px 0 20px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); text-align: center;">
    <button onClick="{{pickM}}" style="border: none; background: transparent; color: #F2EEE6; font-family: Inter, sans-serif; padding: 4px 0; opacity: {{opM}};"><div style="font-size: 11px; font-weight: 600; letter-spacing: 1.6px; color: #F49A6E;">MÚSCULOS</div><div style="font-family: Syne, sans-serif; font-weight: 700; font-size: 22px;">89 %</div></button>
    <button onClick="{{pickT}}" style="border: none; background: transparent; color: #F2EEE6; font-family: Inter, sans-serif; padding: 4px 0; opacity: {{opT}};"><div style="font-size: 11px; font-weight: 600; letter-spacing: 1.6px; color: #F7CF73;">ENERGÍA</div><div style="font-family: Syne, sans-serif; font-weight: 700; font-size: 22px;">88 %</div></button>
    <button onClick="{{pickB}}" style="border: none; background: transparent; color: #F2EEE6; font-family: Inter, sans-serif; padding: 4px 0; opacity: {{opB}};"><div style="font-size: 11px; font-weight: 600; letter-spacing: 1.6px; color: #8FB2FF;">COLUMNA</div><div style="font-family: Syne, sans-serif; font-weight: 700; font-size: 22px;">82 %</div></button>
  </div>

  <div style="margin: 10px 16px 0 16px; height: 96px; position: relative;">
    <sc-if value="{{noSel}}">
      <div style="height: 96px; display: flex; align-items: center; justify-content: center; font-size: 13px; color: rgba(242,238,230,0.5);">Toca un anillo para ver de dónde sale</div>
    </sc-if>
    <sc-if value="{{hasSel}}">
      <div class="panel" style="height: 96px; box-sizing: border-box; border-radius: 22px; background: #111111; border: 1px solid rgba(242,238,230,0.07); padding: 12px 14px; display: flex; align-items: center; gap: 12px;">
        <div style="width: 6px; align-self: stretch; border-radius: 3px; background: {{selColor}};"></div>
        <div style="flex: 1; min-width: 0;">
          <div style="font-size: 15px; font-weight: 600;">{{selName}} · {{selValue}}</div>
          <div style="font-size: 13px; line-height: 18px; color: rgba(242,238,230,0.65);">{{selLine}}</div>
        </div>
        <a href="{{selHref}}" style="height: 36px; padding: 0 14px; border-radius: 18px; background: #F2EEE6; color: #0B0B0B; font-size: 13px; font-weight: 600; display: flex; align-items: center; text-decoration: none;">Ajustar</a>
        <button onClick="{{clear}}" aria-label="Cerrar el detalle" style="width: 32px; height: 32px; border-radius: 16px; border: none; background: #1B1B1B; color: #F2EEE6; display: flex; align-items: center; justify-content: center; padding: 0;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12"></path><path d="M18 6L6 18"></path></svg></button>
      </div>
    </sc-if>
  </div>

  <div style="margin: 14px 16px 0 16px; border-radius: 24px; background: #111111; border: 1px solid rgba(242,238,230,0.07); padding: 16px; display: flex; align-items: center; gap: 12px;">
    <div style="flex: 1;">
      <div style="font-size: 12px; font-weight: 600; letter-spacing: 1.4px; color: rgba(242,238,230,0.55);">SESIÓN DE HOY</div>
      <div style="font-family: Syne, sans-serif; font-weight: 700; font-size: 20px; margin-top: 2px;">Pierna A</div>
      <div style="font-size: 13px; color: rgba(242,238,230,0.62);">6 ejercicios · ≈ 58 min</div>
    </div>
    <button style="height: 44px; padding: 0 18px; border-radius: 22px; border: none; background: #F2EEE6; color: #0B0B0B; font-family: Inter, sans-serif; font-size: 14px; font-weight: 600;">Empezar</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sel: null };
  }
  renderVals() {
    const sel = this.state.sel;
    const info = {
      B: { name: 'Columna', value: '82 %', color: '#8FB2FF', line: 'La carga que acumula tu espalda.', href: 'G5-AjusteEnergia.dc.html', to: 'to0', accent: '#8FB2FF' },
      M: { name: 'Músculos', value: '89 %', color: '#F49A6E', line: 'Cuánto se han recuperado tus músculos.', href: 'G6-AjusteMusculos.dc.html', to: 'to1', accent: '#F49A6E' },
      T: { name: 'Energía', value: '88 %', color: '#F7CF73', line: 'Tu reserva para entrenar fuerte.', href: 'G5-AjusteEnergia.dc.html', to: 'to2', accent: '#F7CF73' }
    };
    const s = sel ? info[sel] : null;
    const op = (k) => (!sel || sel === k) ? 1 : 0.35;
    return {
      opB: op('B'), opM: op('M'), opT: op('T'),
      charCls: s ? s.to : 'hop',
      charAccent: s ? s.accent : '#F49A6E',
      noSel: !s, hasSel: !!s,
      selName: s ? s.name : '', selValue: s ? s.value : '', selColor: s ? s.color : '#F2EEE6',
      selLine: s ? s.line : '', selHref: s ? s.href : '#',
      pickB: () => this.setState({ sel: 'B' }),
      pickM: () => this.setState({ sel: 'M' }),
      pickT: () => this.setState({ sel: 'T' }),
      clear: () => this.setState({ sel: null })
    };
  }
}
</script>
</body>
</html>
