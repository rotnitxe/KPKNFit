<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Mini-juego del descanso</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Syne:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#F2EEE6}a:hover{color:#ffffff}
@keyframes legA{0%,100%{transform:rotate(30deg)}50%{transform:rotate(-30deg)}}
@keyframes legB{0%,100%{transform:rotate(-30deg)}50%{transform:rotate(30deg)}}
.la{animation:legA .28s ease-in-out infinite}.lb{animation:legB .28s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.la,.lb{animation:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #000000; color: #F2EEE6; font-family: Inter, sans-serif; position: relative; overflow: hidden; display: flex; flex-direction: column; padding: 20px 20px 26px 20px; gap: 16px;">
  <div style="display: flex; align-items: center; gap: 12px;">
    <a href="F1-DescansoCompleto.dc.html" aria-label="Volver al descanso" style="width: 40px; height: 40px; border-radius: 20px; border: 1px solid rgba(242,238,230,0.10); background: #111111; color: #F2EEE6; display: flex; align-items: center; justify-content: center; text-decoration: none;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
    <div style="flex: 1;">
      <div style="font-size: 15px; font-weight: 600;">Salta las mancuernas</div>
      <div style="font-size: 13px; color: rgba(242,238,230,0.6);">El descanso sigue corriendo</div>
    </div>
    <div style="text-align: right;">
      <div style="font-family: Syne, sans-serif; font-weight: 700; font-size: 26px; line-height: 28px;">{{time}}</div>
      <div style="font-size: 11px; color: rgba(242,238,230,0.5);">de 4:09</div>
    </div>
  </div>
  <div style="height: 6px; border-radius: 3px; background: #1A1A1A; overflow: hidden;"><div style="height: 6px; width: {{progress}}; background: linear-gradient(90deg, #8FB2FF, #F49A6E, #F7CF73);"></div></div>

  <button onClick="{{jump}}" aria-label="Saltar" style="position: relative; height: 420px; border-radius: 28px; border: 1px solid rgba(242,238,230,0.08); background: radial-gradient(120% 80% at 50% 0%, #1A1612 0%, #0A0A0A 70%); overflow: hidden; padding: 0; cursor: pointer;">
    <div style="position: absolute; left: 16px; top: 14px; font-size: 13px; color: rgba(242,238,230,0.7); text-align: left;">Saltos <span style="font-family: Syne, sans-serif; font-weight: 700; font-size: 20px; color: #F2EEE6;">{{score}}</span><br><span style="font-size: 11px; color: rgba(242,238,230,0.45);">récord {{best}}</span></div>
    <sc-if value="{{hitFlash}}" hint-placeholder-val="{{false}}"><div style="position: absolute; inset: 0; background: rgba(239,111,100,0.12);"></div></sc-if>
    <div style="position: absolute; left: 0; right: 0; bottom: 92px; height: 2px; background: rgba(242,238,230,0.18);"></div>
    <div style="position: absolute; left: 0; right: 0; bottom: 60px; height: 1px; background: rgba(242,238,230,0.06);"></div>
    <sc-for list="{{obs}}" as="o" hint-placeholder-count="2">
      <svg style="position: absolute; bottom: 94px; left: {{o.left}};" width="30" height="20" viewBox="0 0 30 20" aria-hidden="true"><rect x="0" y="4" width="6" height="14" rx="2" fill="#F49A6E"></rect><rect x="24" y="4" width="6" height="14" rx="2" fill="#F49A6E"></rect><rect x="6" y="9" width="18" height="4" rx="2" fill="#F2EEE6"></rect></svg>
    </sc-for>
    <svg style="position: absolute; left: 60px; bottom: {{runnerBottom}};" width="24" height="34" viewBox="-12 -32 24 34" aria-hidden="true">
      <circle cx="0" cy="-26" r="4" fill="#0B0B0B" stroke="#F2EEE6" stroke-width="1.8"></circle>
      <line x1="0" y1="-22" x2="0" y2="-11" stroke="#F2EEE6" stroke-width="1.8" stroke-linecap="round"></line>
      <line x1="0" y1="-19" x2="7" y2="-15" stroke="#F2EEE6" stroke-width="1.8" stroke-linecap="round"></line>
      <line x1="0" y1="-19" x2="-6" y2="-14" stroke="#F2EEE6" stroke-width="1.8" stroke-linecap="round"></line>
      <g transform="translate(0 -11)"><line class="la" x1="0" y1="0" x2="0" y2="11" stroke="#F2EEE6" stroke-width="1.8" stroke-linecap="round"></line><line class="lb" x1="0" y1="0" x2="0" y2="11" stroke="#F2EEE6" stroke-width="1.8" stroke-linecap="round"></line></g>
    </svg>
    <div style="position: absolute; left: 0; right: 0; bottom: 22px; text-align: center; font-size: 13px; color: rgba(242,238,230,0.5);">Toca para saltar</div>
  </button>

  <div style="flex: 1;"></div>
  <div style="border-radius: 18px; background: #111111; padding: 12px 14px; display: flex; align-items: center; justify-content: space-between;">
    <div><div style="font-size: 12px; color: rgba(242,238,230,0.55);">Después</div><div style="font-size: 15px; font-weight: 600;">Serie 2 · 95 kg × 4–6</div></div>
    <a href="F1-DescansoCompleto.dc.html" style="height: 36px; padding: 0 14px; border-radius: 18px; background: #F2EEE6; color: #0B0B0B; font-size: 13px; font-weight: 600; display: flex; align-items: center; text-decoration: none;">Volver al descanso</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { y: 0, vy: 0, obs: [{ x: 320, counted: false }, { x: 520, counted: false }], score: 0, best: 12, remaining: 161, flash: 0 };
    this.iv = null; this.clock = null;
  }
  componentDidMount() {
    this.iv = setInterval(() => this.tick(), 40);
    this.clock = setInterval(() => {
      const r = this.state.remaining - 1;
      this.setState({ remaining: r <= 0 ? 249 : r });
    }, 1000);
  }
  componentWillUnmount() { clearInterval(this.iv); clearInterval(this.clock); }
  tick() {
    let { y, vy, obs, score, best, flash } = this.state;
    vy = vy - 1.5; y = Math.max(0, y + vy); if (y === 0) vy = 0;
    let hit = false;
    obs = obs.map((o) => {
      const nx = o.x - 6;
      let counted = o.counted;
      if (nx < 54 && nx > 36 && y < 18) hit = true;
      if (!counted && nx < 36) { counted = true; if (!hit) score += 1; }
      return { x: nx, counted };
    }).filter((o) => o.x > -40);
    const last = obs.length ? obs[obs.length - 1].x : 0;
    if (last < 260) obs.push({ x: 340 + Math.floor(Math.random() * 140), counted: false });
    if (hit) { best = Math.max(best, score); score = 0; flash = 6; obs = obs.filter((o) => o.x > 90); }
    if (flash > 0) flash -= 1;
    this.setState({ y, vy, obs, score, best: Math.max(best, score), flash });
  }
  renderVals() {
    const { y, obs, score, best, remaining, flash } = this.state;
    const m = Math.floor(remaining / 60), s = remaining % 60;
    return {
      obs: obs.map((o) => ({ left: o.x + 'px' })),
      runnerBottom: (92 + y) + 'px',
      score, best,
      hitFlash: flash > 0,
      time: m + ':' + String(s).padStart(2, '0'),
      progress: ((249 - remaining) / 249 * 100).toFixed(1) + '%',
      jump: () => { if (this.state.y === 0) this.setState({ vy: 14.5 }); }
    };
  }
}
</script>
</body>
</html>
