<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>KPKN · Sesión en vivo · todas las instancias</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--cream:#F2EEE6;--muted:#B5B1AC;--faint:#7A7670;--hair:rgba(255,255,255,.07);--bg:#0B0B0A;--card:#111111;--inset:#1C1C1B;--green:#7FE3B0;--amber:#FFA15C;--sage:#A9C4B6;--red:#FF9B92}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#060606;color:var(--cream);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{display:flex;gap:44px;padding:32px;align-items:flex-start}
.rail{width:300px;position:sticky;top:32px;max-height:calc(100vh - 64px);overflow:auto}
.rail::-webkit-scrollbar{width:3px}.rail::-webkit-scrollbar-thumb{background:#222}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.mark{width:34px;height:34px;border-radius:10px;background:var(--cream);color:#0B0B0A;display:grid;place-items:center;font-family:Syne;font-weight:800;font-size:15px}
.brand b{font-family:Syne;font-weight:800;font-size:18px}.brand small{display:block;color:var(--faint);font-size:10.5px;margin-top:1px}
.modebtns{display:flex;gap:4px;background:#141413;border-radius:14px;padding:3px;margin-bottom:10px}
.modebtns button{flex:1;height:28px;border:0;border-radius:11px;background:none;color:var(--faint);font:inherit;font-size:11px;font-weight:600;cursor:pointer}
.modebtns button.on{background:var(--cream);color:#0B0B0A}
.g{font-size:9px;letter-spacing:1.3px;color:var(--faint);text-transform:uppercase;margin:14px 0 5px;font-weight:600}
.it{display:block;width:100%;text-align:left;background:none;border:0;color:var(--muted);font:inherit;font-size:12px;padding:5px 8px;border-radius:7px;cursor:pointer}
.it small{display:block;font-size:9.5px;color:var(--faint);margin-top:1px}
.it.on{background:#171716;color:var(--cream)}
.phone{width:393px;height:852px;border-radius:46px;background:#000;border:1px solid #222;position:relative;overflow:hidden;box-shadow:0 30px 90px rgba(0,0,0,.65);flex:none}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg)}
.status{display:flex;justify-content:space-between;padding:13px 22px 0;font-size:12px;font-weight:600;flex:none}
.hdr{margin:8px 14px 0;padding:8px 9px 8px 11px;border-radius:999px;background:#141413;display:flex;align-items:center;gap:9px;border:1px solid rgba(255,255,255,.05);flex:none}
.hdr .txt{flex:1;min-width:0}.hdr .t{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .s{font-size:10px;color:var(--faint);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.circ{width:29px;height:29px;border-radius:50%;background:#1E1E1D;display:grid;place-items:center;font-size:12px;color:var(--muted);flex:none}
.restchip{display:flex;align-items:center;gap:5px;height:29px;padding:0 9px;border-radius:15px;background:rgba(242,238,230,.07);font-size:10.5px;font-weight:600;flex:none}
.ring{width:13px;height:13px;border-radius:50%;border:2px solid var(--cream);border-right-color:rgba(242,238,230,.18);transform:rotate(45deg)}
.zone{flex:1;min-height:0;display:flex;align-items:center;padding:10px 15px 0}
.card{width:100%;height:452px;background:var(--card);border:1px solid var(--hair);border-radius:28px;padding:13px 15px 0;display:flex;flex-direction:column;overflow:hidden;position:relative}
.card.mob{border-color:rgba(169,196,182,.22)}.card.warm{border-color:rgba(255,161,92,.22)}
.head{display:flex;align-items:center;gap:6px;flex:none;height:20px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--cream)}.card.mob .dot{background:var(--sage)}.card.warm .dot{background:var(--amber)}
.eyebrow{font-size:9px;letter-spacing:1.2px;text-transform:uppercase;font-weight:600;color:var(--faint)}
.card.mob .eyebrow{color:var(--sage)}.card.warm .eyebrow{color:var(--amber)}
.head .meta{margin-left:auto;font-size:9.5px;color:var(--faint)}
.tag{display:inline-flex;align-items:center;gap:3px;height:19px;padding:0 7px;border-radius:9px;background:rgba(242,238,230,.08);font-size:9px;font-weight:600;color:var(--muted)}
.tag.pr{background:rgba(127,227,176,.12);color:var(--green)}
.hero{display:flex;align-items:flex-end;gap:6px;flex:none;height:48px;margin-top:8px}
.hero .v{font-family:Syne;font-weight:800;font-size:38px;line-height:41px;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.hero .u{font-size:10.5px;color:var(--muted);font-weight:600;padding-bottom:3px}
.hero .side{margin-left:auto;text-align:right;padding-bottom:2px}
.hero .side b{font-family:Syne;font-size:15px}.hero .side span{display:block;font-size:9px;color:var(--faint);margin-top:1px}
.sub{font-size:10.5px;color:var(--faint);flex:none}
.body{flex:1;min-height:0;display:flex;flex-direction:column;padding-top:8px;overflow:hidden}
.kpills{display:flex;gap:4px;flex:none}
.kpill{flex:1;height:29px;border-radius:8px;background:var(--inset);display:flex;align-items:center;justify-content:center;gap:4px;font-size:10px;font-weight:600;color:var(--muted);white-space:nowrap}
.kpill b{color:var(--cream);font-family:Syne;font-size:11px}
.wheel{display:flex;align-items:center;justify-content:space-between;padding:0 3px;margin-top:5px;flex:none;height:42px}
.wheel span{font-family:Syne;font-weight:700;font-size:14px;color:var(--faint);width:28px;text-align:center}
.wheel span.c{font-size:33px;color:var(--cream);width:62px;line-height:38px}
.wlab{display:flex;justify-content:space-between;padding:0 7px;flex:none}
.wlab span{font-size:7.5px;letter-spacing:1px;color:var(--faint);font-weight:600}
.fire{display:flex;gap:4px;margin-top:6px;flex:none}
.fire div{flex:1;height:24px;border-radius:6px;background:rgba(242,238,230,.09);display:grid;place-items:center;font-size:9.5px;font-weight:600;color:var(--faint)}
.fire div.on{background:var(--cream);color:#0B0B0A}
.pillrow{display:flex;gap:5px;flex:none;margin-top:6px}
.sp{height:24px;padding:0 9px;border-radius:12px;border:1px solid rgba(242,238,230,.13);display:flex;align-items:center;font-size:9.5px;font-weight:600;color:var(--muted)}
.band{display:flex;align-items:center;gap:6px;padding:5px 8px;border-radius:8px;background:rgba(255,155,146,.10);border:1px solid rgba(255,155,146,.24);font-size:9.5px;color:var(--red);flex:none;margin-top:6px}
.band.ok{background:rgba(127,227,176,.08);border-color:rgba(127,227,176,.25);color:var(--green)}
.band.dim{background:rgba(255,255,255,.04);border-color:rgba(255,255,255,.10);color:var(--faint)}
.hist{margin-top:auto;display:flex;align-items:flex-end;gap:10px;border-top:1px solid var(--hair);padding:7px 0 6px}
.hlab{font-size:7.5px;letter-spacing:1px;color:var(--faint);font-weight:600;line-height:12px}
.hlab b{font-family:Syne;font-size:12px;letter-spacing:0;color:var(--cream)}
.hbars{display:flex;align-items:flex-end;gap:3px;height:26px;margin-left:auto}
.hbars i{display:block;width:7px;border-radius:2px 2px 1px 1px;background:rgba(242,238,230,.22)}
.hbars i.on{background:var(--green)}
.acts{flex:none;display:flex;justify-content:space-between;padding:7px 0 11px;border-top:1px solid var(--hair)}
.acts span{font-size:10.5px;font-weight:600;color:var(--muted)}
.seg{display:flex;gap:3px;background:#0D0D0C;border-radius:14px;padding:3px;flex:none;margin-top:7px}
.seg b{flex:1;height:25px;border-radius:11px;display:grid;place-items:center;font-size:10px;font-weight:600;color:var(--faint)}
.seg b.on{background:var(--cream);color:#0B0B0A}
.chain{display:flex;align-items:center;gap:6px;padding:6px 9px;border-radius:10px;background:var(--inset);font-size:10px;flex:none;margin-top:7px}
.chain i{color:var(--faint);font-style:normal}
.trow{display:flex;align-items:center;padding:3px 1px;flex:1;min-height:0}
.trow .nm{font-size:11px}
.stepper{display:flex;align-items:center;gap:5px;margin-left:auto}
.stepper span{width:22px;height:22px;border-radius:6px;background:var(--inset);display:grid;place-items:center;font-size:10.5px;color:var(--muted)}
.stepper b{font-family:Syne;font-size:12px;min-width:42px;text-align:center}
.field{height:30px;border-radius:8px;background:var(--inset);display:flex;align-items:center;padding:0 9px;color:var(--faint);font-size:11px;flex:none}
.mrow{display:flex;align-items:center;gap:7px;padding:4px 4px;border-radius:7px;flex:1;min-height:0}
.mrow.on{background:rgba(242,238,230,.06)}.mrow.done .nm{color:var(--faint);text-decoration:line-through}
.check{width:15px;height:15px;border-radius:50%;border:1px solid rgba(242,238,230,.25);flex:none;display:grid;place-items:center;font-size:8px;color:#0B0B0A}
.mrow.done .check{background:var(--sage);border-color:var(--sage)}
.nm{font-size:11.5px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dose{font-size:9.5px;color:var(--faint)}
.mstage{flex:1;min-height:0;border-radius:13px;background:linear-gradient(160deg,#191816,#0E0E0E);border:1px solid rgba(255,255,255,.06);position:relative;display:grid;place-items:center;overflow:hidden;margin-top:7px}
.mstage .lbl{font-size:9px;color:var(--faint)}
.shutter{position:absolute;bottom:7px;left:50%;transform:translateX(-50%);width:34px;height:34px;border-radius:50%;background:var(--cream);box-shadow:0 0 0 3px rgba(0,0,0,.4),0 0 0 4px rgba(242,238,230,.2)}
.mtop{display:flex;gap:5px;align-items:center;flex:none;margin-top:7px}
.mtop .sw{display:flex;gap:2px;background:#0D0D0C;border-radius:11px;padding:2px}
.mtop .sw b{height:22px;padding:0 8px;border-radius:9px;display:grid;place-items:center;font-size:9.5px;font-weight:600;color:var(--faint)}
.mtop .sw b.on{background:var(--cream);color:#0B0B0A}
.thumbs{display:flex;gap:4px;flex:none;margin-top:5px}
.thumbs i{flex:1;height:26px;border-radius:6px;background:#171715;border:1px solid rgba(255,255,255,.06);display:grid;place-items:center;font-size:8px;font-style:normal;color:var(--faint)}
.mline{font-size:9px;color:var(--faint);margin-top:4px;flex:none}
.bottom{flex:none;margin:9px 13px 11px;padding:10px 11px 9px;border-radius:21px;background:#111110;border:1px solid rgba(255,255,255,.06)}
.roadhead{display:flex;justify-content:space-between;margin-bottom:7px}
.roadhead .l{font-size:9px;letter-spacing:1.1px;color:var(--faint);font-weight:600;text-transform:uppercase}
.roadhead .r{font-size:9.5px;color:var(--muted)}
.road{display:flex;gap:3px;height:4px}
.road i{display:block;border-radius:2px;background:rgba(242,238,230,.10)}
.road i.done{background:rgba(242,238,230,.55)}.road i.on{background:var(--cream)}
.roadlabels{display:flex;gap:3px;margin-top:4px}
.roadlabels span{font-size:7px;letter-spacing:.8px;color:var(--faint);font-weight:600;white-space:nowrap;overflow:hidden}
.roadlabels span.on{color:var(--cream)}
.navrow{display:flex;align-items:center;gap:8px;margin-top:9px}
.step{width:40px;height:40px;border-radius:12px;background:var(--inset);display:grid;place-items:center;font-size:14px;color:var(--muted);flex:none}
.rec{flex:1;height:40px;border-radius:12px;background:var(--cream);color:#0B0B0A;display:flex;align-items:center;justify-content:center;gap:6px;font-size:12.5px;font-weight:700}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.55);z-index:5}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:6;background:#121211;border-radius:26px 26px 0 0;border-top:1px solid rgba(255,255,255,.09);padding:8px 16px 16px;box-shadow:0 -24px 60px rgba(0,0,0,.6);max-height:80%;overflow:auto}
.sheet::-webkit-scrollbar{display:none}
.handle{width:34px;height:4px;border-radius:2px;background:rgba(255,255,255,.18);margin:0 auto 9px}
.stitle{font-family:Syne;font-weight:700;font-size:17px}
.sdesc{font-size:10.5px;color:var(--faint);margin:2px 0 9px}
.srow{display:flex;align-items:center;gap:8px;padding:9px 2px;border-bottom:1px solid rgba(255,255,255,.055);font-size:11.5px}
.srow .k{width:18px;color:var(--faint);font-size:10px}
.srow .x{margin-left:auto;color:var(--faint);font-size:10px}
.srow .x.on{color:var(--green)}
.table{flex:1;min-height:0;overflow:auto;padding:6px 13px 0}
.table::-webkit-scrollbar{display:none}
.tghead{display:flex;align-items:center;gap:6px;padding:2px 2px 5px;border-bottom:1px solid var(--hair);margin-top:7px}
.tghead .nm{font-size:10.5px;font-weight:600}
.tghead .meta{margin-left:auto;font-size:9px;color:var(--faint)}
.tr{display:grid;grid-template-columns:22px 1fr 68px 40px 14px;align-items:center;gap:6px;padding:5px 3px;border-bottom:1px solid rgba(255,255,255,.05);font-size:10px}
.tr .idx{color:var(--faint);font-size:9px}
.tr .ex{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr .ld{font-family:Syne;font-weight:700;font-size:11px;text-align:right}
.tr .ef{font-size:9px;color:var(--faint);text-align:right}
.tr .st{text-align:right;color:var(--faint);font-size:9px}
.tr.done .st{color:var(--green)}
.tr.active{background:rgba(242,238,230,.055);border-left:2px solid var(--cream);padding-left:4px}
.tr.active .ex{color:var(--cream);font-weight:600}
.editor{padding:7px 5px 8px;border-bottom:1px solid var(--hair);background:rgba(242,238,230,.03)}
.edrow{display:flex;align-items:center;gap:6px}
.edrow .big{font-family:Syne;font-weight:800;font-size:25px;letter-spacing:-.6px}
.edrow .u{font-size:9.5px;color:var(--faint);padding-top:4px}
.mini{display:flex;gap:4px;margin-left:auto}
.mini span{height:24px;min-width:40px;padding:0 6px;border-radius:6px;background:var(--inset);display:grid;place-items:center;font-size:9.5px;font-weight:600;color:var(--muted)}
.edrow2{display:flex;align-items:center;gap:5px;margin-top:7px}
.rir{display:flex;gap:3px}
.rir span{width:22px;height:20px;border-radius:5px;background:rgba(242,238,230,.08);display:grid;place-items:center;font-size:9px;color:var(--faint)}
.rir span.on{background:var(--cream);color:#0B0B0A;font-weight:700}
.edrow2 .e1{margin-left:auto;font-size:9px;color:var(--faint)}
.edacts{display:flex;gap:4px;margin-top:7px;flex-wrap:wrap}
.edacts span{height:21px;padding:0 7px;border-radius:10px;border:1px solid rgba(242,238,230,.12);font-size:8.5px;font-weight:600;color:var(--muted);display:flex;align-items:center}
</style>
</head>
<body>
<div class="wrap">
  <aside class="rail">
    <div class="brand"><div class="mark">K</div><div><b>KPKN Fit</b><small>Live · inventario completo</small></div></div>
    <div class="modebtns" id="modes"><button class="on" data-m="cards">Tarjetas</button><button data-m="mesa">Mesa</button></div>
    <div id="index"></div>
  </aside>
  <main class="phone" id="phone"></main>
</div>
<script>
const head=(t,s)=>'<div class="status"><span>1:47</span><span>▮▮▮</span></div><div class="hdr"><div class="circ">‹</div><div class="txt"><div class="t">'+t+'</div><div class="s">'+s+'</div></div><div class="restchip"><span class="ring"></span>1:12</div><div class="circ">⋯</div></div>';
const bottom=(label)=>'<div class="bottom"><div class="roadhead"><span class="l">Series · 3 de 9</span><span class="r">Sentadilla 3 / 4</span></div><div class="road"><i class="done" style="width:15%"></i><i class="done" style="width:20%"></i><i class="on" style="width:53%"></i><i style="width:12%"></i></div><div class="roadlabels"><span style="width:15%">MOV</span><span style="width:20%">APR</span><span class="on" style="width:53%">SER</span><span style="width:12%">REST</span></div><div class="navrow"><div class="step">‹</div><div class="rec">'+label+'</div><div class="step">›</div></div></div>';
const acts=(a)=>'<div class="acts">'+a.map(x=>'<span>'+x+'</span>').join('')+'</div>';
const hist='<div class="hist"><div class="hlab">ÚLTIMAS 4 · e1RM<br><b>112,5 kg</b></div><div class="hbars"><i style="height:34%"></i><i style="height:52%"></i><i style="height:70%"></i><i class="on" style="height:94%"></i></div></div>';
const wheel=(n)=>'<div class="wheel"><span>'+(n-2)+'</span><span>'+(n-1)+'</span><span class="c">'+n+'</span><span>'+(n+1)+'</span><span>'+(n+2)+'</span></div><div class="wlab"><span>REPS</span><span>OBJETIVO '+n+'</span></div>';
const fire=(i)=>'<div class="fire">'+[0,1,2,3,4].map((x,k)=>'<div class="'+(k===i?'on':'')+'">'+x+'</div>').join('')+'</div><div class="wlab" style="margin-top:3px"><span>RIR</span><span>FALLO</span></div>';
const kp='<div class="kpills"><div class="kpill">−2,5</div><div class="kpill">Sug <b>102,5</b></div><div class="kpill">+2,5</div></div>';
const rom='<div class="pillrow"><span class="sp">ROM</span><span class="sp">Vídeo</span><span class="sp">Detalles</span></div>';


const S={};
S.reps='<div class="card"><div class="head"><span class="dot"></span><span class="eyebrow">Serie efectiva</span><span class="tag pr" style="margin-left:6px">★ PR</span><span class="meta">3 / 4</span></div><div class="hero"><span class="v">100</span><span class="u">kg</span><span class="side"><b>RIR 2</b><span>e1RM 112,5</span></span></div><div class="sub">Objetivo 8 · tempo 2-0-1</div><div class="body">'+kp+wheel(8)+fire(2)+rom+hist+'</div>'+acts(['Avanzado','Modo visual','Historial'])+'</div>';
S.amrap='<div class="card"><div class="head"><span class="dot"></span><span class="eyebrow">AMRAP</span><span class="tag pr" style="margin-left:6px">mín 8</span><span class="meta">3 / 4</span></div><div class="hero"><span class="v">100</span><span class="u">kg</span><span class="side"><b>RIR 0</b><span>al fallo</span></span></div><div class="sub">Cuenta al e1RM</div><div class="body">'+kp+wheel(10)+'<div class="band ok">Resultado 11 reps · e1RM 118,4</div>'+rom+hist+'</div>'+acts(['Configurar','Modo visual','Historial'])+'</div>';
S.calib='<div class="card"><div class="head"><span class="dot"></span><span class="eyebrow">Calibrador</span><span class="tag" style="margin-left:6px">sin mínimo</span><span class="meta">3 / 4</span></div><div class="hero"><span class="v">90</span><span class="u">kg</span><span class="side"><b>RIR 0</b><span>a fallo</span></span></div><div class="sub">Serie de calibración</div><div class="body"><div class="band dim">Sin mínimo requerido · ajusta 1RM</div>'+kp+wheel(8)+fire(0)+rom+hist+'</div>'+acts(['Avanzado','Modo visual','Historial'])+'</div>';
S.rm='<div class="card"><div class="head"><span class="dot"></span><span class="eyebrow">RM</span><span class="meta">3 / 4</span></div><div class="hero"><span class="v">3</span><span class="u">RM</span><span class="side"><b>105 kg</b><span>objetivo</span></span></div><div class="sub">Máximo de 3 repeticiones</div><div class="body"><div class="field">Carga objetivo · última vez 102,5</div>'+wheel(3)+fire(0)+rom+hist+'</div>'+acts(['Avanzado','Modo visual','Historial'])+'</div>';
S.solo='<div class="card"><div class="head"><span class="dot"></span><span class="eyebrow">Solo RPE</span><span class="meta">3 / 4</span></div><div class="hero"><span class="v">8,5</span><span class="u">RPE</span><span class="side"><b>× 12</b><span>reps</span></span></div><div class="sub">Peso corporal · dominadas</div><div class="body"><div class="field">Sin carga externa</div>'+wheel(12)+fire(1)+rom+hist+'</div>'+acts(['Avanzado','Modo visual','Historial'])+'</div>';
S.time='<div class="card"><div class="head"><span class="dot"></span><span class="eyebrow">Tiempo</span><span class="meta">3 / 4</span></div><div class="hero"><span class="v">00:45</span><span class="u">restante</span><span class="side"><b>45″</b><span>objetivo</span></span></div><div class="sub">Wall sit</div><div class="body"><div class="field">Iniciar · pausar · reiniciar</div>'+rom+hist+'</div>'+acts(['Avanzado','Modo visual','Historial'])+'</div>';
