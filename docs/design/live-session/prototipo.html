<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KPKN · Sesión en vivo · programa de diseño</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* KPKN · Sesión en vivo — estudio de revisión y prototipo.
   Dos capas: el estudio (fuera del teléfono) y la app (dentro, a 393 × 852). */

:root{
  --ink:#F2EEE6; --muted:#C4BFB6; --faint:#8E8980; --cta:#0B0B0B;
  --blue:#8FB2FF; --sage:#A9C4B6; --green:#43D18C; --energy:#F7CF73;
  --muscle:#F49A6E; --danger:#FF9B92; --error:#EF6F64; --replaced:#E53935; --cardio:#E0A13A;
  --canvas:#000000; --module:#111111; --inset:#1A1A1A; --hero:#1B1B1B;
  --line:rgba(255,255,255,.07); --divider:rgba(255,255,255,.06);
  --pw:393px; --ph:852px; --card-w:345px; --card-h:470px; --z:.9;
  --studio:#060606; --studio-line:rgba(255,255,255,.08);
  --syne:'Syne',system-ui,sans-serif; --inter:'Inter',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,monospace;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--studio); color:var(--ink); font-family:var(--inter);
  -webkit-font-smoothing:antialiased; overflow:hidden;
}
button,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
::selection{background:rgba(244,154,110,.28)}

/* ───────────────────────── estudio ───────────────────────── */
.topbar{
  height:60px; display:flex; align-items:center; gap:26px; padding:0 20px;
  border-bottom:1px solid var(--studio-line); position:relative; z-index:20;
  background:linear-gradient(180deg,#080808,#060606);
}
.brand{display:flex; align-items:center; gap:10px; min-width:232px}
.brand-mark{
  width:30px;height:30px;border-radius:9px;background:var(--ink);color:#0B0B0A;
  display:grid;place-items:center;font-family:var(--syne);font-weight:800;font-size:14px;
}
.brand-txt b{display:block;font-family:var(--syne);font-size:14px;font-weight:800;letter-spacing:-.2px}
.brand-txt span{display:block;font-size:10.5px;color:var(--faint);margin-top:1px}

.phasebar{display:flex; align-items:center; gap:5px; flex:1; min-width:0; overflow:hidden}
.phasebar button{
  display:flex;align-items:center;gap:6px;height:28px;padding:0 8px;border-radius:7px;
  font-size:10.5px;font-weight:600;color:var(--faint);white-space:nowrap;
}
.phasebar button b{font-family:var(--mono);font-size:9.5px;font-weight:500;color:#5f5b56}
.phasebar button.on{background:#151514;color:var(--ink)}
.phasebar button.on b{color:var(--muscle)}
.phasebar button:hover{background:#101010;color:var(--muted)}

.tools{display:flex;align-items:center;gap:8px;margin-left:auto}
.tool{
  display:flex;align-items:center;gap:7px;height:30px;padding:0 10px;border-radius:8px;
  border:1px solid var(--studio-line);font-size:11px;font-weight:600;color:var(--muted);
}
.tool .dot{width:6px;height:6px;border-radius:50%;background:#3a3834}
.tool[aria-pressed="true"]{border-color:rgba(244,154,110,.45);color:var(--ink);background:rgba(244,154,110,.07)}
.tool[aria-pressed="true"] .dot{background:var(--muscle);box-shadow:0 0 0 3px rgba(244,154,110,.15)}
.tool:hover{color:var(--ink);border-color:rgba(255,255,255,.18)}
.zoom{display:flex;gap:2px;background:#121211;border:1px solid var(--studio-line);border-radius:8px;padding:2px}
.zoom button{height:24px;padding:0 7px;border-radius:6px;font-size:10px;font-weight:600;color:var(--faint)}
.zoom button.on{background:var(--ink);color:#0B0B0A}
.zoom button:hover:not(.on){color:var(--ink)}

.layout{
  display:grid;grid-template-columns:264px minmax(0,1fr) 372px;
  height:calc(100vh - 60px);
}

/* índice */
.index{display:flex;flex-direction:column;border-right:1px solid var(--studio-line);min-height:0;background:#070707}
.index-head{padding:14px 14px 10px;border-bottom:1px solid var(--studio-line);position:sticky;top:0;background:#070707;z-index:3}
.index-title{font-family:var(--syne);font-size:13px;font-weight:800;letter-spacing:.2px;margin-bottom:9px}
.search{
  width:100%;height:32px;border-radius:8px;border:1px solid var(--studio-line);background:#0D0D0C;
  padding:0 10px;font-size:11px;color:var(--ink);outline:none;
}
.search::placeholder{color:#66625d}
.search:focus{border-color:rgba(244,154,110,.45)}
.filters{display:flex;gap:4px;margin-top:8px}
.f{height:22px;padding:0 7px;border-radius:6px;font-size:9.5px;font-weight:600;color:var(--faint)}
.f.on{background:#1A1918;color:var(--ink)}
.f:hover:not(.on){color:var(--muted)}
.index-list{flex:1;overflow:auto;padding:6px 8px 14px}
.index-list::-webkit-scrollbar,.inspector::-webkit-scrollbar{width:4px}
.index-list::-webkit-scrollbar-thumb,.inspector::-webkit-scrollbar-thumb{background:#232220;border-radius:2px}
.phase-head{
  display:flex;align-items:center;gap:7px;padding:14px 6px 5px;
  font-size:9px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:#6d6963;
}
.phase-head b{font-family:var(--mono);font-size:9px;font-weight:500;color:var(--muscle);letter-spacing:0}
.phase-head span{margin-left:auto;font-family:var(--mono);font-size:8.5px;color:#4d4a46;letter-spacing:0}
.scene{
  display:grid;grid-template-columns:7px 1fr;gap:8px;align-items:start;width:100%;
  text-align:left;padding:6px 7px;border-radius:6px;border-left:2px solid transparent;margin-bottom:1px;
}
.scene:hover{background:#0F0F0E}
.scene.on{background:#151513;border-left-color:var(--ink)}
.scene .fd{width:5px;height:5px;border-radius:50%;margin-top:5px;background:#3f3c38}
.scene .fd.exact{background:var(--green)}
.scene .fd.derived{background:var(--energy)}
.scene .fd.gap{background:var(--danger)}
.scene .nm{display:block;font-size:11px;font-weight:500;color:var(--muted);line-height:14px}
.scene.on .nm{color:var(--ink);font-weight:600}
.scene .sb{display:block;font-size:9.5px;color:#5f5b56;line-height:12.5px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.index-foot{
  display:flex;justify-content:space-between;padding:9px 14px;border-top:1px solid var(--studio-line);
  font-size:9px;color:#5f5b56;font-family:var(--mono);
}

/* escenario */
.stage{
  display:flex;flex-direction:column;min-width:0;min-height:0;
  background:
    radial-gradient(620px 420px at 50% 28%, rgba(244,154,110,.055), transparent 68%),
    radial-gradient(900px 600px at 50% 0%, rgba(255,255,255,.025), transparent 70%),
    #060606;
}
.stage-top{display:flex;align-items:center;justify-content:space-between;padding:12px 18px 0;min-height:34px}
.crumbs{font-family:var(--mono);font-size:9.5px;color:#6c6862;letter-spacing:.2px}
.crumbs b{color:var(--muted);font-weight:500}
.fidelity{display:flex;align-items:center;gap:7px;font-size:9.5px;font-weight:600}
.badge{display:inline-flex;align-items:center;gap:5px;height:21px;padding:0 8px;border-radius:5px;font-size:9px;letter-spacing:.2px}
.badge i{width:5px;height:5px;border-radius:50%;font-style:normal}
.badge.exact{background:rgba(67,209,140,.09);color:var(--green);border:1px solid rgba(67,209,140,.22)}
.badge.exact i{background:var(--green)}
.badge.derived{background:rgba(247,207,115,.08);color:var(--energy);border:1px solid rgba(247,207,115,.22)}
.badge.derived i{background:var(--energy)}
.badge.gap{background:rgba(255,155,146,.08);color:var(--danger);border:1px solid rgba(255,155,146,.25)}
.badge.gap i{background:var(--danger)}

.devwrap{
  flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:14px 0;
  position:relative;overflow:hidden;
}
.device{
  width:var(--pw);height:var(--ph);flex:none;border-radius:44px;overflow:hidden;
  background:#000;border:1px solid #262523;position:absolute;top:50%;left:50%;
  box-shadow:0 34px 90px rgba(0,0,0,.72), 0 0 0 8px #0b0b0a, 0 0 0 9px #1c1b19;
  transform:translate(-50%,-50%) scale(var(--z));transform-origin:center;
}
.pins{
  position:absolute;top:50%;left:50%;width:var(--pw);height:var(--ph);
  transform:translate(-50%,-50%) scale(var(--z));transform-origin:center;
  pointer-events:none;z-index:9;
}
.device .k-phone{border-radius:42px}

.stage-bottom{
  display:flex;align-items:center;gap:12px;padding:0 18px 12px;min-height:66px;
}
.navbtn{
  width:34px;height:34px;border-radius:9px;border:1px solid var(--studio-line);
  display:grid;place-items:center;color:var(--muted);font-size:13px;flex:none;
}
.navbtn:hover{color:var(--ink);border-color:rgba(255,255,255,.22)}
.scene-name{text-align:center;flex:1;min-width:0}
.scene-name b{display:block;font-family:var(--syne);font-size:15px;font-weight:700}
.scene-name span{display:block;font-size:10.5px;color:var(--faint);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* inspector */
.inspector{
  border-left:1px solid var(--studio-line);overflow:auto;padding:16px 18px 40px;background:#080808;min-height:0;
}
.insp-kicker{font-family:var(--mono);font-size:9px;color:#6d6963;letter-spacing:.3px;margin-bottom:7px}
.insp-title{font-family:var(--syne);font-size:20px;font-weight:800;line-height:1.18;letter-spacing:-.3px}
.insp-sub{font-size:11px;color:var(--faint);line-height:16px;margin-top:6px}
.insp-note{
  margin-top:11px;padding:9px 10px;border-left:2px solid rgba(244,154,110,.5);
  background:rgba(244,154,110,.055);font-size:10.5px;line-height:15.5px;color:var(--muted);
}
.sec{margin-top:16px;padding-top:12px;border-top:1px solid var(--studio-line)}
.sec h3{font-size:9px;letter-spacing:1.3px;text-transform:uppercase;color:#6f6b65;font-weight:600;margin-bottom:7px}
.sec ul{list-style:none;display:flex;flex-direction:column;gap:5px}
.sec li{font-size:10.5px;line-height:15px;color:var(--muted);padding-left:11px;position:relative}
.sec li:before{content:'';position:absolute;left:0;top:6px;width:4px;height:4px;border-radius:50%;background:#3c3935}
.sec li b{color:var(--ink);font-weight:600}
.sec .mono{font-family:var(--mono);font-size:9.5px;line-height:15px;color:#9a948c}
.src{display:flex;flex-direction:column;gap:4px}
.src code{
  font-family:var(--mono);font-size:9.5px;color:var(--blue);background:rgba(143,178,255,.06);
  padding:4px 6px;border-radius:4px;border:1px solid rgba(143,178,255,.12);word-break:break-all;
}
.copyline{
  font-size:10.5px;line-height:15px;color:var(--muted);border-left:1px solid #2a2825;padding-left:8px;
}
.accept li:before{background:var(--green)}
.avoid{
  margin-top:10px;padding:9px 10px;border:1px solid rgba(255,155,146,.18);border-radius:6px;
  background:rgba(255,155,146,.045);
}
.avoid b{display:block;font-size:9px;letter-spacing:1.1px;text-transform:uppercase;color:var(--danger);margin-bottom:4px}
.avoid span{font-size:10.5px;line-height:15px;color:var(--muted)}
.measure{display:grid;grid-template-columns:1fr auto;gap:5px 10px;font-size:10.5px;line-height:15px}
.measure span{color:var(--muted)}
.measure b{font-family:var(--mono);font-size:9.5px;color:var(--ink);font-weight:500;text-align:right;max-width:198px;white-space:normal;line-height:14px}

/* pines de anotación */
.pin{position:absolute;width:16px;height:16px;border-radius:50%;background:var(--muscle);color:#0B0B0A;
  font-family:var(--mono);font-size:9px;font-weight:600;display:grid;place-items:center;
  box-shadow:0 0 0 2px #060606, 0 0 0 3px rgba(244,154,110,.55);pointer-events:auto;cursor:help}
.pin:after{content:'';position:absolute;inset:-7px;border-radius:50%;border:1px solid rgba(244,154,110,.25)}
.pin .tip{
  display:none;position:absolute;left:20px;top:-4px;width:196px;padding:7px 8px;border-radius:5px;
  background:#161513;border:1px solid rgba(244,154,110,.3);color:var(--ink);font-family:var(--inter);
  font-size:9.5px;line-height:13px;font-weight:500;z-index:30;
}
.pin .tip em{display:block;font-style:normal;font-family:var(--mono);font-size:8.5px;color:var(--muscle);margin-top:3px}
.pin:hover .tip{display:block}
.pin.right .tip{left:auto;right:20px}

@media (max-width:1180px){
  .layout{grid-template-columns:232px minmax(0,1fr) 320px}
  .brand{min-width:190px}
}
@media (max-width:980px){
  body{overflow:auto}
  .layout{grid-template-columns:1fr;height:auto}
  .index{order:2;border-right:0;border-top:1px solid var(--studio-line);max-height:340px}
  .stage{order:1;min-height:760px}
  .inspector{order:3;border-left:0;border-top:1px solid var(--studio-line)}
  .phasebar{display:none}
  .topbar{position:sticky;top:0}
}

/* ───────────────────────── app dentro del teléfono ───────────────────────── */
.k-phone{
  position:absolute;inset:0;background:var(--canvas);color:var(--ink);
  font-family:var(--inter);overflow:hidden;
  --card-w:calc((var(--pw) - 48px));
}
.k-phone.compact{--card-w:calc(var(--pw) - 48px)}

.k-statusbar{
  position:absolute;top:0;left:0;right:0;height:24px;display:flex;align-items:center;
  justify-content:space-between;padding:0 22px;font-size:11.5px;font-weight:600;z-index:12;
}
.k-statusbar .sig{display:flex;align-items:center;gap:5px}
.k-statusbar .bars{display:flex;align-items:flex-end;gap:2px}
.k-statusbar .bars i{display:block;width:2.5px;background:var(--ink);border-radius:1px}
.k-statusbar .bars i:nth-child(1){height:3px;opacity:.5}
.k-statusbar .bars i:nth-child(2){height:5px;opacity:.7}
.k-statusbar .bars i:nth-child(3){height:7px;opacity:.85}
.k-statusbar .bars i:nth-child(4){height:9px}
.k-statusbar .batt{width:18px;height:9px;border:1px solid rgba(242,238,230,.55);border-radius:2px;position:relative;margin-left:3px}
.k-statusbar .batt:after{content:'';position:absolute;right:-3px;top:2px;width:2px;height:4px;background:rgba(242,238,230,.55);border-radius:0 1px 1px 0}
.k-statusbar .batt i{position:absolute;inset:1px;width:70%;background:var(--ink);border-radius:1px}

.k-header{
  position:absolute;top:0;left:0;right:0;height:119px;z-index:10;
  background:
    radial-gradient(260px 180px at 82% 18%, rgba(244,154,110,.16), transparent 72%),
    radial-gradient(200px 120px at 12% 0%, rgba(143,178,255,.09), transparent 70%),
    var(--canvas);
  -webkit-mask-image:linear-gradient(180deg,#000 0%,#000 70%,transparent 100%);
  mask-image:linear-gradient(180deg,#000 0%,#000 70%,transparent 100%);
}
.k-header:after{
  content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.12),rgba(0,0,0,.42));pointer-events:none;
}
.k-header-inner{position:relative;z-index:2;padding:34px 12px 7px}
.k-hrow{display:flex;align-items:flex-start;gap:4px;height:48px}
.k-titlecol{flex:1;min-width:0}
.k-title{font-family:var(--syne);font-size:20px;line-height:24px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.2px}
.k-title .chip{color:var(--muted);font-weight:700}
.k-sub{font-size:13px;line-height:18px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.k-icons{display:flex;flex:none;height:48px}
.k-icon{width:48px;height:48px;display:grid;place-items:center}
.k-icon .cir{width:40px;height:40px;border-radius:50%;background:var(--inset);display:grid;place-items:center;color:var(--muted)}
.k-icon.filled .cir{background:var(--ink);color:#0B0B0A}
.k-icon svg{display:block}
.k-chips{display:flex;align-items:center;gap:6px;height:27px;margin-top:3px;overflow:hidden;
  -webkit-mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 24px),transparent 100%);
  mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 24px),transparent 100%);
}
.k-chip{display:inline-flex;align-items:center;gap:4px;height:27px;padding:0 9px;border-radius:999px;background:var(--inset);
  font-size:12px;line-height:16px;font-weight:600;color:var(--ink);white-space:nowrap;flex:none}
.k-chip.muted{color:var(--muted)}
.k-chip .sub{color:var(--muted);font-weight:500}
.k-chip .x{color:var(--faint);font-size:12px;margin-left:1px}
.k-chip .dd{color:var(--muted);font-size:10px}
.k-chip.green{color:var(--green)}
.k-chip.red{color:var(--red)}
.k-ring{width:18px;height:18px;border-radius:50%;position:relative;flex:none;
  background:conic-gradient(var(--muscle) 0 72%, rgba(255,255,255,.20) 72% 100%)}
.k-ring:before{content:'';position:absolute;inset:1.6px;border-radius:50%;background:var(--inset)}
.k-ring svg{position:absolute;inset:3.5px;color:var(--muscle)}

.k-stage{position:absolute;top:119px;left:0;right:0;bottom:0;z-index:2}
.k-phone.compact .k-header{height:95px}
.k-phone.compact .k-header-inner{padding:24px 12px 0}
.k-phone.compact .k-hrow{height:44px}
.k-phone.compact .k-title{font-size:18px;line-height:20px}
.k-phone.compact .k-sub{font-size:11px;line-height:14px}
.k-phone.compact .k-icons{height:44px}
.k-phone.compact .k-icon{width:44px;height:44px}
.k-phone.compact .k-icon .cir{width:36px;height:36px}
.k-phone.compact .k-chips{margin-top:0}
.k-phone.compact .k-stage{top:95px}

/* tarjeta */
.k-card{
  position:absolute;top:0;left:calc((var(--pw) - var(--card-w)) / 2);width:var(--card-w);height:var(--card-h);
  background:var(--module);border:1px solid var(--line);border-radius:28px;overflow:hidden;
  display:flex;flex-direction:column;color:var(--ink);
}
.k-card.flip{animation:kflip .42s cubic-bezier(.2,.7,.2,1)}
@keyframes kflip{from{transform:rotateY(0)}to{transform:rotateY(180deg)}}
.k-card.failed .k-card-inner{filter:blur(1.2px)}
.k-card-inner{display:flex;flex-direction:column;height:100%;min-height:0}

.k-hero{background:var(--hero);border-radius:24px 24px 0 0;padding:12px 16px;min-height:132px;display:flex;flex-direction:column;justify-content:space-between}
.k-hero-label{font-size:10px;line-height:14px;letter-spacing:1.2px;font-weight:600;color:var(--muted);display:flex;align-items:baseline;gap:6px}
.k-hero-label .dim{color:var(--faint)}
.k-hero-main{display:flex;align-items:baseline;gap:6px;margin-top:2px}
.k-hero-val{font-family:var(--syne);font-size:34px;line-height:44px;font-weight:700;letter-spacing:-.8px;font-variant-numeric:tabular-nums}
.k-hero-val.sm{font-size:26px;line-height:36px}
.k-hero-unit{font-size:13px;font-weight:600;color:var(--muted);padding-bottom:4px}
.k-hero-side{margin-left:auto;text-align:right;padding-bottom:3px}
.k-hero-side b{font-family:var(--syne);font-size:15px;font-weight:700}
.k-hero-side span{display:block;font-size:9px;color:var(--faint);margin-top:1px}
.k-chips3{display:flex;gap:7px;margin-top:9px}
.k-chip3{flex:1;height:34px;border-radius:11px;background:#111;border:1px solid rgba(255,255,255,.10);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.k-chip3 span{font-size:9px;line-height:12px;color:var(--faint)}
.k-chip3 b{font-size:12px;line-height:15px;font-weight:600;font-variant-numeric:tabular-nums}
.k-hero-foot{display:flex;align-items:center;gap:5px;margin-top:6px;font-size:10px;color:var(--muted)}
.k-hero-foot svg{color:var(--muted)}

.k-cardbody{flex:1;min-height:0;display:flex;flex-direction:column;padding:0 16px;gap:6px;overflow:hidden}
.k-divider{height:1px;background:rgba(255,255,255,.08);flex:none}
.k-rephead{display:flex;align-items:center;height:24px;flex:none;gap:4px}
.k-eyebrow{font-size:10px;line-height:14px;letter-spacing:1.2px;text-transform:uppercase;font-weight:600;color:var(--muted)}
.k-plus{width:16px;height:16px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.k-videochip{margin-left:auto;display:flex;align-items:center;gap:4px;height:24px;padding:0 8px;border-radius:999px;background:#1F1F1F;border:1px solid rgba(255,255,255,.12);font-size:11px;color:var(--muted)}
.k-wheel{display:flex;align-items:center;height:48px;flex:none;padding:0 4px;position:relative;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 24px,#000 calc(100% - 24px),transparent);
  mask-image:linear-gradient(90deg,transparent,#000 24px,#000 calc(100% - 24px),transparent);}
.k-wcell{flex:1;display:grid;place-items:center;font-size:15px;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
.k-wcell.c{font-family:var(--syne);font-size:19px;font-weight:700;color:#0B0B0A;background:var(--ink);width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none}
.k-wcell.c b{font:inherit;font-weight:700;line-height:1;display:block}
.k-wcell.dim{color:var(--faint)}

.k-effort{flex:none;margin-top:4px}
.k-effort-head{display:flex;align-items:baseline;height:20px}
.k-effort-head .r{margin-left:auto;font-size:13px;font-weight:600;color:var(--ink)}
.k-effort-head .r small{font-weight:400;color:var(--faint);font-size:11px}
.k-trackwrap{height:44px;display:flex;align-items:center;position:relative}
.k-track{height:18px;width:100%;border-radius:999px;background:var(--inset);position:relative;overflow:hidden}
.k-track .fill{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:linear-gradient(90deg,rgba(247,207,115,.55),rgba(244,154,110,.9))}
.k-track .plan{position:absolute;top:0;bottom:0;width:2px;background:rgba(255,255,255,.26)}
.k-thumb{position:absolute;top:50%;width:26px;height:26px;border-radius:50%;background:var(--ink);transform:translate(-50%,-50%);box-shadow:0 4px 10px rgba(0,0,0,.45)}
.k-effort-labels{display:flex;justify-content:space-between;margin-top:2px;font-size:9px;line-height:14px;font-weight:500;color:var(--faint)}
.k-effort-labels .on{color:var(--ink);font-weight:600}
.k-effort-labels .fail{color:var(--muscle);font-weight:600}
.k-hint{margin-top:4px;font-size:11px;line-height:16px;font-weight:600;text-align:center;color:var(--muted)}

.k-rom{display:flex;align-items:center;gap:10px;height:44px;flex:none}
.k-rom .val{margin-left:auto;font-size:11px;font-weight:600;padding:3px 7px;border-radius:6px;background:var(--inset);font-variant-numeric:tabular-nums}
.k-slider{flex:1;height:4px;border-radius:2px;background:var(--inset);position:relative}
.k-slider i{position:absolute;left:0;top:0;bottom:0;background:rgba(242,238,230,.85);border-radius:2px}
.k-slider b{position:absolute;top:50%;width:18px;height:18px;border-radius:50%;background:var(--ink);transform:translate(-50%,-50%)}

.k-appstatus{font-size:11px;line-height:14px;color:var(--muted);flex:none;padding-bottom:2px}
.k-appstatus.err{color:var(--error)}

.k-actions{display:flex;gap:6px;padding:7px 16px 11px;border-top:1px solid rgba(255,255,255,.07);flex:none}
.k-action{height:44px;border-radius:999px;border:1px solid rgba(242,238,230,.24);display:flex;align-items:center;justify-content:center;gap:6px;font-size:11px;line-height:14px;font-weight:600;color:var(--muted);flex:1}
.k-action.icon{width:44px;flex:none;padding:0}
.k-action:hover{border-color:rgba(242,238,230,.5);color:var(--ink)}

/* bloques condicionales */
.k-band{display:flex;align-items:center;gap:8px;flex:none;margin:4px 0 0}
.k-band .ln{flex:1;height:1px;background:rgba(229,57,53,.85)}
.k-band span{font-size:9px;line-height:12px;letter-spacing:.8px;font-weight:600;color:var(--replaced);text-transform:uppercase;white-space:nowrap}
.k-band.center{justify-content:center}
.k-band.center span{font-size:9px;letter-spacing:.8px;text-transform:none;color:rgba(255,255,255,.64);font-weight:600}
.k-amrapbadge{display:flex;align-items:center;gap:6px;padding:2px 16px;flex:none}
.k-amrapbadge b{font-size:12px;font-weight:700;color:var(--muscle)}
.k-amrapbadge span{font-size:11px;line-height:15px;color:rgba(255,255,255,.65);padding:0 0 0 2px}
.k-loadwarn{padding:2px 10px;text-align:center;font-size:11px;line-height:14px;font-weight:700;color:var(--muscle);flex:none}
.k-pause{text-align:center;font-size:9px;line-height:12px;font-weight:700;letter-spacing:.8px;color:rgba(255,255,255,.64);flex:none;text-transform:uppercase}

.k-seg{display:flex;gap:6px;background:var(--inset);border-radius:20px;padding:6px;flex:none}
.k-seg button{flex:1;height:36px;border-radius:14px;border:1px solid transparent;display:flex;align-items:center;justify-content:center;gap:4px;font-size:11px;font-weight:700;color:var(--muted)}
.k-seg button.on{background:var(--ink);color:#0B0B0A;border-color:var(--ink)}
.k-seg.tech{background:transparent;padding:0;gap:4px;overflow:hidden;
  -webkit-mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 18px),transparent 100%);
  mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 18px),transparent 100%)}
.k-seg.tech button{height:30px;border-radius:15px;background:#000;font-size:12px;font-weight:500;color:var(--faint);flex:none;padding:0 10px;min-width:92px}
.k-seg.tech button.on{background:var(--ink);color:#0B0B0A}

/* tarjeta compacta / modos */
.k-compactload{display:flex;align-items:center;gap:6px;height:44px;flex:none}
.k-compactload .lbl{font-size:9px;letter-spacing:.8px;color:var(--faint);font-weight:600}
.k-compactload .field{height:32px;min-width:80px;border-radius:8px;background:var(--inset);display:flex;align-items:center;padding:0 9px;font-family:var(--syne);font-size:23px;font-weight:700;font-variant-numeric:tabular-nums}
.k-compactload .mode{margin-left:auto;font-size:10px;color:var(--muted);display:flex;align-items:center;gap:3px}

.k-fieldbig{height:60px;border-radius:12px;background:var(--inset);display:flex;align-items:center;justify-content:center;font-family:var(--syne);font-size:24px;font-weight:700;flex:none;font-variant-numeric:tabular-nums}
.k-fieldrow{display:flex;gap:8px;flex:none}
.k-fieldrow .k-fieldbig{flex:1}
.k-timerbtn{width:48px;height:60px;border-radius:12px;background:var(--inset);display:grid;place-items:center;flex:none;color:var(--ink)}

.k-rmhero{background:var(--hero);border-radius:24px 24px 0 0;padding:14px 16px;flex:none}
.k-rmhero .top{display:flex;align-items:baseline;gap:6px}
.k-rmhero .big{font-family:var(--syne);font-size:38px;line-height:42px;font-weight:800}
.k-rmhero .pct{font-size:23px;font-weight:700;color:var(--muscle)}
.k-rmhero .sub{font-size:11px;line-height:15px;color:var(--muted);margin-top:2px}
.k-rmhero .ref{display:flex;justify-content:space-between;margin-top:8px;padding-top:7px;border-top:1px solid rgba(255,255,255,.07);font-size:10.5px;color:var(--muted)}
.k-rmhero .ref b{color:var(--ink);font-weight:600}
.k-rmrow{display:flex;align-items:center;gap:8px;height:38px;flex:none;border-bottom:1px solid var(--divider)}
.k-rmrow .l{font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--faint);font-weight:600}
.k-rmrow .v{font-family:var(--syne);font-size:22px;line-height:26px;font-weight:700;font-variant-numeric:tabular-nums}
.k-rmrow .dim{margin-left:auto;font-size:9.5px;color:var(--faint)}

/* caras traseras */
.k-face{position:absolute;inset:0;display:flex;flex-direction:column;gap:8px;padding:12px;overflow:hidden}
.k-facehead{display:flex;align-items:center;gap:8px;height:32px;flex:none}
.k-pillbtn{height:32px;border-radius:999px;background:var(--inset);display:flex;align-items:center;gap:2px;padding:0 12px 0 8px;font-size:12px;font-weight:600}
.k-pillbtn.icon{padding:0;width:32px;justify-content:center}
.k-facehead .eyebrow{margin-left:auto;font-size:10px;letter-spacing:1.2px;text-transform:uppercase;font-weight:600;color:var(--faint)}
.k-prchip{height:32px;border-radius:999px;background:var(--inset);padding:0 12px;display:flex;align-items:center;font-size:12px;font-weight:600;color:var(--muscle);white-space:nowrap}

.k-chaintitle{font-size:10px;letter-spacing:1.3px;text-transform:uppercase;font-weight:600;color:var(--faint);flex:none}
.k-chain{display:flex;align-items:center;gap:6px;flex:none;overflow:hidden;position:relative;
  -webkit-mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 20px),transparent 100%);
  mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 20px),transparent 100%)}
.k-link{width:72px;height:58px;border-radius:16px;background:var(--inset);border:1px solid transparent;padding:4px 6px;display:flex;flex-direction:column;justify-content:center;flex:none}
.k-link.on{border-color:var(--muscle);background:rgba(244,154,110,.10)}
.k-link .t{font-size:10px;line-height:12px;letter-spacing:.2px;color:var(--muted)}
.k-link .v{font-family:var(--syne);font-size:15px;line-height:18px;font-weight:700}
.k-link .s{font-size:11px;line-height:13px;color:var(--faint)}
.k-chain .arrow{color:rgba(255,255,255,.35);flex:none}
.k-addlink{width:44px;height:58px;border-radius:16px;border:1px solid rgba(255,255,255,.24);display:grid;place-items:center;color:var(--muted);flex:none}

.k-stepbox{background:var(--canvas);border-radius:20px;padding:8px;flex:none}
.k-stepbox .row{display:flex;align-items:center;gap:6px;min-height:32px}
.k-stepbox .row .t{font-size:14px;line-height:18px;font-weight:600;padding:0 6px 0 4px}
.k-sug{margin-left:auto;height:24px;padding:0 10px;border-radius:999px;border:1px solid rgba(255,255,255,.12);display:flex;align-items:center;font-size:10px;font-weight:600;color:var(--muted);white-space:nowrap}
.k-done{width:28px;height:28px;border-radius:50%;background:var(--inset);border:1px solid rgba(242,238,230,.24);display:grid;place-items:center;color:var(--muted)}
.k-done.on{background:var(--ink);border-color:var(--ink);color:#0B0B0A}
.k-stepsrow{display:flex;gap:6px;margin-top:6px}
.k-stepper{flex:1;height:44px;border-radius:14px;background:var(--inset);display:flex;align-items:center;padding:0 4px;gap:4px}
.k-stepper .b{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.08);display:grid;place-items:center;font-size:15px;color:var(--muted);flex:none}
.k-stepper .v{flex:1;text-align:center;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.k-stepper .v small{font-size:10px;color:var(--faint);font-weight:500;display:block;line-height:10px}
.k-explain{display:flex;gap:6px;align-items:center;flex:none;overflow:hidden}
.k-explain .blk{height:30px;border-radius:999px;background:var(--inset);padding:0 10px;display:flex;align-items:center;font-size:11px;color:var(--muted);white-space:nowrap}
.k-explain .blk.last{border:1px solid var(--muscle);color:var(--ink)}
.k-explain .cap{font-size:11px;color:var(--faint);white-space:nowrap}
.k-note{flex:none}
.k-note .lb{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;font-weight:600;color:var(--faint);margin-bottom:4px}
.k-input{height:36px;border-radius:8px;background:var(--inset);display:flex;align-items:center;padding:0 10px;font-size:12px;color:var(--faint)}
.k-errorpill{height:40px;border-radius:999px;background:var(--inset);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:var(--danger);flex:none}

/* media */
.k-mstage{flex:1;min-height:0;border-radius:22px;border:1px solid rgba(255,255,255,.06);
  background:radial-gradient(120% 90% at 50% 40%,#2A2622,#121110);position:relative;overflow:hidden}
.k-mstage .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px);background-size:33.33% 33.33%}
.k-mstage .lbl{position:absolute;left:12px;bottom:12px;font-size:10px;color:rgba(255,255,255,.55)}
.k-mtop{position:absolute;top:10px;left:10px;right:10px;display:flex;align-items:center;gap:6px;z-index:2}
.k-switch{display:flex;gap:2px;background:rgba(0,0,0,.45);border-radius:16px;padding:3px}
.k-switch b{height:26px;padding:0 12px;border-radius:13px;display:grid;place-items:center;font-size:12px;font-weight:600;color:rgba(242,238,230,.7)}
.k-switch b.on{background:var(--ink);color:#0B0B0A}
.k-ficha{margin-left:auto;height:32px;padding:0 12px;border-radius:999px;background:rgba(0,0,0,.45);border:1px solid rgba(242,238,230,.18);display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink)}
.k-mbottom{position:absolute;left:10px;right:10px;bottom:10px;display:flex;align-items:flex-end;justify-content:space-between;z-index:2}
.k-gal{display:flex;flex-direction:column;gap:5px}
.k-gal .lb{font-size:9px;letter-spacing:.8px;text-transform:uppercase;color:rgba(255,255,255,.55);font-weight:600}
.k-thumbs{display:flex;gap:4px}
.k-thumb2{width:36px;height:36px;border-radius:8px;background:#171715;border:1px solid rgba(255,255,255,.08);display:grid;place-items:center;font-size:8px;color:rgba(255,255,255,.55);position:relative}
.k-thumb2 .bdg{position:absolute;top:-3px;right:-3px;min-width:16px;height:16px;border-radius:5px;background:rgba(0,0,0,.72);border:1px solid rgba(255,255,255,.28);display:grid;place-items:center;font-size:9px;color:var(--ink)}
.k-shutter{width:60px;height:60px;border-radius:50%;background:var(--ink);display:grid;place-items:center;box-shadow:0 0 0 3px rgba(0,0,0,.4),0 0 0 4px rgba(242,238,230,.2)}
.k-shutter i{width:44px;height:44px;border-radius:50%;background:var(--ink);border:1px solid rgba(0,0,0,.2)}
.k-shutter.video i{background:var(--error)}
.k-mediafoot{height:48px;border-radius:12px;background:var(--inset);display:flex;align-items:center;gap:8px;padding:0 8px;flex:none}
.k-mediafoot .fit{width:36px;height:36px;border-radius:10px;background:#222;display:grid;place-items:center;color:var(--muted);flex:none}
.k-mediafoot .ln{font-size:10.5px;line-height:14px;color:var(--muted)}
.k-mediafoot .ln b{color:var(--ink);font-weight:600}

/* preparación */
.k-prep{position:absolute;inset:0;padding:14px 12px;display:flex;flex-direction:column;gap:6px;overflow:hidden}
.k-prep .head{display:flex;align-items:center;gap:8px;min-height:32px;flex:none}
.k-prep .head .t{font-family:var(--syne);font-size:20px;line-height:26px;font-weight:700}
.k-prep .head .chip{margin-left:auto}
.k-prep .body{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px;overflow:hidden}
.k-prep .hero{display:flex;align-items:flex-end;gap:6px;flex:none}
.k-prep .hero .v{font-family:var(--syne);font-size:34px;line-height:40px;font-weight:700;font-variant-numeric:tabular-nums}
.k-prep .hero .u{font-size:10px;color:var(--muted);font-weight:600;padding-bottom:4px}
.k-prep .hero .side{margin-left:auto;text-align:right}
.k-prep .hero .side b{font-family:var(--syne);font-size:15px}
.k-prep .hero .side span{display:block;font-size:9px;color:var(--faint)}
.k-prep .sub{font-size:11px;color:var(--faint);flex:none}
.k-prep .mrows{display:flex;flex-direction:column;gap:2px;overflow:hidden;flex:1}
.k-mrow{display:flex;align-items:center;gap:8px;padding:5px 4px;border-radius:8px;min-height:32px}
.k-mrow.on{background:rgba(242,238,230,.06)}
.k-mrow .check{width:15px;height:15px;border-radius:50%;border:1px solid rgba(242,238,230,.25);display:grid;place-items:center;font-size:8px;color:#0B0B0A;flex:none}
.k-mrow.done .check{background:var(--sage);border-color:var(--sage)}
.k-mrow .nm{flex:1;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.k-mrow.done .nm{color:var(--faint);text-decoration:line-through}
.k-mrow .dose{font-size:9.5px;color:var(--faint)}
.k-prep .actions{display:flex;gap:6px;padding-top:4px;flex:none}
.k-prepbtn{height:48px;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:12px;font-weight:600;flex:1;border:1px solid rgba(242,238,230,.24);color:var(--ink)}
.k-prepbtn.primary{background:var(--ink);color:#0B0B0A;border-color:var(--ink)}
.k-prepbtn.quiet{border-color:transparent;color:var(--muted)}
.k-dosecard{background:var(--inset);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:4px;flex:none}
.k-dosecard .d{font-family:var(--syne);font-size:34px;line-height:40px;font-weight:700}
.k-dosecard .l{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--faint);font-weight:600}
.k-minirow{display:flex;gap:6px;flex:none}
.k-minibtn{height:34px;padding:0 12px;border-radius:999px;background:var(--inset);display:flex;align-items:center;font-size:11px;font-weight:600;color:var(--muted)}
.k-warmrow{display:flex;align-items:center;gap:6px;min-height:44px;padding:4px 4px;border-bottom:1px solid var(--divider)}
.k-warmrow.on{background:rgba(247,207,115,.07);border:1px solid rgba(247,207,115,.22);border-radius:9px;padding:4px 5px}
.k-warmrow .p{width:26px;font-size:10px;font-weight:700;color:var(--energy)}
.k-warmrow .r{width:34px;font-size:10px;color:var(--faint)}
.k-warmrow .kg{flex:1;text-align:right;font-family:var(--syne);font-size:17px;font-weight:700}
.k-warmrow .x{width:34px;text-align:right;font-size:11px;color:var(--muted)}
.k-warmrow .rest{width:30px;text-align:right;font-size:10px;color:var(--faint)}

.k-cardio{position:absolute;inset:0;padding:16px;display:flex;flex-direction:column;gap:10px;overflow:hidden}
.k-cardio .head{display:flex;align-items:baseline;gap:8px}
.k-cardio .head .eyebrow{font-size:10px}
.k-cardio .head .nm{font-size:14px;font-weight:600}
.k-cardio .phase{background:rgba(244,154,110,.10);border:1px solid rgba(244,154,110,.25);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;gap:2px}
.k-cardio .phase b{font-size:12px;color:var(--muscle)}
.k-cardio .phase span{font-size:10px;color:var(--muted)}
.k-cardio .ringbox{display:flex;align-items:center;justify-content:center;padding:4px 0}
.k-ringbig{width:132px;height:132px;border-radius:50%;position:relative;
  background:conic-gradient(var(--muscle) 0 58%, rgba(255,255,255,.08) 58% 100%);display:grid;place-items:center}
.k-ringbig:before{content:'';position:absolute;inset:8px;border-radius:50%;background:var(--module)}
.k-ringbig .in{position:relative;text-align:center}
.k-ringbig .in span{display:block;font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);font-weight:600}
.k-ringbig .in b{display:block;font-family:var(--syne);font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
.k-cardio .metrics{display:flex;gap:6px}
.k-cardio .metrics .p{flex:1;height:38px;border-radius:10px;background:var(--inset);display:flex;flex-direction:column;align-items:center;justify-content:center}
.k-cardio .metrics .p b{font-size:12px}
.k-cardio .metrics .p span{font-size:8.5px;color:var(--faint)}
.k-chart{display:flex;align-items:flex-end;gap:2px;height:56px;padding:8px;border-radius:10px;background:#0C0C0B;flex:none}
.k-chart i{display:block;flex:1;border-radius:2px;background:rgba(255,255,255,.12)}
.k-chart i.w{background:var(--muscle)}
.k-cardio .splits{font-size:10px;color:var(--faint)}

/* descanso */
.k-rest{position:absolute;inset:0;padding:14px 10px;display:flex;flex-direction:column;gap:8px;overflow:hidden}
.k-rest .head{display:flex;align-items:center;gap:6px;min-height:24px}
.k-rest .head .lb{font-size:9px;letter-spacing:1.2px;text-transform:uppercase;font-weight:600;color:var(--faint)}
.k-rest .head .mode{margin-left:auto;font-size:9.5px;color:var(--muted)}
.k-rest .clockwrap{display:flex;justify-content:center;padding:2px 0}
.k-restclock{width:120px;height:104px;position:relative}
.k-restclock svg{display:block;width:120px;height:104px;overflow:visible}
.k-rest-time{text-align:center;margin-top:-6px}
.k-rest-time b{font-family:var(--syne);font-size:40px;line-height:42px;font-weight:700;font-variant-numeric:tabular-nums}
.k-rest-time span{display:block;font-size:10px;color:var(--muted)}
.k-rest .last{background:var(--inset);border-radius:12px;padding:9px 12px;display:flex;align-items:center;gap:8px;flex:none}
.k-rest .last .lb{font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--faint);font-weight:600}
.k-rest .last b{margin-left:auto;font-size:14px;font-variant-numeric:tabular-nums}
.k-rest .next{background:var(--inset);border-radius:18px;padding:10px 14px;flex:none}
.k-rest .next .lb{font-size:10px;color:var(--muted)}
.k-rest .next .v{font-size:13px;font-weight:600;margin-top:1px}
.k-rest .next .e{font-size:10px;color:var(--faint);margin-top:1px}
.k-rest .ctrl{display:flex;gap:6px;flex:none}
.k-rest .ctrl .b{height:44px;border-radius:999px;background:var(--inset);display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--ink);flex:1}
.k-rest .ctrl .b.skip{flex:1.6;background:var(--ink);color:#0B0B0A}
.k-rest .hint{font-size:10px;color:var(--faint);text-align:center}
.k-rest .band{justify-content:center;margin:0}
.k-playpill{height:44px;border-radius:25px;background:#1B1B1B;border:1px solid rgba(244,154,110,.24);display:flex;align-items:center;gap:8px;padding:0 14px 0 8px;flex:none}
.k-playpill .c{width:28px;height:28px;border-radius:50%;background:rgba(244,154,110,.14);display:grid;place-items:center;color:var(--muscle)}
.k-playpill span{font-size:12px;font-weight:600}

.k-minichip{position:absolute;right:16px;top:128px;height:40px;border-radius:999px;background:var(--module);border:1px solid rgba(255,255,255,.12);display:flex;align-items:center;gap:10px;padding:0 4px 0 4px;z-index:11}
.k-minichip .ring{width:32px;height:32px;border-radius:50%;position:relative;background:conic-gradient(var(--muscle) 0 82%,#2A2A2A 82% 100%)}
.k-minichip .ring:before{content:'';position:absolute;inset:4px;border-radius:50%;background:var(--module)}
.k-minichip .txt{padding-right:4px}
.k-minichip .txt span{display:block;font-size:9px;color:var(--muted);line-height:10px}
.k-minichip .txt b{font-size:13px;font-variant-numeric:tabular-nums}
.k-minichip .plus{height:28px;border-radius:999px;background:var(--inset);display:grid;place-items:center;padding:0 10px;font-size:11px;font-weight:600}

.k-game{position:absolute;inset:0;padding:14px;display:flex;flex-direction:column;gap:8px}
.k-arena{flex:1;border-radius:28px;border:1px solid rgba(255,255,255,.08);position:relative;overflow:hidden;
  background:linear-gradient(180deg,#0E0E0D,#080808)}
.k-arena .hud{position:absolute;top:10px;left:12px;right:12px;display:flex;justify-content:space-between;font-size:10px;color:var(--muted)}
.k-arena .hud b{font-size:12px;color:var(--ink)}
.k-arena .ground{position:absolute;left:0;right:0;bottom:34px;height:1px;background:rgba(255,255,255,.14)}
.k-runner{position:absolute;left:52px;bottom:35px;width:18px;height:26px;border-radius:5px;background:var(--ink)}
.k-runner:before,.k-runner:after{content:'';position:absolute;bottom:-8px;width:3px;height:9px;background:var(--ink);border-radius:2px}
.k-runner:before{left:4px;transform:rotate(14deg)}
.k-runner:after{right:4px;transform:rotate(-14deg)}
.k-obs{position:absolute;bottom:35px;width:26px;height:16px;border-radius:4px;background:var(--muscle)}
.k-obs.b{width:36px;height:12px;background:var(--blue)}
.k-obs.c{width:10px;height:24px;background:var(--green)}

/* feedback */
.k-fb{position:absolute;inset:0;padding:14px;display:flex;flex-direction:column;gap:8px;overflow:hidden}
.k-fb .head{display:flex;align-items:baseline}
.k-fb .head .t{font-family:var(--syne);font-size:22px;line-height:26px;font-weight:700}
.k-fb .head span{margin-left:auto;font-size:10px;color:var(--faint)}
.k-fb .tech{background:var(--inset);border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:10px;flex:none}
.k-fb .tech .fig{width:36px;height:42px;border-radius:8px;background:#222;display:grid;place-items:center;color:var(--blue)}
.k-fb .tech .l{font-size:9px;letter-spacing:1.2px;text-transform:uppercase;color:var(--faint);font-weight:600}
.k-fb .tech b{display:block;font-size:18px;line-height:22px}
.k-fb .tech b small{font-size:11px;color:var(--muted);font-weight:500}
.k-fb .tech .slider{width:64px;height:5px;border-radius:3px;background:linear-gradient(90deg,var(--muscle),var(--blue));margin-left:auto;position:relative}
.k-fb .tech .slider i{position:absolute;right:12px;top:50%;width:20px;height:20px;border-radius:50%;background:var(--ink);transform:translateY(-50%)}
.k-fb .search{height:38px;border-radius:999px;background:#0B0B0B;border:1px solid rgba(255,255,255,.10);display:flex;align-items:center;gap:6px;padding:0 12px;font-size:12px;color:var(--faint);flex:none}
.k-fb .chips{display:flex;flex-wrap:wrap;gap:6px;flex:none}
.k-fb .dchip{height:30px;border-radius:999px;background:var(--inset);display:flex;align-items:center;gap:6px;padding:0 10px;font-size:11px;font-weight:600;color:var(--muted)}
.k-fb .dchip .pt{width:7px;height:7px;border-radius:50%;background:var(--muscle)}
.k-fb .dchip.on{background:var(--ink);color:#0B0B0A}
.k-fb .rel{background:rgba(67,209,140,.06);border:1px solid rgba(67,209,140,.20);border-radius:14px;padding:9px 11px;font-size:10.5px;line-height:15px;color:var(--muted);flex:none}
.k-fb .rel b{display:block;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--green);margin-bottom:3px}
.k-fb .act{display:flex;gap:6px;margin-top:auto;flex:none}
.k-fb .act .b{height:48px;border-radius:999px;display:grid;place-items:center;font-size:13px;font-weight:700}
.k-fb .act .b.inset{background:var(--inset);color:var(--ink);flex:1}
.k-fb .act .b.primary{background:var(--ink);color:#0B0B0A;flex:1.4}

/* resultado AMRAP */
.k-result{position:absolute;inset:0;z-index:19;background:#111111;border-radius:28px;border:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:24px;text-align:center}
.k-result .eyebrowline{font-size:9px;letter-spacing:1.3px;text-transform:uppercase;font-weight:600;color:var(--muscle)}
.k-result .big{font-family:var(--syne);font-size:56px;line-height:60px;font-weight:800;letter-spacing:-1.5px}
.k-result .big small{font-family:var(--inter);font-size:14px;font-weight:500;color:var(--muted);letter-spacing:0}
.k-result .subline{font-size:11px;color:var(--muted)}
.k-result .badge{height:24px;padding:0 10px;border-radius:999px;background:rgba(244,154,110,.12);border:1px solid rgba(244,154,110,.3);display:flex;align-items:center;font-size:10px;font-weight:600;color:var(--muscle)}
.k-result .row{display:flex;gap:6px;width:100%;margin-top:10px}
.k-result .row span{flex:1;height:44px;border-radius:999px;display:grid;place-items:center;font-size:11px;font-weight:700}
.k-result .row span:first-child{background:var(--ink);color:#0B0B0A}
.k-result .row span:last-child{background:var(--inset);color:var(--ink)}

/* feedback compacto */
.k-fbstrip{display:flex;align-items:center;gap:8px;background:var(--inset);border-radius:12px;padding:8px 10px;flex:none}
.k-fbstrip .ring{width:22px;height:22px;border-radius:50%;position:relative;background:conic-gradient(var(--muscle) 0 40%,#2A2A2A 40%)}
.k-fbstrip .ring:before{content:'';position:absolute;inset:3px;border-radius:50%;background:var(--inset)}
.k-fbstrip b{font-family:var(--syne);font-size:20px;line-height:22px}
.k-fbstrip span{font-size:10px;color:var(--faint)}

/* mesa */
.k-mesa{position:absolute;inset:0;padding:12px 10px 0;display:flex;flex-direction:column;gap:0;overflow:hidden}
.k-mesa .mtop{display:flex;align-items:baseline;padding:0 4px 8px;flex:none}
.k-mesa .mtop b{font-family:var(--syne);font-size:17px;font-weight:700}
.k-mesa .mtop span{margin-left:auto;font-size:9.5px;color:var(--faint)}
.k-mesa .scroll{flex:1;min-height:0;overflow:auto;padding-bottom:180px}
.k-mesa .scroll::-webkit-scrollbar{display:none}
.k-mgroup{display:flex;align-items:center;gap:6px;padding:6px 2px 5px;border-bottom:1px solid var(--line);margin-top:8px}
.k-mgroup .nm{font-size:11px;font-weight:600}
.k-mgroup .tag{height:17px;padding:0 6px;border-radius:8px;background:rgba(242,238,230,.08);display:flex;align-items:center;font-size:8.5px;color:var(--muted)}
.k-mgroup .meta{margin-left:auto;font-size:9px;color:var(--faint)}
.k-tr{display:grid;grid-template-columns:22px 1fr 68px 40px 14px;align-items:center;gap:6px;padding:6px 3px;border-bottom:1px solid rgba(255,255,255,.05);font-size:10px}
.k-tr .idx{color:var(--faint);font-size:9px}
.k-tr .ex{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.k-tr .ld{font-family:var(--syne);font-size:11px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.k-tr .ef{font-size:9px;color:var(--faint);text-align:right}
.k-tr .st{text-align:right;color:var(--faint);font-size:9px}
.k-tr.done .st{color:var(--green)}
.k-tr.active{background:rgba(242,238,230,.055);border-left:2px solid var(--ink);padding-left:4px}
.k-tr.active .ex{color:var(--ink);font-weight:600}
.k-meditor{padding:7px 5px 8px;border-bottom:1px solid var(--line);background:rgba(242,238,230,.03)}
.k-meditor .r1{display:flex;align-items:center;gap:6px}
.k-meditor .big{font-family:var(--syne);font-size:25px;font-weight:800;letter-spacing:-.6px}
.k-meditor .u{font-size:9.5px;color:var(--faint);padding-top:4px}
.k-meditor .mini{margin-left:auto;display:flex;gap:4px}
.k-meditor .mini span{height:24px;min-width:40px;padding:0 6px;border-radius:6px;background:var(--inset);display:grid;place-items:center;font-size:9.5px;font-weight:600;color:var(--muted)}
.k-meditor .r2{display:flex;align-items:center;gap:5px;margin-top:7px}
.k-rir{display:flex;gap:3px}
.k-rir span{width:22px;height:20px;border-radius:5px;background:rgba(242,238,230,.08);display:grid;place-items:center;font-size:9px;color:var(--faint)}
.k-rir span.on{background:var(--ink);color:#0B0B0A;font-weight:700}
.k-meditor .e1{margin-left:auto;font-size:9px;color:var(--faint)}
.k-meditor .acts{display:flex;gap:4px;margin-top:7px;flex-wrap:wrap}
.k-meditor .acts span{height:21px;padding:0 7px;border-radius:10px;border:1px solid rgba(242,238,230,.12);font-size:8.5px;font-weight:600;color:var(--muted);display:flex;align-items:center}
.k-mesa .foot{position:absolute;left:10px;right:10px;bottom:8px;background:#111110;border:1px solid var(--line);border-radius:18px;padding:9px 10px}

/* hojas */
.k-scrim{position:absolute;inset:0;background:rgba(0,0,0,.55);z-index:30}
.k-sheet{position:absolute;left:0;right:0;bottom:0;z-index:31;background:#121211;border-radius:26px 26px 0 0;border-top:1px solid rgba(255,255,255,.09);
  box-shadow:0 -24px 60px rgba(0,0,0,.6);max-height:76%;overflow:auto;padding:8px 16px 16px}
.k-sheet::-webkit-scrollbar{display:none}
.k-sheet.tall{max-height:88%}
.k-sheet.full{max-height:94%}
.k-handle{width:34px;height:4px;border-radius:2px;background:rgba(255,255,255,.18);margin:0 auto 9px}
.k-sheethead{display:flex;align-items:center;gap:8px}
.k-sheethead .st{flex:1;min-width:0}
.k-sheetx{height:32px;padding:0 11px;border-radius:999px;background:var(--inset);display:grid;place-items:center;font-size:10.5px;font-weight:600;color:var(--muted);flex:none;margin-left:auto}
.k-sheetx:hover{background:var(--inset);color:var(--ink)}
.k-sheet .st{font-family:var(--syne);font-size:20px;line-height:26px;font-weight:700}
.k-sheet .sd{font-size:10.5px;color:var(--faint);margin:2px 0 9px}
.k-srow{display:flex;align-items:center;gap:8px;padding:9px 2px;border-bottom:1px solid rgba(255,255,255,.055);font-size:11.5px;min-height:40px}
.k-srow .key{width:18px;color:var(--faint);font-size:10px;flex:none}
.k-srow .val{flex:1;min-width:0}
.k-srow .x{margin-left:auto;color:var(--faint);font-size:10px;white-space:nowrap}
.k-srow .x.on{color:var(--green)}
.k-srow .sw{width:34px;height:20px;border-radius:10px;background:var(--inset);position:relative;flex:none}
.k-srow .sw:after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--faint)}
.k-srow .sw.on{background:rgba(67,209,140,.3)}
.k-srow .sw.on:after{left:16px;background:var(--green)}
.k-sheet .inp{height:40px;border-radius:9px;background:var(--inset);display:flex;align-items:center;padding:0 10px;font-size:11.5px;color:var(--faint);margin-top:8px}
.k-sheet .rowbtns{display:flex;gap:6px;margin-top:10px}
.k-sheet .rowbtns .b{flex:1;height:40px;border-radius:999px;background:var(--inset);display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--ink)}
.k-sheet .rowbtns .b.primary{background:var(--ink);color:#0B0B0A}
.k-sheet .rowbtns .b.danger{background:rgba(255,155,146,.12);border:1px solid rgba(255,155,146,.35);color:var(--danger)}
.k-sheet .sect{font-size:9px;letter-spacing:1.2px;text-transform:uppercase;font-weight:600;color:#6f6b65;margin:12px 0 2px}
.k-sheet .metric{display:flex;gap:8px;margin-bottom:8px}
.k-sheet .metric div{flex:1;background:var(--inset);border-radius:10px;padding:8px}
.k-sheet .metric b{display:block;font-family:var(--syne);font-size:15px}
.k-sheet .metric span{display:block;font-size:8.5px;color:var(--faint);margin-top:1px}
.k-sheet .tile{display:flex;gap:8px;margin-top:6px}
.k-sheet .tile div{flex:1;min-height:64px;border-radius:12px;background:var(--inset);padding:8px;font-size:10px;line-height:14px;color:var(--muted);border:1px solid transparent}
.k-sheet .tile div.on{border-color:var(--muscle);background:rgba(244,154,110,.08)}
.k-sheet .tile b{display:block;font-size:11.5px;color:var(--ink);margin-bottom:2px}
.k-sheet .bars{display:flex;align-items:flex-end;gap:4px;height:44px;margin-top:8px}
.k-sheet .bars i{flex:1;background:rgba(242,238,230,.2);border-radius:2px}
.k-sheet .bars i.on{background:var(--green)}

.k-dialog{position:absolute;inset:0;z-index:35;background:rgba(0,0,0,.62);display:flex;align-items:center;justify-content:center;padding:26px}
.k-dialog .box{width:100%;background:#141413;border:1px solid rgba(255,255,255,.10);border-radius:20px;padding:16px}
.k-dialog .t{font-family:var(--syne);font-size:16px;font-weight:700}
.k-dialog .d{font-size:10.5px;color:var(--faint);margin:3px 0 10px;line-height:15px}
.k-dialog .r{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.055);font-size:11px}
.k-dialog .b{margin-top:10px;height:36px;border-radius:18px;background:var(--ink);color:#0B0B0A;display:grid;place-items:center;font-size:12px;font-weight:700}
.k-dialog .b.danger{background:rgba(255,155,146,.12);border:1px solid rgba(255,155,146,.35);color:var(--danger)}

/* fallo */
.k-failoverlay{position:absolute;inset:0;z-index:20;background:rgba(139,30,30,.96);border-radius:28px;padding:14px 16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center}
.k-failoverlay .t{font-family:var(--syne);font-size:16px;font-weight:700;color:var(--ink)}
.k-failoverlay .d{font-size:11px;line-height:15px;color:rgba(255,255,255,.92)}
.k-failoverlay .l{font-size:10px;font-weight:700;letter-spacing:.4px;color:rgba(255,255,255,.9);align-self:flex-start}
.k-failoverlay .field{width:100%;height:34px;border-radius:10px;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.2);display:flex;align-items:center;padding:0 8px;font-size:10px;color:rgba(255,255,255,.7);text-align:left}
.k-failoverlay .chips{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
.k-failoverlay .chips span{height:23px;padding:0 8px;border-radius:999px;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.2);display:flex;align-items:center;font-size:10px;color:rgba(255,255,255,.92)}
.k-failoverlay .rev{height:38px;min-width:140px;padding:0 18px;border-radius:10px;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.25);display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--ink)}

/* guiado / asistido */
.k-guided{position:absolute;left:0;right:0;bottom:0;z-index:18;background:var(--module);border-top:1px solid var(--line);padding:10px;max-height:calc(100% - 112px);overflow:auto}
.k-guided .eyebrowline{font-size:9px;letter-spacing:1.2px;text-transform:uppercase;font-weight:600;color:var(--muscle)}
.k-guided .cp{font-size:11px;line-height:15px;color:var(--muted);margin:3px 0 7px}
.k-guided .fields{display:flex;gap:6px}
.k-guided .f{flex:1;height:38px;border-radius:9px;background:var(--inset);display:flex;align-items:center;padding:0 9px;font-size:11px;color:var(--faint)}
.k-guided .sug{font-size:10px;color:var(--faint);margin-top:5px}
.k-guided .skip{margin-top:8px;text-align:center;font-size:11px;font-weight:600;color:var(--muted)}
.k-guided .bigclock{display:flex;align-items:center;gap:8px;margin:2px 0 6px}
.k-guided .bigclock b{font-family:var(--syne);font-size:28px;font-weight:700}
.k-guided .bar{height:6px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden;margin:6px 0}
.k-guided .bar i{display:block;height:100%;width:58%;background:var(--muscle)}
.k-assisted{position:absolute;left:0;right:0;bottom:0;z-index:18;background:#222;padding:10px;display:flex;gap:10px;align-items:center}
.k-assisted .f{flex:1;height:42px;border-radius:8px;background:#2A2A2A;border:1px solid #555;display:flex;align-items:center;padding:0 9px;font-size:11px;color:rgba(255,255,255,.7)}
.k-assisted .b{height:38px;padding:0 16px;border-radius:999px;background:var(--muscle);color:#0B0B0A;display:grid;place-items:center;font-size:12px;font-weight:700}

/* undo */
.k-undo{position:absolute;left:50%;bottom:132px;transform:translateX(-50%);height:40px;padding:0 18px;border-radius:999px;background:var(--ink);color:#0B0B0A;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;z-index:22;white-space:nowrap;box-shadow:0 10px 30px rgba(0,0,0,.5)}

/* sistema / fundamentos */
.k-found{position:absolute;inset:0;padding:24px 20px;overflow:auto;background:var(--canvas)}
.k-found h2{font-family:var(--syne);font-size:24px;font-weight:800;letter-spacing:-.4px}
.k-found .lead{font-size:11px;line-height:16px;color:var(--muted);margin-top:5px}
.k-found .grp{margin-top:18px;padding-top:12px;border-top:1px solid var(--line)}
.k-found .grp h3{font-size:9px;letter-spacing:1.3px;text-transform:uppercase;color:var(--faint);font-weight:600;margin-bottom:8px}
.k-found .swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.k-found .sw{height:52px;border-radius:8px;border:1px solid rgba(255,255,255,.08);position:relative;padding:6px}
.k-found .sw span{position:absolute;left:6px;bottom:4px;font-size:7.5px;color:rgba(255,255,255,.7);font-family:var(--mono)}
.k-found .type{display:flex;flex-direction:column;gap:7px}
.k-found .type div{display:flex;align-items:baseline;gap:8px;border-bottom:1px solid rgba(255,255,255,.05);padding-bottom:5px}
.k-found .type b{font-family:var(--syne);font-size:22px;font-weight:700}
.k-found .type .sm{font-family:var(--syne);font-size:14px;font-weight:700}
.k-found .type .in{font-size:11px;color:var(--muted)}
.k-found .type span{margin-left:auto;font-family:var(--mono);font-size:8px;color:var(--faint)}
.k-found .rules{display:flex;flex-direction:column;gap:5px}
.k-found .rules div{font-size:10.5px;line-height:15px;color:var(--muted);padding-left:10px;position:relative}
.k-found .rules div:before{content:'';position:absolute;left:0;top:6px;width:3px;height:3px;border-radius:50%;background:var(--muscle)}

/* raíl de sesión */
.k-rail{
  position:absolute;left:16px;right:16px;bottom:32px;height:112px;border-radius:26px;
  background:rgba(22,22,22,.90);border:1px solid rgba(242,238,230,.10);
  padding:6px;display:flex;flex-direction:column;z-index:6;backdrop-filter:blur(14px);
}
.k-phone.compact .k-rail{left:16px;right:16px;bottom:26px}
.k-routerow{height:44px;display:flex;align-items:center;gap:4px;flex:none}
.k-route{flex:1;height:44px;border-radius:20px;display:flex;align-items:center;gap:6px;padding:0 4px;min-width:0}
.k-route .txt{flex:1;min-width:0}
.k-route b{display:block;font-size:13px;line-height:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.k-route span{display:block;font-size:11px;line-height:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.k-route svg{color:var(--ink);flex:none}
.k-addpill{height:28px;min-width:34px;padding:0 10px;border-radius:999px;background:var(--inset);font-size:13px;font-weight:600;color:var(--muted);flex:none}
.k-miniundo{width:44px;height:44px;border-radius:50%;background:var(--ink);color:#0B0B0A;display:grid;place-items:center;flex:none}
.k-steprow{height:56px;display:flex;align-items:center;gap:4px;min-width:0;flex:none}
.k-stepcarril{position:relative;flex:1;height:56px;display:flex;align-items:center;min-width:0;overflow:hidden;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 16px,#000 calc(100% - 16px),transparent 100%);
  mask-image:linear-gradient(90deg,transparent 0,#000 16px,#000 calc(100% - 16px),transparent 100%)}
.k-stepcarril:before{content:'';position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(242,238,230,.14)}
.k-step{position:relative;width:48px;height:56px;display:grid;place-items:center;flex:none;z-index:1}
.k-steppill{width:44px;height:34px;border-radius:18px;background:#202020;border:1px solid rgba(242,238,230,.10);
  display:grid;place-items:center;font-size:11px;line-height:14px;font-weight:600;color:var(--ink)}
.k-step.active .k-steppill{height:44px;background:var(--ink);color:#0B0B0A;border-color:var(--ink)}
.k-step.done .k-steppill{color:var(--green)}
.k-step.skipped .k-steppill{opacity:.4}
.k-step.cal .k-steppill{border-radius:12px}
.k-step .cal{font-size:7px;line-height:8px;color:var(--muted);margin-top:1px}
.k-step.active .cal{color:var(--ink)}
.k-steprail{display:flex;align-items:center;height:56px;transition:transform .35s cubic-bezier(.2,.7,.2,1)}
.k-record{width:52px;height:52px;border-radius:50%;background:var(--muscle);display:grid;place-items:center;color:#0B0B0A;flex:none;border:0}
.k-record:hover{filter:brightness(1.06)}
.k-navbar{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);width:108px;height:4px;border-radius:2px;background:rgba(242,238,230,.35);z-index:8}

/* banda del relator */
.k-relator{
  position:absolute;left:54px;right:18px;display:flex;flex-direction:column;justify-content:center;gap:5px;
  z-index:3;pointer-events:none;
}
.k-relator:before{content:'';position:absolute;left:-34px;right:0;top:0;height:1px;background:rgba(255,255,255,.045)}
.k-relator .rlane{display:flex;align-items:center;gap:5px;height:16px;opacity:.55}
.k-relator .rlane i{display:block;width:6px;height:6px;border-radius:50%;background:var(--muscle)}
.k-relator .rlane i:nth-child(2){background:var(--blue);width:5px;height:5px}
.k-relator .rlane i:nth-child(3){background:var(--energy);width:4px;height:4px}
.k-relator .rline{font-size:13px;line-height:16px;color:var(--muted)}
.k-relator .rline b{color:var(--ink);font-weight:600}

/* detalles que faltaban */
.k-cardbody{overflow:hidden;justify-content:space-between;padding-top:6px}
.k-title.marquee{-webkit-mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 22px),transparent 100%);mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 22px),transparent 100%)}
.k-band.center{background:rgba(255,255,255,.04);border-radius:8px;padding:3px 8px;gap:0}
.k-tag{display:inline-flex;align-items:center;height:19px;padding:0 7px;border-radius:9px;background:rgba(242,238,230,.08);font-size:9px;font-weight:600;color:var(--muted)}
.k-sheet::-webkit-scrollbar{display:none}
.k-sheet .rowbtns .b{cursor:pointer}
.k-srow{cursor:pointer}
.k-srow:hover{background:rgba(255,255,255,.03)}
.k-minichip{top:128px}
.k-phone.compact .k-minichip{top:104px}
.k-face .k-note{margin-top:auto}
.k-face .k-errorpill{margin-top:0}
.k-mesa .scroll::-webkit-scrollbar{display:none}
.k-tr{padding:6px 3px}
.k-dialog .b{cursor:pointer}
.k-failoverlay .rev{cursor:pointer}

/* marquesina del título (solo si desborda) */
.k-title.marquee span.mq{display:inline-block;white-space:nowrap;animation:kmq var(--dur,13s) linear infinite}
@keyframes kmq{
  0%,18%{transform:translateX(0)}
  42%,58%{transform:translateX(var(--shift,-34px))}
  82%,100%{transform:translateX(0)}
}

/* movimiento reducido */
.reduced *{animation:none!important;transition:none!important}
.reduced .k-title.marquee span.mq{animation:none!important;transform:none!important}

/* utilitarios */
.hidden{display:none!important}
.mono{font-family:var(--mono)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ── geometría ── */
function sceneSize(s){
  const w = (s.device && s.device.w) || 393;
  const h = (s.device && s.device.h) || 852;
  const cw = Math.min(w - 48, 358);
  return {w, h, cw, ch: cw / (312/425), compact: h < 800};
}
function applyGeometry(s){
  const g = sceneSize(s);
  const dev = $('#device'), pins = $('#pins');
  dev.style.width = g.w + 'px'; dev.style.height = g.h + 'px';
  pins.style.width = g.w + 'px'; pins.style.height = g.h + 'px';
  dev.style.setProperty('--pw', g.w + 'px');
  dev.style.setProperty('--ph', g.h + 'px');
  dev.style.setProperty('--card-w', g.cw + 'px');
  dev.style.setProperty('--card-h', g.ch + 'px');
}

function chromeOf(s){ return Object.assign({}, CHROME, s.chrome || {}); }

function statusbar(){

    <div class="bars"><i></i><i></i><i></i><i></i></div>

}

function header(c){
  const titleChips = (c.chips || []).map(x => `<span class="chip"> · ${esc(x)}</span>`).join('');
  const sub = [c.protocol, c.group, c.session].filter(Boolean).join(' · ');
  let chips = '';
  (c.railChips || []).forEach(ch => {
    if (ch.type === 'timer') {
      chips += `<span class="k-chip"><span class="k-ring">${icon('timer',10)}</span>${esc(ch.label)}${ch.limit ? `<span class="sub"> / ${esc(ch.limit)}</span>` : ''}</span>`;
    } else if (ch.label === 'Superserie') {
      chips += `<span class="k-chip red">${icon('swap',12)}${esc(ch.label)}</span>`;
    } else {
      chips += `<span class="k-chip ${ch.cls||''}">${esc(ch.label)}${ch.dd ? '<span class="dd">▾</span>' : ''}${ch.x ? '<span class="x">×</span>' : ''}</span>`;
    }
  });
  const longTitle = (c.exercise + ' ' + (c.chips||[]).join(' ')).length > 30;
  return `<div class="k-header"><div class="k-header-inner">
    <div class="k-hrow">
      <div class="k-titlecol">
        <div class="k-title ${longTitle?'marquee':''}"><span class="mq">${esc(c.exercise)}${titleChips}</span></div>
        <div class="k-sub">${esc(sub)}</div>
      </div>
      <div class="k-icons">
        <div class="k-icon"><div class="cir">${icon('book',20)}</div></div>
        <div class="k-icon"><div class="cir">${icon('mic',20)}</div></div>
        <div class="k-icon"><div class="cir">${icon('more',20)}</div></div>
      </div>
    </div>
    <div class="k-chips">${chips}</div>
  </div></div>`;
}

function rail(c, d, opts={}){
  const done = !!(d && d.done);
  let steps = '';
  (c.steps || []).forEach(st => {
    const cls = ['k-step'];
    if (st.state === 'active') cls.push('active');
    if (st.state === 'done') cls.push('done');
    if (st.state === 'skipped') cls.push('skipped');
    if (st.calibrated) cls.push('cal');
    const label = st.state === 'done' ? '✓' + st.label : st.label;
    steps += `<div class="${cls.join(' ')}"><div class="k-steppill">${esc(label)}</div>${st.calibrated ? '<span class="cal">calibrada</span>' : ''}</div>`;
  });
  const undo = d && d.undo ? `<div class="k-miniundo" title="${esc(d.undo)}">${icon('undo',18)}</div>` : '';
  const activeIdx = (c.steps || []).findIndex(st => st.state === 'active');
  const shift = Math.max(0, (activeIdx < 0 ? 0 : activeIdx) * 48 - 120);
  return `<div class="k-rail">
    <div class="k-routerow">
      <div class="k-route">${icon('route',20)}<div class="txt"><b>${esc(c.route)}</b><span>${esc(c.routeSub)}</span></div>${icon('chevronRight',16)}</div>
      ${undo}
      <button class="k-addpill" data-act="sheet:series">+</button>
    </div>
    <div class="k-steprow">
      <div class="k-stepcarril"><div class="k-steprail" style="transform:translateX(-${shift}px)">${steps}</div></div>
      <button class="k-record" data-act="record" aria-label="${done ? 'Actualizar serie' : 'Registrar serie'}">${icon(done ? 'update' : 'check', 25)}</button>
    </div>
  </div>`;
}

function hero(d){
  const load = d.load == null ? 100 : d.load;
  const required = !!d.loadRequired;
  const isDash = load === '—' || required;
  const text = required ? 'Carga a elegir' : String(load);
  const long = text.length >= 7;
  const unit = required ? '' : (d.unit || 'kg');
  let side = '';
  if (d.mode === 'AMRAP') side = `<b>Mín. ${d.amrapMin || 8}</b><span>${d.result ? '11 reps' : 'objetivo'}</span>`;
  else if (d.mode === 'CALIB') side = `<b>Sin mínimo</b><span>ajusta el 1RM</span>`;
  else if (d.mode === 'DONE' || d.done) side = `<b>RIR ${d.rir == null ? 2 : d.rir}</b><span>e1RM 112,5</span>`;
  else side = `<b>RIR ${d.rir == null ? 2 : d.rir}</b><span>e1RM 112,5</span>`;
  const chip = (l,v) => `<div class="k-chip3"><span>${esc(l)}</span><b>${esc(v)}</b></div>`;
  const baseLoad = parseFloat(String(load).replace(',', '.'));
  const sug = d.suggested != null
    ? String(d.suggested).replace('.', ',')
    : (isFinite(baseLoad) && baseLoad > 0 ? String(baseLoad + 2.5).replace('.', ',') : '—');
  return `<div class="k-hero">
    <div class="k-hero-label">${d.solo ? 'PESO CORPORAL' : 'CARGA (kg)'}</div>
    <div class="k-hero-main"><span class="k-hero-val ${long || required ? 'sm' : ''}" style="${required ? 'color:var(--faint)' : ''}">${esc(text)}</span>${unit ? `<span class="k-hero-unit">${esc(unit)}</span>` : ''}<span class="k-hero-side">${side}</span></div>
    <div class="k-chips3">${chip('−2,5','')}${chip('Sugerido', isDash ? '—' : sug)}${chip('+2,5','')}</div>
    <div class="k-hero-foot">${icon('chevronDown',12)} ${d.solo ? 'Corporal' : 'Externa'}</div>
  </div>`;
}

}

function rmControls(d){

function effort(d){
  const rir = d.rir;
  const rpe = d.rpe != null ? Number(String(d.rpe).replace(',','.')) : (rir != null ? 10 - Number(rir) : null);
  let fill = 58, idx = 2, right = 'Sin marcar';
  if (d.failure) { fill = 100; idx = 5; right = 'Fallo · todo'; }
  else if (rpe != null) {
    fill = Math.max(6, Math.min(100, rpe * 10));
    idx = Math.max(0, Math.min(5, Math.round((rpe - 5) * 1.2)));
    const words = ['cómodo','firme','exigente','muy duro','al límite','todo'];
    right = (rir != null ? `RIR ${rir}` : `RPE ${String(d.rpe).replace('.',',')}`) + ' · ' + words[idx];
  }
  const labels = ['cómodo','firme','exigente','muy duro','al límite','todo'];
  const plan = d.planRir != null ? Math.max(4, Math.min(96, (10 - d.planRir) * 10)) : 35;
  return `<div class="k-effort">
    <div class="k-effort-head"><span class="k-eyebrow">ESFUERZO</span><span class="r">${esc(right)}</span></div>
    <div class="k-trackwrap"><div class="k-track"><i class="fill" style="width:${fill}%"></i><i class="plan" style="left:${plan}%"></i><i class="thumb" style="left:${fill}%"></i></div></div>
    <div class="k-effort-labels">${labels.map((w,i) => `<span class="${i===idx?'on':''} ${w==='todo'?'fail':''}">${w}</span>`).join('')}</div>
    ${d.hint ? `<div class="k-hint">${esc(d.hint)}</div>` : ''}
  </div>`;
}

function romBlock(d){

/* ── descanso ── */
function clockSVG(shape, progress){
  const p = Math.max(0, Math.min(1, progress));
  if (shape === 'track') {
    return `<svg viewBox="0 0 120 104" aria-hidden="true">
      <rect x="12" y="20" width="96" height="64" rx="32" fill="none" stroke="#242424" stroke-width="2"/>
      <rect x="12" y="20" width="96" height="64" rx="32" fill="none" stroke="#F2EEE6" stroke-width="2" pathLength="100" stroke-dasharray="${p*100} 100" stroke-linecap="round"/>
      <circle cx="${12 + 96*Math.min(1,p*1.0)}" cy="${20 + 32}" r="2.6" fill="#F2EEE6"/>
    </svg>`;
  }
  if (shape === 'spiral') {
    let d = 'M60 52';
    for (let i=0;i<12;i++){
      const a0 = Math.PI * (i/6), a1 = Math.PI * ((i+1)/6);
      const r0 = 8 + i*5, r1 = 8 + (i+1)*5;
      d += ` L${(60 + r0*Math.cos(a0)).toFixed(1)} ${(52 + r0*Math.sin(a0)).toFixed(1)} L${(60 + r1*Math.cos(a1)).toFixed(1)} ${(52 + r1*Math.sin(a1)).toFixed(1)}`;
    }
    return `<svg viewBox="0 0 120 104" aria-hidden="true">
      <path d="${d}" fill="none" stroke="#242424" stroke-width="2"/>
      <path d="${d}" fill="none" stroke="#F2EEE6" stroke-width="2" pathLength="100" stroke-dasharray="${p*100} 100" stroke-linecap="round"/>
    </svg>`;
  }
  const rings = [[60,78,48,14],[60,39,11,6],[35,26,8,5]];
  const pp = p*3;
  return `<svg viewBox="0 0 120 104" aria-hidden="true">
    ${rings.map((r,i) => {
      const fill = Math.max(0, Math.min(1, pp - i));
      const ang = -Math.PI/2 + fill*Math.PI*2;
      const cx = r[0] + r[2]*Math.cos(ang), cy = r[1] + r[3]*Math.sin(ang);
      return `<ellipse cx="${r[0]}" cy="${r[1]}" rx="${r[2]}" ry="${r[3]}" fill="none" stroke="#242424" stroke-width="2"/>
        <ellipse cx="${r[0]}" cy="${r[1]}" rx="${r[2]}" ry="${r[3]}" fill="none" stroke="#F2EEE6" stroke-width="2" pathLength="100" stroke-dasharray="${fill*100} 100" stroke-linecap="round"/>
        ${fill>0&&fill<1?`<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="2.6" fill="#F2EEE6"/>`:''}`;
    }).join('')}
  </svg>`;
}

function rest(s){
  const d = s.data || {};
  const extra = d.extra || d.mode === 'extra';
  const label = extra ? 'TIEMPO EXTRA' : 'DESCANSO';
  const mode = d.mode === 'manual' ? '· manual' : (d.mode === 'adaptive' ? '· sugerido' : '· sugerido');
  const time = d.remaining || '1:12';
  return `<div class="k-card"><div class="k-rest">
    <div class="head"><span class="lb">${label}</span><span class="mode">${extra ? '+0:34 sobre 2:00' : `${mode} · de ${d.total||'2:00'}`}</span></div>
    <div class="clockwrap"><div class="k-restclock">${clockSVG(d.shape || 'tower', d.progress == null ? .4 : d.progress)}</div></div>
    <div class="k-rest-time"><b>${esc(time)}</b><span>${extra ? 'sobre 2:00' : 'restante'}</span></div>
    ${extra ? `<div class="k-band center"><span>El descanso se pasó · la siguiente serie puede verse afectada</span></div>` : ''}

    ${row('3','Efectiva','100 × 8','RIR 2','●','active')}${editor}${row('4','Efectiva','100 × 8','—','·')}`;
  const groupB = d.superset
    ? `<div class="k-mgroup"><span class="nm">Superserie · Prensa + Curl</span><span class="tag">Ronda 1 / 3</span><span class="meta">2 ejercicios · ⋯</span></div>
       ${row('1','Prensa de piernas','180 × 10','RIR 2','●','active')}${row('2','Curl femoral','60 × 12','RIR 1','·')}${row('3','Prensa de piernas','180 × 10','—','·')}`
    : `<div class="k-mgroup"><span class="nm">Peso muerto rumano</span><span class="tag">Multipower</span><span class="meta">140 kg · 3 series · ⋯</span></div>
       ${row('A1','60 %','80 × 5','','✓','done')}${row('1','Efectiva','140 × 5','RIR 2','·')}${row('2','Efectiva','140 × 5','—','·')}`;

    <div class="scroll">${groupA}${groupB}

}

/* ── hojas ── */
function sheet(id){
  const s = SHEETS[id];
  if (!s) return '';
  const tall = id==='route'||id==='reorder'?'tall':'';
  const full = id==='album'||id==='finish'?'full':'';
  let h = `<div class="k-scrim" data-act="close-sheet"></div><div class="k-sheet ${tall} ${full}">`;
  h += `<div class="k-handle"></div><div class="k-sheethead"><div class="st">${esc(s.title)}</div><button class="k-sheetx" data-act="close-sheet" aria-label="Cerrar ${esc(s.title)}">Cerrar</button></div>`;
  if (s.desc) h += `<div class="sd">${esc(s.desc)}</div>`;
  if (s.big) h += `<div style="font-family:var(--syne);font-size:34px;line-height:38px;font-weight:800;margin:2px 0 8px">${esc(s.big)}</div>`;
  if (s.metrics) h += `<div class="metric">${s.metrics.map(m => `<div><b>${esc(m[0])}</b><span>${esc(m[1])}</span></div>`).join('')}</div>`;
  if (s.simple && s.rows) h += s.rows.map(r => `<div class="k-srow"><span class="val" style="font-size:12.5px;font-weight:600">${esc(r[1])}</span><span class="x">${icon('chevronRight',14)}</span></div>`).join('');
  else if (s.rows && s.rows.length) h += s.rows.map(r => `<div class="k-srow"><span class="key">${esc(r[0])}</span><span class="val">${esc(r[1])}</span>${r[2]?`<span class="x ${r[2]==='Hecha'||r[2]==='PR'?'on':''}">${esc(r[2])}</span>`:''}</div>`).join('');
  if (s.toggle) h += `<div class="k-srow"><span class="key">↗</span><span class="val">${esc(s.toggle)}</span><span class="sw on"></span></div>`;
  if (s.sect) h += `<div class="sect">${esc(s.sect)}</div>`;
  if (s.tiles) h += `<div class="tile">${s.tiles.map((t,i) => `<div class="${i===1?'on':''}"><b>${esc(t[0])}</b>${esc(t[1])}</div>`).join('')}</div>`;
  if (s.subs) h += `<div class="sect">Subetiquetas</div>` + s.subs.map(x => `<div class="k-srow"><span class="key">×</span><span class="val">${esc(x)}</span><span class="x">Quitar</span></div>`).join('');
  if (s.fields) h += `<div class="metric" style="margin-top:8px">${s.fields.map(f => `<div><span>${esc(f)}</span><b style="font-size:14px;color:var(--faint)">—</b></div>`).join('')}</div>`;
  if (s.input) h += `<div class="inp">${esc(s.input)}</div>`;
  if (s.hint) h += `<div style="font-size:10px;line-height:14px;color:var(--faint);margin-top:8px">${esc(s.hint)}</div>`;
  if (s.actions && s.actions.length) h += `<div class="rowbtns">${s.actions.map((a,i) => `<div class="b ${i===s.actions.length-1?'primary':''}" data-act="close-sheet">${esc(a)}</div>`).join('')}</div>`;
  h += `</div>`;
  return h;
}

function dialog(kind, s){

    <div class="t">Actualizar serie</div><div class="d">Esta serie ya estaba registrada. ¿Quieres actualizarla?</div>

  </div></div>`;

    <div class="b" data-act="close-dialog">Continuar entrenando</div>

}
