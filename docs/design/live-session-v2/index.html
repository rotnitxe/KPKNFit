<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>KPKN · Sesión en vivo · todas las instancias</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--cream:#F2EEE6;--muted:#B5B1AC;--faint:#7A7670;--hair:rgba(255,255,255,.08);--bg:#0B0B0A;--surf:#131312;--inset:#1C1C1B;--green:#7FE3B0;--amber:#FFA15C;--sage:#A9C4B6;--red:#FF9B92}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#060606;color:var(--cream);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{display:flex;gap:44px;padding:34px;align-items:flex-start}
.rail{width:320px;position:sticky;top:34px;max-height:calc(100vh - 68px);overflow:auto}
.rail::-webkit-scrollbar{width:3px}.rail::-webkit-scrollbar-thumb{background:#222}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.mark{width:34px;height:34px;border-radius:10px;background:var(--cream);color:#0B0B0A;display:grid;place-items:center;font-family:Syne;font-weight:800;font-size:15px}
.brand b{font-family:Syne;font-weight:800;font-size:18px}.brand small{display:block;color:var(--faint);font-size:10.5px;margin-top:1px}
.g{font-size:9.5px;letter-spacing:1.4px;color:var(--faint);text-transform:uppercase;margin:16px 0 6px;font-weight:600}
.it{display:block;width:100%;text-align:left;background:none;border:0;color:var(--muted);font:inherit;font-size:12.5px;padding:6px 9px;border-radius:8px;cursor:pointer}
.it.on{background:#171716;color:var(--cream)}
.it small{display:block;font-size:10px;color:var(--faint);margin-top:1px}
.phone{width:393px;height:852px;border-radius:46px;background:#000;border:1px solid #222;position:relative;overflow:hidden;box-shadow:0 30px 90px rgba(0,0,0,.65);flex:none}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg)}
.status{display:flex;justify-content:space-between;padding:13px 22px 0;font-size:12px;font-weight:600;flex:none}
.hdr{margin:7px 13px 0;padding:8px 9px 8px 11px;border-radius:999px;background:#141413;display:flex;align-items:center;gap:9px;border:1px solid rgba(255,255,255,.05);flex:none}
.hdr .txt{flex:1;min-width:0}.hdr .t{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .s{font-size:10px;color:var(--faint);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.circ{width:29px;height:29px;border-radius:50%;background:#1E1E1D;display:grid;place-items:center;font-size:12px;color:var(--muted);flex:none}
.restchip{display:flex;align-items:center;gap:5px;height:29px;padding:0 9px;border-radius:15px;background:rgba(242,238,230,.07);font-size:10.5px;font-weight:600;font-variant-numeric:tabular-nums;flex:none}
.ring{width:13px;height:13px;border-radius:50%;border:2px solid var(--cream);border-right-color:rgba(242,238,230,.18);transform:rotate(45deg)}
.actions{display:flex;gap:6px;overflow:auto;padding:8px 14px 0;flex:none}
.actions::-webkit-scrollbar{display:none}
.actions span{flex:none;height:26px;padding:0 10px;border-radius:13px;background:rgba(242,238,230,.05);border:1px solid rgba(255,255,255,.06);font-size:10.5px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:4px;white-space:nowrap}
.actions span.on{background:var(--cream);color:#0B0B0A;border-color:var(--cream)}
.zone{flex:1;min-height:0;display:flex;align-items:center;padding:10px 15px 0}
.card{width:100%;height:452px;background:var(--surf);border:1px solid var(--hair);border-radius:24px;padding:13px 15px;display:flex;flex-direction:column;overflow:hidden;position:relative}
.card.mob{border-color:rgba(169,196,182,.22)}.card.warm{border-color:rgba(255,161,92,.22)}
.card.fail{border-color:rgba(255,155,146,.45)}
.head{display:flex;align-items:center;gap:6px;flex:none;height:20px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--cream)}.card.mob .dot{background:var(--sage)}.card.warm .dot{background:var(--amber)}
.eyebrow{font-size:9.5px;letter-spacing:1.2px;text-transform:uppercase;font-weight:600;color:var(--faint)}
.card.mob .eyebrow{color:var(--sage)}.card.warm .eyebrow{color:var(--amber)}
.head .meta{margin-left:auto;font-size:10px;color:var(--faint)}
.tag{display:inline-flex;align-items:center;gap:3px;height:19px;padding:0 7px;border-radius:9px;background:rgba(127,227,176,.12);color:var(--green);font-size:9.5px;font-weight:600}
.tag.r{background:rgba(255,155,146,.14);color:var(--red)}
.hero{display:flex;align-items:flex-end;gap:6px;flex:none;height:50px;margin-top:9px}
.hero .v{font-family:Syne;font-weight:800;font-size:40px;line-height:42px;letter-spacing:-1.1px;font-variant-numeric:tabular-nums}
.hero .u{font-size:11px;color:var(--muted);font-weight:600;padding-bottom:4px}
.hero .side{margin-left:auto;text-align:right;padding-bottom:2px}
.hero .side b{font-family:Syne;font-size:16px}.hero .side span{display:block;font-size:9.5px;color:var(--faint);margin-top:1px}
.sub{font-size:11px;color:var(--faint);flex:none}
.track{height:3px;border-radius:2px;background:rgba(255,255,255,.08);margin-top:8px;flex:none;overflow:hidden}
.track i{display:block;height:3px;background:var(--sage)}.card.warm .track i{background:var(--amber)}.card.work .track i{background:var(--cream)}
.body{flex:1;min-height:0;display:flex;flex-direction:column;padding-top:9px}
.foot{flex:none;display:flex;flex-direction:column;gap:7px;padding-top:9px;border-top:1px solid var(--hair)}
.links{display:flex;justify-content:space-between;padding:0 1px}
.links span{font-size:11px;font-weight:600;color:var(--muted)}
.kpills{display:flex;gap:5px;flex:none}
.kpill{flex:1;height:30px;border-radius:9px;background:var(--inset);display:flex;align-items:center;justify-content:center;gap:4px;font-size:10.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.kpill b{color:var(--cream);font-family:Syne;font-size:11.5px}
.wheel{display:flex;align-items:center;justify-content:space-between;padding:0 3px;margin-top:6px;flex:none;height:46px}
.wheel span{font-family:Syne;font-weight:700;font-size:15px;color:var(--faint);width:30px;text-align:center}
.wheel span.c{font-size:36px;color:var(--cream);width:66px;line-height:42px}
.wlab{display:flex;justify-content:space-between;padding:0 7px;flex:none}
.wlab span{font-size:8px;letter-spacing:1px;color:var(--faint);font-weight:600}
.fire{display:flex;gap:4px;margin-top:7px;flex:none}
.fire div{flex:1;height:26px;border-radius:7px;background:rgba(242,238,230,.09);display:grid;place-items:center;font-size:10px;font-weight:600;color:var(--faint)}
.fire div.on{background:var(--cream);color:#0B0B0A}.fire div.hot{background:rgba(255,161,92,.16);color:var(--amber);border:1px solid rgba(255,161,92,.4)}
.hist{margin-top:auto;display:flex;align-items:flex-end;gap:12px;border-top:1px solid var(--hair);padding-top:9px}
.hlab{font-size:8px;letter-spacing:1px;color:var(--faint);font-weight:600;line-height:13px}
.hlab b{font-family:Syne;font-size:12.5px;letter-spacing:0;color:var(--cream)}
.hbars{display:flex;align-items:flex-end;gap:3px;height:30px;margin-left:auto}
.hbars i{display:block;width:8px;border-radius:3px 3px 1px 1px;background:rgba(242,238,230,.22)}
.hbars i.on{background:var(--green)}
.band{display:flex;align-items:center;gap:7px;padding:6px 9px;border-radius:9px;background:rgba(255,155,146,.10);border:1px solid rgba(255,155,146,.24);font-size:10.5px;color:var(--red);flex:none;margin-top:7px}
.seg{display:flex;gap:3px;background:#0D0D0C;border-radius:15px;padding:3px;flex:none;margin-top:7px}
.seg b{flex:1;height:26px;border-radius:12px;display:grid;place-items:center;font-size:10.5px;font-weight:600;color:var(--faint)}
.seg b.on{background:var(--cream);color:#0B0B0A}
.chain{display:flex;align-items:center;gap:6px;padding:7px 10px;border-radius:11px;background:var(--inset);font-size:10.5px;flex:none;margin-top:8px}
.chain i{color:var(--faint);font-style:normal}
.trow{display:flex;align-items:center;padding:4px 1px;flex:1;min-height:0}
.trow .nm{font-size:11.5px}
.stepper{display:flex;align-items:center;gap:6px;margin-left:auto}
.stepper span{width:23px;height:23px;border-radius:7px;background:var(--inset);display:grid;place-items:center;font-size:11px;color:var(--muted)}
.stepper b{font-family:Syne;font-size:13px;min-width:42px;text-align:center}
.field{height:32px;border-radius:9px;background:var(--inset);display:flex;align-items:center;padding:0 10px;color:var(--faint);font-size:11.5px;flex:none}
.mrow{display:flex;align-items:center;gap:8px;padding:5px 4px;border-radius:8px;flex:1;min-height:0}
.mrow.on{background:rgba(242,238,230,.06)}.mrow.done .nm{color:var(--faint);text-decoration:line-through}
.check{width:16px;height:16px;border-radius:50%;border:1px solid rgba(242,238,230,.25);flex:none;display:grid;place-items:center;font-size:8px;color:#0B0B0A}
.mrow.done .check{background:var(--sage);border-color:var(--sage)}
.nm{font-size:12px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dose{font-size:10px;color:var(--faint);font-variant-numeric:tabular-nums}
.wrow{display:grid;grid-template-columns:28px 38px 1fr 40px 34px;align-items:center;gap:7px;padding:5px 6px;border-radius:9px;flex:1;min-height:0}
.wrow.on{background:rgba(255,161,92,.07);border:1px solid rgba(255,161,92,.22)}
.wrow.done{opacity:.42}
.widx{font-size:10px;font-weight:700;color:var(--amber)}.wpct{font-size:10px;color:var(--faint)}
.wkg{font-family:Syne;font-weight:700;font-size:17px;text-align:right;font-variant-numeric:tabular-nums}
.wkg em{font-style:normal;font-size:8.5px;color:var(--faint);font-weight:600;margin-left:2px}
.wreps{font-size:10.5px;color:var(--muted);text-align:right}.wrest{font-size:9.5px;color:var(--faint);text-align:right}
.bottom{flex:none;margin:9px 13px 11px;padding:10px 11px 9px;border-radius:21px;background:#111110;border:1px solid rgba(255,255,255,.06)}
.roadhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px}
.roadhead .l{font-size:9.5px;letter-spacing:1.1px;color:var(--faint);font-weight:600;text-transform:uppercase}
.roadhead .r{font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
.road{display:flex;gap:3px;height:4px}
.road i{display:block;border-radius:2px;background:rgba(242,238,230,.10)}
.road i.done{background:rgba(242,238,230,.55)}.road i.on{background:var(--cream)}
.roadlabels{display:flex;gap:3px;margin-top:4px}
.roadlabels span{font-size:7.5px;letter-spacing:.8px;color:var(--faint);font-weight:600;white-space:nowrap;overflow:hidden}
.roadlabels span.on{color:var(--cream)}
.navrow{display:flex;align-items:center;gap:9px;margin-top:10px}
.step{width:42px;height:42px;border-radius:13px;background:var(--inset);display:grid;place-items:center;font-size:15px;color:var(--muted);flex:none}
.rec{flex:1;height:42px;border-radius:13px;background:var(--cream);color:#0B0B0A;display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:700}
.rec .c{width:17px;height:17px;border-radius:50%;background:#0B0B0A;color:var(--cream);display:grid;place-items:center;font-size:9px}
/* overlays */
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.55);z-index:5}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:6;background:#121211;border-radius:26px 26px 0 0;border-top:1px solid rgba(255,255,255,.09);padding:8px 16px 16px;box-shadow:0 -24px 60px rgba(0,0,0,.6);max-height:82%;overflow:auto}
.sheet::-webkit-scrollbar{display:none}
.handle{width:34px;height:4px;border-radius:2px;background:rgba(255,255,255,.18);margin:0 auto 9px}
.stitle{font-family:Syne;font-weight:700;font-size:18px}
.sdesc{font-size:11px;color:var(--faint);margin-top:2px;margin-bottom:10px}
.srow{display:flex;align-items:center;gap:9px;padding:10px 2px;border-bottom:1px solid rgba(255,255,255,.055);font-size:12px}
.srow .k{width:22px;text-align:center;color:var(--faint);font-size:11px}
.srow .x{margin-left:auto;color:var(--faint);font-size:10.5px}
.srow.on{color:var(--cream)}.srow .x.on{color:var(--green)}
.chipline{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0 12px}
.chip{height:26px;padding:0 10px;border-radius:13px;border:1px solid rgba(242,238,230,.14);font-size:10.5px;font-weight:600;display:flex;align-items:center;color:var(--muted)}
.chip.on{background:var(--cream);color:#0B0B0A;border-color:var(--cream)}
/* mesa */
.table{flex:1;min-height:0;overflow:auto;padding:8px 13px 0}.table::-webkit-scrollbar{display:none}
.tghead{display:flex;align-items:baseline;gap:8px;padding:0 2px 5px;border-bottom:1px solid var(--hair);margin-top:8px}
.tghead .nm{font-size:11px;font-weight:600}.tghead .meta{margin-left:auto;font-size:9.5px;color:var(--faint)}
.tr{display:grid;grid-template-columns:24px 1fr 70px 40px 16px;align-items:center;gap:7px;padding:6px 3px;border-bottom:1px solid rgba(255,255,255,.05);font-size:10.5px}
.tr .idx{color:var(--faint);font-size:9.5px;font-variant-numeric:tabular-nums}
.tr .ex{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr .ld{font-family:Syne;font-weight:700;font-size:11.5px;text-align:right;font-variant-numeric:tabular-nums}
.tr .ef{font-size:9.5px;color:var(--faint);text-align:right}.tr .st{text-align:right;color:var(--faint);font-size:9.5px}
.tr.done .st{color:var(--green)}
.tr.active{background:rgba(242,238,230,.055);border-left:2px solid var(--cream);padding-left:5px}
.tr.active .ex{color:var(--cream);font-weight:600}
.editor{padding:8px 5px 10px;border-bottom:1px solid var(--hair);background:rgba(242,238,230,.03)}
.edrow{display:flex;align-items:center;gap:7px}
.edrow .big{font-family:Syne;font-weight:800;font-size:27px;letter-spacing:-.7px;font-variant-numeric:tabular-nums}
.edrow .u{font-size:10px;color:var(--faint);padding-top:5px}
.mini{display:flex;gap:4px;margin-left:auto}
.mini span{height:26px;min-width:40px;padding:0 7px;border-radius:7px;background:var(--inset);display:grid;place-items:center;font-size:10px;font-weight:600;color:var(--muted)}
.edrow2{display:flex;align-items:center;gap:5px;margin-top:8px}
.rir{display:flex;gap:3px}
.rir span{width:24px;height:22px;border-radius:6px;background:rgba(242,238,230,.08);display:grid;place-items:center;font-size:9.5px;color:var(--faint)}
.rir span.on{background:var(--cream);color:#0B0B0A;font-weight:700}
.edrow2 .e1{margin-left:auto;font-size:9.5px;color:var(--faint)}
.media{flex:1;min-height:0;display:flex;flex-direction:column;gap:9px}
.mstage{flex:1;min-height:0;border-radius:14px;background:linear-gradient(160deg,#1A1917,#101010);border:1px solid rgba(255,255,255,.07);display:grid;place-items:center;position:relative;overflow:hidden}
.mstage .ph{font-size:10px;color:var(--faint)}
.shutter{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);width:40px;height:40px;border-radius:50%;background:var(--cream);border:3px solid rgba(0,0,0,.35);box-shadow:0 0 0 3px rgba(242,238,230,.25)}
.thumbs{display:flex;gap:6px}
.thumbs i{flex:1;height:34px;border-radius:8px;background:#191917;border:1px solid rgba(255,255,255,.06);display:grid;place-items:center;font-size:9px;font-style:normal;color:var(--faint)}
.mode{display:flex;gap:5px}
.mode b{flex:1;height:28px;border-radius:9px;display:grid;place-items:center;font-size:10.5px;font-weight:600;color:var(--faint);background:var(--inset)}
.mode b.on{background:var(--cream);color:#0B0B0A}
.note{font-size:10.5px;color:var(--faint);line-height:15px}
</style>
</head>
<body>
<div class="wrap">
  <aside class="rail">
    <div class="brand"><div class="mark">K</div><div><b>KPKN Fit</b><small>Live · todas las instancias</small></div></div>
    <div id="index"></div>
  </aside>
  <main class="phone" id="phone"></main>
</div>
<script>
/* ───────── inventario real, agrupado por superficie ───────── */
const G=[
['Serie · modos',[['reps','Reps','Carga + rueda + esfuerzo + ROM'],['amrap','AMRAP','Mínimo, sin mínimo, calibrador'],['rm','RM','Cifra objetivo y focus'],['soloRpe','Solo RPE','Sin carga numérica'],['time','Tiempo','Reloj por serie'],['distance','Distancia','Cardio y metros'],['custom','Personalizado','Cantidad libre']]],
['Serie · estados',[['update','Completada','Re-registro y delta'],['failed','Fallida','Error de ejecución'],['pr','Récord','PR de la serie'],['loadReq','Carga requerida','Bloqueo de registro'],['replaced','Volumen reemplazado','Aviso de sustitución'],['uni','Unilateral','Izquierda / derecha'],['skipped','Saltada','Serie omitida']]],
['Serie · caras y hojas',[['technique','Avanzado','Técnica de la serie'],['media','Modo visual','Foto, vídeo, ficha, galería'],['history','Historial','Progreso del ejercicio'],['tags','Etiquetas','Tag, máquina, sub-tags'],['options','Opciones','Fuerza, cardio, superserie'],['amrapCfg','Config AMRAP','Mínimo y objetivo'],['discomfort','Molestias','Catálogo y buscador']]],
['Técnicas',[['drop','Drop-set','Tramos encadenados'],['pause','Rest-pause','Pausa y continuación'],['myo','Myo-reps','Activación y mini-series'],['chain','Cadena','Principal → tramo → +']]],
['Movilidad',[['mobMove','Movimiento','Reloj y dosis'],['mobList','Lista','Checklist de la fase'],['mobGlobal','Global','Objetivo de minutos'],['mobDone','Fin de fase','Omitida o completada'],['mobRest','Descanso','Pausa dentro de prep']]],
['Aproximación',[['warmList','Escalera','A1–A4 con kg editable'],['warmSkip','Omitida','Fase saltada'],['warmRest','Descanso','Entre aproximaciones'],['warmAdd','Añadir serie','Nueva fila a la escalera']]],
['Descanso',[['rest','Descanso','Anillo, sugerido, ±15'],['overrun','Tiempo extra','Se pasó el descanso'],['mini','Mini chip','Descanso minimizado'],['game','Juego','Descanso interactivo'],['feedback','Feedback','Cierre de ejercicio']]],
['Sesión · superficies',[['menu','Menú','Todas las acciones'],['route','Ruta','Bloques de la sesión'],['timer','Temporizador','Global de sesión'],['notes','Notas','Nota rápida'],['milestones','Hitos','Registro del día'],['photos','Fotos','Álbum de sesión'],['calories','Calorías','Cardio únicamente'],['reorder','Reordenar','Cambiar el orden']]],
['Experimental',[['mesa','Mesa','Registro vivo por filas'],['mesaMedia','Mesa · media','Con modo visual integrado']]]
];

/* ───────── piezas ───────── */
const head=(t,s)=>`<div class="status"><span>1:47</span><span>▮▮▮</span></div>
<div class="hdr"><div class="circ">‹</div><div class="txt"><div class="t">${t}</div><div class="s">${s}</div></div>
<div class="restchip"><span class="ring"></span>1:12</div><div class="circ">⋯</div></div>
`;

const bottom=(label,zone)=>`<div class="bottom">
<div class="roadhead"><span class="l">Series · 3 de 9</span><span class="r">Sentadilla 3 / 4</span></div>
<div class="road"><i class="done" style="width:15%"></i><i class="done" style="width:20%"></i><i class="${zone===2?'on':''}" style="width:53%"></i><i class="${zone===3?'on':''}" style="width:12%"></i></div>
<div class="roadlabels"><span style="width:15%">MOV</span><span style="width:20%">APR</span><span class="${zone===2?'on':''}" style="width:53%">SER</span><span class="${zone===3?'on':''}" style="width:12%">REST</span></div>
<div class="navrow"><div class="step">‹</div><div class="rec"><span class="c">✓</span>${label}</div><div class="step">›</div></div></div>`;

const links=a=>`<div class="foot"><div class="links">${a.map(x=>`<span>${x}</span>`).join('')}</div></div>`;
const hist=`<div class="hist"><div class="hlab">ÚLTIMAS 4 · e1RM<br><b>112,5 kg</b></div><div class="hbars"><i style="height:34%"></i><i style="height:52%"></i><i style="height:70%"></i><i class="on" style="height:94%"></i></div></div>`;
const wheel=(n)=>`<div class="wheel"><span>${n-2}</span><span>${n-1}</span><span class="c">${n}</span><span>${n+1}</span><span>${n+2}</span></div><div class="wlab"><span>REPS</span><span>OBJETIVO ${n}</span></div>`;
const fire=(i)=>`<div class="fire">${[0,1,2,3,4].map((x,k)=>`<div class="${k===i?'on':''}">${x}</div>`).join('')}</div><div class="wlab" style="margin-top:4px"><span>RIR</span><span>FALLO</span></div>`;
const kpills=`<div class="kpills"><div class="kpill">−2,5</div><div class="kpill">Sug <b>102,5</b></div><div class="kpill">+2,5</div></div>`;
const setCard=(cls,headHtml,heroHtml,bodyHtml,linksArr)=>`<div class="card ${cls}">${headHtml}${heroHtml}<div class="body">${bodyHtml}</div>${links(linksArr)}</div>`;
const hDet=(label,sub)=>'<div class="head"><span class="dot"></span><span class="eyebrow">'+label+'</span><span class="meta">'+(sub||"")+'</span></div>';
const hSet=(tag='')=>`<div class="head"><span class="dot"></span><span class="eyebrow">Serie efectiva</span>${tag}<span class="meta">3 / 4</span></div>`;
const heroKg=(kg,side,sub)=>`<div class="hero"><span class="v">${kg}</span><span class="u">kg</span><span class="side">${side}</span></div>${sub?`<div class="sub">${sub}</div>`:''}`;

<div class="tr done"><span class="idx">A1</span><span class="ex">60 %</span><span class="ld">80 × 5</span><span class="ef"></span><span class="st">✓</span></div>
<div class="tr"><span class="idx">1</span><span class="ex">Efectiva</span><span class="ld">140 × 5</span><span class="ef">RIR 2</span><span class="st">·</span></div>
<div class="tr"><span class="idx">2</span><span class="ex">Efectiva</span><span class="ld">140 × 5</span><span class="ef">—</span><span class="st">·</span></div>`}
function sheet(title,desc,rows,extra=''){return `<div class="scrim"></div><div class="sheet"><div class="handle"></div><div class="stitle">${title}</div><div class="sdesc">${desc}</div>
${rows.map(r=>`<div class="srow"><span class="k">${r[0]}</span><span>${r[1]}</span><span class="x ${r[2]==='hecho'||r[2]==='sí'?'on':''}">${r[2]}</span></div>`).join('')}${extra}</div>`}

/* ───────── render ───────── */
const TITLES={mobMove:['Movilidad','Pierna · 6 movimientos'],mobList:['Movilidad','Lista de la fase'],mobGlobal:['Movilidad','Objetivo global'],mobDone:['Movilidad','Fase completada'],mobRest:['Movilidad','Descanso'],warmList:['Aproximación','Sentadilla trasera · A2 de 4'],warmSkip:['Aproximación','Fase omitida'],warmRest:['Aproximación','Descanso'],warmAdd:['Aproximación','Añadir serie'],rest:['Descanso','Entre series'],overrun:['Descanso','Tiempo extra'],mini:['Descanso','Minimizado'],game:['Descanso','Juego'],feedback:['Feedback','Sentadilla trasera'],menu:['Sesión','Menú'],route:['Sesión','Ruta'],timer:['Sesión','Temporizador'],notes:['Sesión','Notas'],milestones:['Sesión','Hitos'],photos:['Sesión','Fotos'],calories:['Sesión','Calorías'],reorder:['Sesión','Reordenar'],mesa:['Pierna · Semana 1','9 ejercicios · 34 series'],mesaMedia:['Pierna · Semana 1','Mesa con modo visual']};
const ACT={reps:'Registrar serie',amrap:'Registrar AMRAP',rm:'Registrar RM',soloRpe:'Registrar serie',time:'Detener y registrar',distance:'Registrar distancia',custom:'Registrar serie',update:'Guardar cambio',failed:'Registrar fallida',pr:'Registrar PR',loadReq:'Registrar serie',replaced:'Registrar serie',uni:'Registrar izquierda',skipped:'Recuperar serie',technique:'Volver a la serie',media:'Volver a la serie',history:'Registrar serie',tags:'Aplicar etiqueta',options:'Aplicar',amrapCfg:'Guardar configuración',discomfort:'Guardar molestia',drop:'Registrar tramo',pause:'Registrar tramo',myo:'Registrar mini-serie',chain:'Volver a la serie',mobMove:'Hecho · siguiente',mobList:'Volver al movimiento',mobGlobal:'Terminar movilidad',mobDone:'Continuar',mobRest:'Saltar descanso',warmList:'Marcar A2',warmSkip:'Continuar con series',warmRest:'Saltar descanso',warmAdd:'Añadir A5',rest:'Saltar descanso',overrun:'Saltar',mini:'Abrir descanso',game:'Saltar',feedback:'Guardar feedback',menu:'Cerrar',route:'Ir al bloque',timer:'Cerrar',notes:'Guardar nota',milestones:'Cerrar',photos:'Cerrar',calories:'Cerrar',reorder:'Aplicar orden',mesa:'Registrar serie',mesaMedia:'Registrar serie'};
function render(id){
  const t=TITLES[id]||['Sentadilla trasera','Serie 3 de 4 · 100 kg'];
  const isSheet=['history','tags','options','amrapCfg','discomfort','warmAdd','menu','route','timer','notes','milestones','photos','calories','reorder'].includes(id);
  const isTable=id==='mesa'||id==='mesaMedia';
  let inner='';
  if(isTable){ inner=`<div class="zone" style="display:block;align-items:initial;padding:0">${S[id]()}</div>`; }
  else if(isSheet){ inner=`<div class="zone" style="align-items:center;justify-content:center"><div class="note" style="text-align:center">La hoja se abre sobre la tarjeta</div></div>`; }
  else { inner=`<div class="zone">${S[id]()}</div>`; }
  document.getElementById('phone').innerHTML=`<div class="screen">${head(...t)}${inner}${bottom(ACT[id]||'Registrar serie',2)}${isSheet?S[id]():''}</div>`;
}
function buildIndex(){
  const el=document.getElementById('index');
  el.innerHTML=G.map(([g,items])=>`<div class="g">${g}</div>`+items.map(([id,t,d])=>`<button class="it" data-id="${id}"><span>${t}</span><small>${d}</small></button>`).join('')).join('');
  el.addEventListener('click',e=>{const b=e.target.closest('.it');if(!b)return;select(b.dataset.id)});
}
function select(id){
  document.querySelectorAll('.it').forEach(b=>b.classList.toggle('on',b.dataset.id===id));
  render(id); location.hash=id;
}
buildIndex();
select(location.hash.replace('#','')||'reps');
</script>
