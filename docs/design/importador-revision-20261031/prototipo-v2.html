lign:left;width:100%;border-bottom:1px solid #ffffff0e}.row:last-child{border:0}.row .txt{flex:1;min-width:0}.row strong{display:block;font-size:14px}.row small{display:block;color:#a39e97;font-size:12px;line-height:1.35;margin-top:3px}.thumb{width:40px;height:40px;border-radius:12px;background:#202020;display:grid;place-items:center;color:#bfbab2;flex:none}.arrow{font-size:20px;color:#aaa}.pill{height:46px;padding:0 18px;background:#f2eee6;color:#0b0b0b;border-radius:25px;font-weight:bold}.outline{height:42px;padding:0 15px;border:1px solid #ffffff32;border-radius:25px;color:#eae5dc}.chip{display:inline-flex;align-items:center;justify-content:center;border:1px solid #ffffff18;background:#1c1c1c;border-radius:20px;min-height:32px;padding:0 12px;font-size:12px;margin:3px 3px 3px 0}.chip.on{background:#f2eee6;color:#111}.dock{position:absolute;bottom:12px;left:12px;right:12px;padding:7px;border-radius:32px;background:linear-gradient(140deg,#292929f2,#111f);border:1px solid #ffffff22;display:flex;align-items:center;gap:5px}.dock .pill{flex:1}.dock .small{font-size:12px;min-width:64px}.origin{border-left:2px solid #f7cf73;padding:8px 12px;margin:14px 0;color:#c4bfb6;font-size:12px;line-height:1.45}.field{display:block;width:100%;background:#1a1a1a;color:#f2eee6;border:1px solid #ffffff24;border-radius:14px;padding:13px;margin:8px 0 12px}.kicker{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:#c4bfb6;letter-spacing:1px;font-weight:bold;margin:18px 0 8px}.series{display:flex;gap:7px;overflow:auto;padding:4px 0 8px}.set{flex:none;text-align:left;width:78px;height:72px;border:1px solid #ffffff20;background:#1b1b1b;border-radius:16px;padding:10px}.set.selected{border-color:#f2eee6;background:#292929}.set small{display:block;color:#aaa;font-size:11px;margin-bottom:7px}.set b{font-size:15px}.focus{background:#1a1a1a;border-radius:18px;padding:14px;margin-top:10px}.focushead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.inputs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.inputs label{font-size:11px;color:#a7a198}.inputs input{display:block;width:100%;margin-top:5px;border:1px solid #ffffff1c;background:#292929;border-radius:12px;padding:10px 8px;color:#f2eee6;font-size:14px}.actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}.textbtn{font-size:12px;color:#e8e4db;padding:8px 0}.warn{background:#211d16;border:1px solid #f7cf7340}.label{font-size:11px;color:#aaa59d}.notes{padding-top:5px;line-height:1.55;font-size:14px;color:#c4bfb6}.notes h2{font:700 22px Syne;color:#f2eee6}.notes strong{color:#f2eee6}.notes li{margin:10px 0}.notes hr{border:0;border-top:1px solid #ffffff18;margin:24px 0}.badge{color:#f7cf73;font-size:11px;letter-spacing:1px}.hint{color:#a6a19a;font-size:12px;line-height:1.4}.home{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);width:108px;height:3px;background:#ffffff55;border-radius:4px}@media(max-width:900px){.wrap{grid-template-columns:150px minmax(300px,393px)}.notes{grid-column:2}}@media(max-width:620px){.wrap{display:flex;flex-direction:column;padding:12px}.nav{display:flex;overflow:auto;width:100%}.nav button{width:auto;white-space:nowrap}.phone{width:100%;max-width:393px;align-self:center}.notes{padding:0 12px}header{padding:20px 18px 0}}
</style></head><body><header><small>PROPUESTA REVISADA · 31 OCT 2026</small><h1>Importar un programa</h1><p>Revisión 2: catálogo y editor de sesiones compartidos. Navega con las pantallas de la izquierda o con los botones del teléfono.</p></header><div class="wrap"><nav class="nav" id="nav"></nav><div class="phone"><div class="status"><span>9:41</span><span>● ◒ ▰</span></div><div class="body" id="screen"></div><div class="dock" id="dock"></div><div class="home"></div></div><aside class="notes" id="notes"></aside></div><script>
const nav=document.getElementById('nav'),screen=document.getElementById('screen'),dock=document.getElementById('dock'),notes=document.getElementById('notes');let page=0,selected=0,mode='RIR',query='DB row',catalogChoice='Remo con mancuerna',sets=[{reps:'8',weight:'60',effort:'2'},{reps:'8',weight:'60',effort:'2'},{reps:'8',weight:'60',effort:'2'},{reps:'8',weight:'60',effort:'2'}];const titles=['Revisión','Editor de sesión','Catálogo','Sin coincidencia','Crear ejercicio'];function go(n){page=n;render();screen.scrollTop=0}function top(t,back=0){return `<div class="bar"><button class="round" aria-label="Atrás" onclick="go(${back})">‹</button><div class="bartitle">${t}</div><button class="round" aria-label="Más opciones">⋯</button></div>`}function row(name,meta,action,icon='↗'){return `<button class="row" onclick="${action}"><span class="thumb">${icon}</span><span class="txt"><strong>${name}</strong><small>${meta}</small></span><span class="arrow">›</span></button>`}function redraw(n){selected=n;render()}function edit(k,v){sets[selected][k]=v;document.querySelectorAll('.set')[selected].querySelector('b').textContent=sets[selected].reps+' reps'}function lookup(q){query=q;let box=document.getElementById('results');if(box)box.innerHTML=results()}function results(){let q=query.toLowerCase().trim();if(q.includes('zz')||q.includes('inexistente'))return `<div class="mod"><b>No encontramos coincidencias</b><p class="sub">Prueba otro nombre o busca por movimiento y material.</p><button class="outline" onclick="go(3)">No encuentro el ejercicio</button></div>`;return `<div class="kicker">RESULTADOS DEL CATÁLOGO <span>Variantes ›</span></div><div class="mod">${row('Remo con mancuerna','Espalda · Mancuerna · Unilateral','catalogChoice="Remo con mancuerna";go(1)')}${row('Remo con barra','Espalda · Barra','catalogChoice="Remo con barra";go(1)')}${row('Remo en máquina','Espalda · Máquina','catalogChoice="Remo en máquina";go(1)')}</div><button class="textbtn" onclick="go(3)">No encuentro el ejercicio ›</button>`}function render(){nav.innerHTML=titles.map((t,i)=>`<button class="${i===page?'on':''}" onclick="go(${i})">0${i+1} &nbsp; ${t}</button>`).join('');let html='', foot='', note='';if(page===0){html=top('Importar programa')+`<div class="ey">LECTURA COMPLETA</div><div class="title">Revisa tu programa</div><p class="sub">Revisa las sesiones y resuelve lo que no pudimos identificar.</p><div class="mod"><strong>Mi programa</strong><p class="sub">4 semanas · 3 sesiones por semana</p></div><div class="mod warn"><strong>1 ejercicio por identificar</strong><p class="sub">El documento dice «DB row».</p><button class="textbtn" onclick="query='DB row';go(2)">Buscar en el catálogo ›</button></div><div class="kicker">SEMANA 1 <span>⌄</span></div><div class="mod"><strong>Día 1 · Tren superior</strong><div class="line"></div>${row('Press de banca','4 × 8 · Barra','go(1)','▤')}${row(catalogChoice,'3 × 10 · Catálogo','go(1)','▤')}<button class="textbtn" onclick="go(1)">Abrir editor de sesión ›</button></div>`;foot=`<button class="pill" onclick="go(1)">Editar sesión</button><button class="small" onclick="query='';go(2)">+ Añadir</button>`;note=`<h2>Revisión del programa</h2><p>El programa se revisa antes de guardarse. Abrir una sesión lleva al <strong>mismo editor de sesiones</strong>, con su capacidad completa.</p><p>El nombre leído queda visible hasta elegir la configuración correcta del catálogo.</p>`}if(page===1){let x=sets[selected];html=top('‹　 Día 1 · Semana 1　 ›')+`<div class="ey">SESIÓN</div><div class="title">Tren superior</div><p class="sub">2 ejercicios · ${sets.length+3} series</p><div class="mod"><div class="row"><span class="thumb">▤</span><span class="txt"><strong>Press de banca · Barra</strong><small>${sets.length} × 8 · ${mode} ${x.effort} · 2:00</small></span><span>⌃</span></div><div class="origin">Documento: «Bench press · 4 × 8»<br><button class="textbtn" onclick="query='press';go(2)">Cambiar ejercicio en catálogo ›</button></div><button class="outline">+ Movilidad</button> <button class="outline">+ Aproximación</button><div class="kicker">SERIES EFECTIVAS <span>⋯</span></div><div><button class="chip">2:00 descanso</button><button class="chip">kg</button><button class="chip">Unilateral</button><button class="chip">Opciones</button></div><div class="series">${sets.map((v,i)=>`<button class="set ${selected===i?'selected':''}" onclick="redraw(${i})"><small>Serie ${i+1}</small><b>${v.reps} reps</b></button>`).join('')}<button class="set" onclick="sets.push({...sets[selected]});redraw(sets.length-1)"><b>＋</b><small>Añadir</small></button></div><div class="focus"><div class="focushead"><strong>Serie ${selected+1}</strong><span class="label">⋯</span></div><div class="inputs"><label>Reps<input aria-label="Repeticiones" value="${x.reps}" oninput="edit('reps',this.value)"></label><label>Carga · kg<input aria-label="Carga" value="${x.weight}" oninput="edit('weight',this.value)"></label><label>${mode}<input aria-label="Esfuerzo" value="${x.effort}" oninput="edit('effort',this.value)"></label></div><div class="actions">${['RIR','RPE','Fallo','% 1RM','AMRAP'].map(m=>`<button class="chip ${mode===m?'on':''}" onclick="mode='${m}';render()">${m}</button>`).join('')}</div><div class="actions"><button class="textbtn" onclick="sets=sets.map(()=>({...sets[selected]}));render()">Aplicar a todas</button><button class="textbtn" onclick="sets.splice(selected+1,0,{...sets[selected]});redraw(selected+1)">Duplicar</button><button class="textbtn" onclick="if(sets.length>1){sets.splice(selected,1);redraw(Math.max(0,selected-1))}">Eliminar</button></div></div></div><div class="mod">${row(catalogChoice,'3 × 10 · Catálogo','query="DB row";go(2)','▤')}</div>`;foot=`<button class="pill" onclick="query='';go(2)">＋ Añadir</button><button class="small">Asistente</button><button class="small">Reglas</button>`;note=`<h2>El editor de sesiones</h2><p>Esta pantalla representa la tarjeta desplegada del editor vigente: preparación, opciones y fichas individuales de serie. Toca una ficha, modifica sus valores o añade otra.</p><p><strong>Al implementar se reutiliza el editor completo</strong>, incluidos sus modos y herramientas. Los botones de este prototipo son una muestra, no una implementación nativa.</p><p>Referencia: <code>ExerciseEditorExpanded</code> y <code>ExerciseSetList</code>.</p>`}if(page===2){html=top('Catálogo de ejercicios',1)+`<div class="title">Elegir ejercicio</div><p class="sub">Para «DB row» del documento</p><input class="field" aria-label="Buscar en el catálogo" placeholder="Buscar ejercicio…" value="${query}" oninput="lookup(this.value)"><div><button class="chip on">Todos</button><button class="chip">Músculo</button><button class="chip">Material</button><button class="chip">Mis ejercicios</button></div><p class="hint">El nombre original puede tener otras formas de escritura. Revisa movimiento, material y variante.</p><div id="results">${results()}</div>`;foot=`<button class="pill" onclick="go(1)">Volver al editor</button>`;note=`<h2>El catálogo de KPKN</h2><p>El mismo selector para añadir y reemplazar, con sus filtros, fichas y variantes. «DB row» puede sugerir «Remo con mancuerna».</p><p>Prueba escribir <strong>inexistente</strong> para ver la ruta sin resultados. Los resultados son simulados.</p>`}if(page===3){html=top('Catálogo',2)+`<div class="title">¿No está en el catálogo?</div><p class="sub">Prueba otros nombres o revisa las variantes antes de crear uno nuevo.</p><div class="mod">${row('Buscar de nuevo','Nombre, movimiento o material','go(2)','⌕')}${row('Crear ejercicio','Se abrirá el creador habitual de KPKN','go(4)','＋')}</div><div class="origin">Nombre del documento: «DB row»</div>`;foot=`<button class="pill" onclick="go(4)">Crear ejercicio</button>`;note=`<h2>Una sola biblioteca</h2><p>Solo se ofrece crear después de buscar. No se guarda el nombre importado como un ejercicio aislado.</p>`}if(page===4){html=top('Crear ejercicio',3)+`<div class="title">Crear ejercicio</div><p class="sub">Creador habitual del catálogo · nombre del documento precargado</p><label class="label">Nombre del ejercicio<input class="field" value="DB row"></label><div class="mod"><strong>Ya existe algo parecido</strong>${row('Remo con mancuerna','Espalda · Mancuerna · Unilateral','catalogChoice="Remo con mancuerna";go(1)')}</div><div class="mod"><strong>Ficha del ejercicio</strong><p class="sub">Imagen · descripción · material · estación · lateralidad · patrón y músculos</p></div><div class="origin">Revisa la ficha antes de crear el ejercicio.</div>`;foot=`<button class="pill" onclick="go(1)">Crear ejercicio · ejemplo</button>`;note=`<h2>Creador habitual</h2><p>El ejercicio creado se incorpora al catálogo personal y queda disponible para otras sesiones. La detección de similares ayuda a evitar duplicados.</p><p>Esta escena es ilustrativa: no crea ni guarda ejercicios reales.</p>`}screen.innerHTML=html;dock.innerHTML=foot;notes.innerHTML=`<span class="badge">QUÉ ESTÁS VIENDO</span>${note}<hr><p class="hint">Prototipo web con datos sintéticos. La implementación, la paridad visual final y el acceso al catálogo real requieren desarrollo y validación en Android.</p>`}render();
</script></body></html>
