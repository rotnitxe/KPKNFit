<style>/* Laboratorio oscuro a propósito: la app es negro puro (KPKN_UI_V2 §1). Un solo tema. */
:root{--ink:#f2eee6;--muted:#c4bfb6;--faint:#8e8980;--dim:#5f5c57;--canvas:#000;--module:#111;--pressed:#161616;--inset:#1a1a1a;--line:#ffffff12;--div:#ffffff0f;
--mus:#f49a6e;--ene:#f7cf73;--col:#8fb2ff;--done:#43d18c;--danger:#ff9b92;--lab:#151615;--fs:1;
--ph-acc:var(--mus);--ph-int:var(--ene);--ph-rea:var(--col);--ph-del:#7fcfa4;--ph-com:#ff9b92;
color-scheme:dark;font-family:Inter,Arial,sans-serif;color:var(--ink);background:var(--lab);font-synthesis:none}
*{box-sizing:border-box}body{margin:0;background:var(--lab);color:var(--ink)}
button,input,select{font:inherit;color:inherit}button{border:0;background:transparent;cursor:pointer;-webkit-tap-highlight-color:transparent;padding:0}
button:focus-visible,select:focus-visible{outline:2px solid var(--mus);outline-offset:3px}
button:active:not(:disabled){transform:scale(.975)}
svg{display:block;flex-shrink:0}
.tn{font-variant-numeric:tabular-nums}
/* ---------- laboratorio ---------- */
#lab{max-width:1400px;margin:auto;padding-block:0 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.lab-head{height:76px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff17;gap:20px}
.wordmark{font:800 26px Syne;letter-spacing:-1.4px}.wordmark span{font:400 11px Inter;letter-spacing:2px;margin-left:8px}
.edition{font-size:10px;letter-spacing:1.6px;font-weight:600;color:var(--faint);text-align:right}
.lab-intro{padding:26px 0 20px}
.lab-intro h1{font:700 32px/1.06 Syne;letter-spacing:-1px;margin:8px 0;text-wrap:balance}.lab-intro p{margin:0;color:var(--muted);font-size:14px;max-width:680px;line-height:1.5}
.eyebrow{font-size:10px;letter-spacing:1.6px;font-weight:600;color:var(--faint);text-transform:uppercase}
.lab-controls{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:0 0 24px}
.tabs{display:flex;gap:3px;background:#0b0b0b;border:1px solid #ffffff10;border-radius:22px;padding:4px;flex-wrap:wrap}
.tabs button{height:36px;padding:0 14px;border-radius:18px;color:var(--muted);font-size:13px;font-weight:600}.tabs button[aria-selected=true]{background:#262626;color:var(--ink)}
.selectors{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.selectors label{display:flex;gap:8px;align-items:center;font-size:11px;color:var(--faint)}
.selectors select{background:#0b0b0b;border:1px solid #ffffff18;color:var(--ink);border-radius:12px;height:36px;padding:0 10px;font:13px Inter;max-width:320px}
.stage{display:grid;grid-template-columns:auto minmax(280px,1fr);gap:44px;align-items:start}
.notes{padding-top:6px;max-width:560px;min-width:0}.notes h2{font:700 24px/1.12 Syne;margin:6px 0 12px;letter-spacing:-.6px;text-wrap:balance}
.notes p{color:var(--muted);font-size:13.5px;line-height:1.55;margin:0 0 12px}.notes ul{margin:0 0 16px;padding-left:18px;color:var(--muted);font-size:13px;line-height:1.5}.notes li{margin-bottom:6px}
.notes b{color:var(--ink);font-weight:600}
.notes h3{font-size:10px;letter-spacing:1.5px;color:var(--faint);font-weight:600;margin:20px 0 8px;text-transform:uppercase}
.tag{display:inline-block;font-size:10px;letter-spacing:1.2px;font-weight:600;padding:5px 9px;border-radius:9px;background:#ffffff0b;color:var(--muted);margin:0 6px 6px 0}
.tag.new{background:#f49a6e1f;color:var(--mus)}.tag.out{background:#ff9b921a;color:var(--danger)}.tag.move{background:#8fb2ff1a;color:var(--col)}.tag.keep{background:#43d18c17;color:var(--done)}.tag.ask{background:#f7cf731a;color:var(--ene)}
.scene-nav{display:flex;gap:8px;margin:18px 0 0;flex-wrap:wrap}.scene-nav button{height:36px;padding:0 14px;border-radius:12px;background:#0b0b0b;border:1px solid #ffffff14;font-size:12px;color:var(--muted)}
@media(max-width:920px){.stage{grid-template-columns:1fr}.phone-wrap{zoom:min(1,calc((100vw - 32px)/var(--pwn)))}}
/* ---------- documento de decisiones ---------- */
.doc{grid-column:1/-1;max-width:980px;min-width:0}
.doc h2{font:700 26px/1.1 Syne;letter-spacing:-.6px;margin:34px 0 10px;text-wrap:balance}.doc h2:first-child{margin-top:0}
.doc p{color:var(--muted);font-size:14px;line-height:1.6;margin:0 0 12px;max-width:72ch}.doc b{color:var(--ink)}
.dtable-wrap{overflow-x:auto;margin:12px 0 8px;border:1px solid #ffffff12;border-radius:16px}
.dtable{border-collapse:collapse;width:100%;min-width:720px;font-size:13px}
.dtable th{text-align:left;font-size:10px;letter-spacing:1.3px;color:var(--faint);font-weight:600;padding:12px 14px;border-bottom:1px solid #ffffff12;text-transform:uppercase;background:#0d0d0d}
.dtable td{padding:11px 14px;border-bottom:1px solid #ffffff0b;vertical-align:top;color:var(--muted);line-height:1.45}
.dtable td:first-child{color:var(--ink);font-weight:600;width:26%}.dtable tr:last-child td{border-bottom:0}
.advice{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:14px 0}
.advice>div{background:#0d0d0d;border:1px solid #ffffff12;border-radius:18px;padding:18px 20px;min-width:0}
.advice h3{font:700 17px/1.2 Syne;margin:0 0 8px}.advice p{font-size:13.5px}
.verdict{font:600 13px Inter;color:var(--ene);margin-bottom:6px;letter-spacing:.3px}
@media(max-width:760px){.advice{grid-template-columns:1fr}}
/* ---------- teléfono ---------- */
.phone-wrap{width:var(--pw);height:var(--ph)}
.phone{width:var(--pw);height:var(--ph);background:#000;border:1px solid #ffffff1b;border-radius:38px;overflow:hidden;position:relative;font-size:calc(14px*var(--fs));isolation:isolate;box-shadow:0 24px 80px #0006}
.statusbar{position:absolute;top:0;left:0;right:0;height:30px;display:flex;justify-content:space-between;align-items:center;padding:8px 26px 0;font-size:12px;font-weight:600;z-index:50;pointer-events:none}
.statusbar i{display:inline-block;width:17px;height:9px;border-radius:2px;border:1px solid #fff9;margin-left:4px}
.veil{position:absolute;top:0;left:0;right:0;height:56px;background:linear-gradient(#000,#0000);z-index:39;pointer-events:none}
.homebar{position:absolute;bottom:7px;left:50%;width:112px;height:4px;border-radius:2px;background:#ffffff45;transform:translateX(-50%);z-index:80}
.scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:44px 16px 120px;scrollbar-width:none}.scroll::-webkit-scrollbar{display:none}
.glass{background:linear-gradient(140deg,#2c2c2cb8,#161616b0);backdrop-filter:blur(26px) saturate(1.3);-webkit-backdrop-filter:blur(26px) saturate(1.3);border:1px solid #ffffff22;box-shadow:0 10px 30px #0009,inset 0 1px #ffffff12}
.island{position:absolute;top:38px;left:12px;right:12px;height:56px;border-radius:32px;z-index:45;display:flex;align-items:center;gap:6px;padding:0 6px}
.island .t{flex:1;min-width:0}.island .t strong{display:block;font-size:calc(14px*var(--fs));font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.island .t span{display:block;font-size:calc(11px*var(--fs));color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.pinned{position:absolute;top:100px;left:12px;right:12px;border-radius:28px;z-index:44;padding:6px}
.ib{width:44px;height:44px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);flex-shrink:0}
.ib.fill{background:var(--inset)}
.toprow{display:flex;justify-content:space-between;align-items:center;margin:0 -4px 10px}
/* módulos */
.mod{background:var(--module);border:1px solid #ffffff12;border-radius:24px;padding:16px 18px 18px;margin-bottom:12px}
.mod.tight{padding:12px 14px}
.mod-h{display:flex;justify-content:space-between;align-items:center;min-height:28px;gap:10px}
.ey{font-size:calc(11px*var(--fs));letter-spacing:1.2px;font-weight:600;color:var(--muted);text-transform:uppercase}
.act{font-size:calc(13px*var(--fs));font-weight:600;color:var(--ink);display:inline-flex;align-items:center;gap:4px;min-height:36px}
.act.faint{color:var(--muted)}
.cap{font-size:calc(12px*var(--fs));color:var(--faint);line-height:1.35}
.body{font-size:calc(14px*var(--fs));color:var(--muted);line-height:1.45}
.group-l{font-size:calc(11px*var(--fs));letter-spacing:1.3px;font-weight:600;color:var(--faint);margin:22px 4px 10px;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center}
.div{height:1px;background:var(--div);margin:12px 0}
.pill{height:52px;border-radius:26px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:calc(15px*var(--fs));padding:0 20px}
.pill.pri{background:var(--ink);color:#0c0c0c}.pill.sec{border:1px solid #f2eee63d;color:var(--ink)}
.pill.sm{height:40px;font-size:calc(13px*var(--fs));padding:0 16px}
.chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:15px;background:var(--inset);font-size:calc(12px*var(--fs));color:var(--muted);font-weight:500;white-space:nowrap}
.chip.on{background:var(--ink);color:#111}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex-shrink:0}
.seg{display:flex;background:#0d0d0d;border:1px solid #ffffff10;border-radius:24px;padding:4px;gap:2px}
.seg button{flex:1;height:40px;border-radius:20px;font-size:calc(13px*var(--fs));font-weight:600;color:var(--faint)}
.seg button.on{background:#272727;color:var(--ink)}
.syne{font-family:Syne}
.num{font:800 calc(28px*var(--fs))/1 Syne;letter-spacing:-.6px;font-variant-numeric:tabular-nums}
.num small{font:600 calc(12px*var(--fs)) Inter;color:var(--muted);margin-left:3px;letter-spacing:0}
.up{color:var(--done)}.down{color:var(--danger)}.flat{color:var(--ene)}
/* portada */
.hero{display:flex;gap:14px;align-items:flex-start}
.cover{width:84px;height:104px;border-radius:18px;flex-shrink:0;background:#efe9df;position:relative;overflow:hidden}
.cover.big{width:100%;height:150px;border-radius:24px}
.hero-t{flex:1;min-width:0}
.status{display:flex;align-items:center;gap:7px;font-size:calc(11px*var(--fs));letter-spacing:1.3px;font-weight:600;color:var(--muted)}
.pname{font:800 calc(28px*var(--fs))/1.02 Syne;letter-spacing:-.8px;margin:6px 0 6px;text-wrap:balance}
.meta{font-size:calc(13px*var(--fs));color:var(--muted)}
.ribbon{display:flex;gap:3px;margin-top:16px;align-items:flex-end}
.ribbon i{flex:1;height:6px;border-radius:3px;opacity:.28;display:block}
.ribbon i.done{opacity:.85}.ribbon i.now{height:10px;opacity:1;box-shadow:0 0 0 2px #000,0 0 0 3px #f2eee6aa}
.ribbon-l{display:flex;justify-content:space-between;margin-top:8px;font-size:calc(12px*var(--fs));color:var(--muted)}
.hero-acts{display:flex;gap:8px;margin-top:16px;align-items:center}.hero-acts .pill{flex:1}
/* pendiente */
.pend{border-radius:24px;padding:14px 16px;margin-bottom:12px;background:color-mix(in srgb,var(--acc,var(--ene)) 8%,#111);border:1px solid color-mix(in srgb,var(--acc,var(--ene)) 26%,transparent)}
.pend-row{display:flex;gap:12px;align-items:center;min-height:48px}
.pend-ico{width:36px;height:36px;border-radius:50%;background:#ffffff0c;display:flex;align-items:center;justify-content:center;color:var(--acc,var(--ene));flex-shrink:0}
.pend-row .tx{flex:1;min-width:0}.pend-row strong{display:block;font-size:calc(14px*var(--fs));font-weight:600}.pend-row span{display:block;font-size:calc(12px*var(--fs));color:var(--muted);margin-top:2px;line-height:1.35}
.pend .more{font-size:calc(12px*var(--fs));color:var(--muted);padding-top:8px;border-top:1px solid #ffffff10;margin-top:8px;display:flex;justify-content:space-between}
/* semana */
.wk-nav{display:flex;align-items:center;gap:6px}
.wk-nav .t{flex:1;text-align:center;min-width:0}.wk-nav .t strong{display:block;font:700 calc(20px*var(--fs))/1.1 Syne;letter-spacing:-.4px}
.wk-nav .t span{display:inline-flex;align-items:center;gap:6px;font-size:calc(12px*var(--fs));color:var(--muted);margin-top:4px}
.mini-rib{display:flex;gap:2px;margin:12px 2px 0}
.mini-rib i{flex:1;height:4px;border-radius:2px;opacity:.25;display:block}.mini-rib i.done{opacity:.7}.mini-rib i.sel{opacity:1;height:4px;outline:2px solid var(--ink);outline-offset:1px}
.wk-stats{display:flex;gap:0;margin-top:14px;border-top:1px solid var(--div);padding-top:12px}
.wk-stats div{flex:1;text-align:center}.wk-stats b{display:block;font:700 calc(17px*var(--fs)) Syne;font-variant-numeric:tabular-nums}.wk-stats span{font-size:calc(11px*var(--fs));color:var(--faint)}
.agenda{position:relative;margin-top:6px}
.day{display:grid;grid-template-columns:46px 1fr;gap:10px;padding:6px 0;position:relative}
.dcol{display:flex;flex-direction:column;align-items:center;padding-top:10px}
.dcol small{font-size:calc(10.5px*var(--fs));letter-spacing:1.1px;font-weight:600;color:var(--faint)}
.dcol b{font:700 calc(20px*var(--fs))/1.1 Syne;font-variant-numeric:tabular-nums;margin-top:2px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:50%}
.day.today .dcol small{color:var(--mus)}.day.today .dcol b{background:var(--mus);color:#111}
.day.past .dcol b,.day.past .dcol small{color:var(--dim)}
.dsess{display:flex;flex-direction:column;gap:6px;min-width:0}
.sess{background:var(--module);border:1px solid #ffffff12;border-radius:20px;padding:12px 14px;display:flex;gap:12px;align-items:center;min-height:64px;position:relative}
.sess .tx{flex:1;min-width:0}
.sess strong{display:block;font:700 calc(15.5px*var(--fs))/1.2 Syne;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sess .ln{font-size:calc(12px*var(--fs));color:var(--faint);margin-top:3px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.sess .idx{font:600 calc(10px*var(--fs)) Inter;letter-spacing:1px;color:var(--faint);margin-right:2px}
.sess.done{opacity:.62}.sess.done strong{color:var(--muted)}
.sess.optn{border-style:dashed;border-color:#ffffff2a;background:#0b0b0b}
.sess.now{border-color:#f49a6e66;background:linear-gradient(160deg,#f49a6e14,#111 60%)}
.sess.open{flex-direction:column;align-items:stretch;padding:14px 16px 16px}
.mark{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.mark.ok{background:#43d18c22;color:var(--done)}
.play{width:40px;height:40px;border-radius:50%;background:var(--ink);color:#111;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.focus{display:flex;gap:3px}.focus i{width:6px;height:6px;border-radius:50%;display:block}
.rest{display:flex;align-items:center;min-height:40px;font-size:calc(13px*var(--fs));color:var(--dim);gap:10px}
.rest:after{content:"";flex:1;height:1px;background:#ffffff0d}
.day.restd{padding:0}.day.restd .dcol{padding-top:4px}.day.restd .dcol b{font-size:calc(15px*var(--fs));height:28px;color:var(--dim)}.day.restd .dcol small{color:var(--dim)}
.dayhead{display:flex;justify-content:space-between;font-size:calc(11px*var(--fs));color:var(--faint);padding:4px 4px 0;letter-spacing:.3px}
.ex{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 0;border-top:1px solid var(--div);align-items:center}
.ex:first-child{border-top:0}
.ex strong{font-size:calc(14px*var(--fs));font-weight:600;font-family:Inter;letter-spacing:0;white-space:normal}
.ex span{font-size:calc(12px*var(--fs));color:var(--faint);grid-column:1}.ex .sw{grid-row:1/3;grid-column:2;color:var(--faint)}
.sess-acts{display:flex;gap:8px;margin-top:12px}.sess-acts .pill{flex:1}
.drop{height:3px;border-radius:2px;background:var(--mus);margin:2px 0}
.dragcard{transform:rotate(-2deg) scale(1.03);box-shadow:0 18px 40px #000c;border-color:#f2eee640;z-index:5}
.ghost{opacity:.25}
/* progreso */
.headline{font:700 calc(19px*var(--fs))/1.25 Syne;letter-spacing:-.3px;margin:4px 0 4px;text-wrap:pretty}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.kpi{background:var(--inset);border-radius:16px;padding:10px 12px;min-width:0}.kpi small{display:block;font-size:calc(10px*var(--fs));letter-spacing:1px;color:var(--faint);font-weight:600;text-transform:uppercase}
.kpi b{display:block;font:800 calc(20px*var(--fs))/1.1 Syne;margin-top:6px;font-variant-numeric:tabular-nums;letter-spacing:-.4px}.kpi span{font-size:calc(11px*var(--fs));color:var(--faint)}
.lift{display:grid;grid-template-columns:1fr 74px auto;gap:10px;align-items:center;padding:11px 0;border-top:1px solid var(--div)}
.lift:first-of-type{border-top:0}
.lift strong{display:block;font-size:calc(14px*var(--fs));font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.lift span{font-size:calc(12px*var(--fs));color:var(--faint)}
.lift .val{text-align:right}.lift .val b{display:block;font:700 calc(16px*var(--fs)) Syne;font-variant-numeric:tabular-nums}.lift .val em{font-style:normal;font-size:calc(11px*var(--fs));font-weight:600}
.st{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:11px;font-size:calc(10.5px*var(--fs));font-weight:600;letter-spacing:.3px;margin-top:4px}
.st.up{background:#43d18c1a}.st.flat{background:#f7cf731a}.st.down{background:#ff9b921a}.st.new{background:#ffffff0d;color:var(--muted)}
.bars{display:flex;align-items:flex-end;gap:6px;height:110px;margin-top:14px;position:relative}
.bars .b{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;position:relative}
.bars .plan{position:absolute;bottom:0;left:0;right:0;border-radius:6px;border:1px dashed #ffffff30}
.bars .real{width:100%;border-radius:6px;position:relative;z-index:1}
.bars-l{display:flex;gap:6px;margin-top:6px}.bars-l span{flex:1;text-align:center;font-size:calc(10px*var(--fs));color:var(--faint)}.bars-l span.on{color:var(--ink);font-weight:600}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:calc(11px*var(--fs));color:var(--faint)}.legend span{display:inline-flex;align-items:center;gap:6px}
.vrow{padding:10px 0;border-top:1px solid var(--div)}.vrow:first-of-type{border-top:0}
.vrow-h{display:flex;justify-content:space-between;align-items:baseline;font-size:calc(14px*var(--fs))}.vrow-h strong{font-weight:600}.vrow-h b{font:700 calc(15px*var(--fs)) Syne;font-variant-numeric:tabular-nums}
.vbar{position:relative;height:10px;border-radius:5px;background:#ffffff08;margin-top:8px;overflow:visible}
.vbar .z{position:absolute;top:-2px;bottom:-2px;background:#43d18c26;box-shadow:inset 0 0 0 1px #43d18c55;border-radius:6px}
.vbar .f{position:absolute;top:0;bottom:0;left:0;border-radius:5px}
.vbar .tk{position:absolute;top:-4px;width:2px;height:18px;border-radius:1px;background:var(--ink);opacity:.55}
.vrow .cap{margin-top:5px}
.adh{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;margin-top:12px}
.adh div{display:flex;flex-direction:column;gap:3px}.adh i{display:block;height:9px;border-radius:3px;background:#ffffff10}.adh i.ok{background:var(--done)}.adh i.miss{background:#ff9b9255}.adh i.fut{background:#ffffff08;outline:1px dashed #ffffff18;outline-offset:-1px}
.adh span{font-size:calc(9px*var(--fs));color:var(--faint);text-align:center;margin-top:2px}
.tl{position:relative;padding-left:18px}.tl:before{content:"";position:absolute;left:4px;top:6px;bottom:6px;width:1px;background:#ffffff18}
.tl div{position:relative;padding:6px 0 10px}.tl div:before{content:"";position:absolute;left:-18px;top:11px;width:9px;height:9px;border-radius:50%;background:#111;border:2px solid var(--muted)}
.tl strong{display:block;font-size:calc(13.5px*var(--fs));font-weight:600}.tl span{font-size:calc(12px*var(--fs));color:var(--faint);line-height:1.4;display:block;margin-top:2px}
/* hojas */
.scrim{position:absolute;inset:0;background:#000a;z-index:60}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:61;border-radius:28px 28px 0 0;padding:10px 18px 30px;max-height:88%;overflow-y:auto;scrollbar-width:none;background:linear-gradient(170deg,#262626e8,#121212f2);backdrop-filter:blur(40px);-webkit-backdrop-filter:blur(40px);border-top:1px solid #ffffff1d}
.sheet::-webkit-scrollbar{display:none}
.grab{width:36px;height:4px;border-radius:2px;background:#ffffff3a;margin:0 auto 14px}
.sheet h3{font:700 calc(21px*var(--fs))/1.15 Syne;letter-spacing:-.4px;margin:2px 0 4px;text-wrap:balance}
.sheet .sub{font-size:calc(13px*var(--fs));color:var(--muted);margin-bottom:12px;line-height:1.45}
.mi{display:flex;align-items:center;gap:14px;min-height:54px;padding:4px 2px;border-top:1px solid var(--div);width:100%;text-align:left}
.mi:first-of-type{border-top:0}
.mi .mic{width:38px;height:38px;border-radius:50%;background:#ffffff0c;display:flex;align-items:center;justify-content:center;color:var(--muted);flex-shrink:0}
.mi .tx{flex:1;min-width:0}.mi strong{display:block;font-size:calc(14.5px*var(--fs));font-weight:600}.mi span{display:block;font-size:calc(12px*var(--fs));color:var(--faint);margin-top:2px;line-height:1.35}
.mi.danger strong,.mi.danger .mic{color:var(--danger)}
.mgroup{font-size:calc(10.5px*var(--fs));letter-spacing:1.3px;color:var(--faint);font-weight:600;margin:16px 2px 4px;text-transform:uppercase}
.field{background:#0000003a;border:1px solid #ffffff1a;border-radius:16px;padding:10px 14px;margin-top:8px}.field small{display:block;font-size:calc(11px*var(--fs));color:var(--faint)}.field div{font-size:calc(15px*var(--fs));margin-top:3px}
.menu{position:absolute;z-index:61;width:236px;border-radius:22px;padding:6px}
.menu button{display:flex;align-items:center;gap:12px;width:100%;min-height:46px;padding:0 12px;border-radius:14px;font-size:calc(14px*var(--fs));text-align:left}
.menu button:hover{background:#ffffff0a}.menu hr{border:0;height:1px;background:#ffffff14;margin:4px 8px}.menu .danger{color:var(--danger)}
/* programas */
.ptitle{font:800 calc(28px*var(--fs))/1.05 Syne;letter-spacing:-.8px;margin:6px 0 2px}
.pcard{display:flex;gap:14px;align-items:center;padding:12px;border-radius:24px;background:var(--module);border:1px solid #ffffff12;margin-bottom:10px;min-height:96px}
.pcard .cover{width:64px;height:80px;border-radius:14px}
.pcard .tx{flex:1;min-width:0}.pcard strong{display:block;font:700 calc(17px*var(--fs))/1.15 Syne;letter-spacing:-.3px}.pcard span{display:block;font-size:calc(12px*var(--fs));color:var(--faint);margin-top:4px}
.active-card{border-radius:28px;overflow:hidden;background:var(--module);border:1px solid #ffffff14;margin-bottom:12px}
.active-card .art{height:132px;position:relative}
.active-card .in{padding:14px 16px 16px}
.fab{position:absolute;right:16px;bottom:96px;z-index:46;height:56px;border-radius:28px;padding:0 20px 0 16px;display:flex;align-items:center;gap:8px;font-weight:600;font-size:calc(14px*var(--fs))}
.navbar{position:absolute;left:12px;right:12px;bottom:14px;height:64px;border-radius:32px;z-index:46;display:flex;justify-content:space-around;align-items:center}
.navbar div{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:calc(10.5px*var(--fs));color:var(--faint);width:70px}.navbar div.on{color:var(--ink)}
.navbar div.on:after{content:"";width:4px;height:4px;border-radius:2px;background:var(--mus)}
.opt-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.opt{background:#ffffff08;border:1px solid #ffffff12;border-radius:20px;padding:14px;min-height:112px;display:flex;flex-direction:column;gap:6px;text-align:left}
.opt .ic{width:36px;height:36px;border-radius:50%;background:#ffffff10;display:flex;align-items:center;justify-content:center;color:var(--ink)}
.opt strong{font-size:calc(14px*var(--fs));font-weight:600}.opt span{font-size:calc(11.5px*var(--fs));color:var(--faint);line-height:1.35}
.opt.wide{grid-column:1/-1;flex-direction:row;align-items:center;min-height:72px}.opt.wide .tx{flex:1}
/* estructura */
.blk{border-radius:22px;background:var(--module);border:1px solid #ffffff12;padding:14px 16px;margin-bottom:10px;position:relative;overflow:hidden}
.blk:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c)}
.blk-h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}.blk-h strong{display:block;font:700 calc(16px*var(--fs)) Syne}.blk-h span{font-size:calc(12px*var(--fs));color:var(--faint)}
.wkrow{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.wkc{width:40px;height:40px;border-radius:50%;background:var(--inset);display:flex;align-items:center;justify-content:center;font:700 calc(13px*var(--fs)) Syne;color:var(--muted);position:relative}
.wkc.done:after{content:"";position:absolute;bottom:-5px;width:5px;height:5px;border-radius:50%;background:var(--done)}
.wkc.now{box-shadow:0 0 0 2px var(--ink);color:var(--ink)}.wkc.add{border:1px dashed #ffffff30;background:none}
.tline{display:flex;height:34px;border-radius:12px;overflow:hidden;gap:2px;margin-top:12px}
.tline div{display:flex;align-items:center;justify-content:center;font-size:calc(10.5px*var(--fs));font-weight:600;color:#111;letter-spacing:.3px;white-space:nowrap;overflow:hidden}
.diag{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--div)}.diag:first-of-type{border-top:0}
.diag i{width:8px;height:8px;border-radius:50%;margin-top:6px;flex-shrink:0}.diag strong{display:block;font-size:calc(13.5px*var(--fs));font-weight:600}.diag span{font-size:calc(12px*var(--fs));color:var(--faint);line-height:1.4}
.ratio{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:9px 0;border-top:1px solid var(--div);font-size:calc(13px*var(--fs))}

<script>// Portadas generativas KPKN v2: familia de LÍNEAS finas sobre fondos oscuros (línea de «Relieve»).
// Regla: monocromas; el color solo entra difuminado (halo o bruma) o en una única línea de acento.
// SVG 4:5 que recorta (slice) a cualquier proporción sin deformarse.
const CPAL={
  carbon:{bg:'#161616',bg2:'#060606',ln:'#e9e3d8',a:'#f49a6e',n:'Carbón'},
  grafito:{bg:'#1d2024',bg2:'#0b0c0e',ln:'#a3acb6',a:'#f2eee6',n:'Grafito'},
  noche:{bg:'#101830',bg2:'#04070e',ln:'#93a9da',a:'#f7cf73',n:'Noche'},
  musgo:{bg:'#131c17',bg2:'#050907',ln:'#a4bcaa',a:'#f49a6e',n:'Musgo'},
  crema:{bg:'#ece6db',bg2:'#dcd3c4',ln:'#1d1b19',a:'#d9673a',n:'Crema'},
};
const CSTYLES={relieve:'Relieve',perfil:'Perfil',ondas:'Ondas',orbitas:'Órbitas',campo:'Campo',espiral:'Espiral',eco:'Eco',bruma:'Bruma'};
let _cid=0;
function rng(seed){let s=Math.floor(seed)%2147483647||7;return()=>(s=s*16807%2147483647)/2147483647}
const P2=(pts)=>pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join('');
function coverSvg(style='relieve',pal='carbon',o={}){
  const p=CPAL[pal]||CPAL.carbon,id=++_cid,seed=(o.seed||3)*97+style.length*13,r=rng(seed);
  const W=300,H=375,dark=pal!=='crema';
  let defs=`<filter id="g${id}" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .5 0 0 0 0 .5 0 0 0 0 .5 0 0 0 ${dark?.10:.14} 0"/></filter>
   <filter id="w${id}" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
   <filter id="f${id}" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="46"/></filter>`;
  const line=(d,acc=false,w=1.15,op=.78)=>`<path class="ln" pathLength="1" d="${d}" fill="none" stroke="${acc?p.a:p.ln}" stroke-width="${acc?2.1:w}" stroke-linecap="round" stroke-linejoin="round" opacity="${acc?1:op}" ${acc?`filter="url(#w${id})"`:''}/>`;
  const halo=(cx,cy,rad,op=.35)=>`<circle cx="${cx}" cy="${cy}" r="${rad}" fill="${p.a}" opacity="${dark?op:op*.6}" filter="url(#f${id})"/>`;
  let body='';
  switch(style){
    case 'relieve':{ // curvas de nivel; una cota en acento
      const cx=150+(r()-.5)*70,cy=190+(r()-.5)*80;body+=halo(cx,cy,70,.28);
      for(let k=1;k<=16;k++){const R=k*13;const pts=[];for(let a=0;a<=72;a++){const t=a/72*Math.PI*2;const rr=R*(1+.2*Math.sin(3*t+k*.55)+.09*Math.sin(5*t+k*1.3)+.04*Math.sin(9*t));pts.push([cx+rr*Math.cos(t),cy+rr*Math.sin(t)*1.18])}
        body+=line(P2(pts)+'Z',k===7)}
      break;}
    case 'perfil':{ // crestas apiladas: la carga semanal del programa como una cordillera
      const vol=o.vol||[.62,.7,.8,.66,.74,.38];const n=vol.length;const prof=x=>{const f=x/W*(n-1);const i=Math.min(n-2,Math.floor(f)),t=f-i;const s=t*t*(3-2*t);return vol[i]*(1-s)+vol[i+1]*s};
      const rows=24;body+=halo(150,150,80,.22);
      for(let k=0;k<rows;k++){const y0=88+k*11;const pts=[];for(let x=0;x<=W;x+=5){const env=Math.exp(-Math.pow((x-150)/95,2));const h=env*prof(x)*(70+k*1.2)*(0.55+.45*Math.sin(k*.9+x*.03+seed))+env*6*r();pts.push([x,y0-Math.abs(h)])}
        const d=P2(pts);body+=`<path d="${d}L${W} ${H}L0 ${H}Z" fill="${p.bg2}" opacity=".96"/>`+line(d,k===(o.now??3)*3+2)}
      break;}
    case 'ondas':{ // líneas que se levantan en el centro, como un pulso
      body+=halo(150,210,60,.2);
      for(let k=0;k<26;k++){const y=50+k*12;const pts=[];for(let x=0;x<=W;x+=4){const env=Math.exp(-Math.pow((x-150-(k-13)*3)/62,2));pts.push([x,y-env*(8+k*.9)*Math.abs(Math.sin(x/8+k*.6+seed*.01))*2.2])}
        body+=`<path d="${P2(pts)}L${W} ${H}L0 ${H}Z" fill="${p.bg2}" opacity=".9"/>`+line(P2(pts),k===15)}
      break;}
    case 'orbitas':{ // órbitas finas e inclinadas alrededor de la torre
      body+=halo(150,190,55,.3);
      body+=`<g transform="rotate(-24 150 190)">`;
      for(let k=0;k<14;k++){const rx=22+k*12,ry=11+k*7;body+=`<ellipse class="ln" pathLength="1" cx="150" cy="190" rx="${rx}" ry="${ry}" fill="none" stroke="${k===8?p.a:p.ln}" stroke-width="${k===8?2:1.05}" opacity="${k===8?1:(.85-k*.035).toFixed(2)}" ${k===8?`filter="url(#w${id})"`:''}/>`}
      const t=2.3;body+=`<circle cx="${150+(22+8*12)*Math.cos(t)}" cy="${190+(11+8*7)*Math.sin(t)}" r="4" fill="${p.a}" filter="url(#w${id})"/></g>`;
      for(let i=0;i<30;i++)body+=`<circle cx="${(r()*W).toFixed(1)}" cy="${(r()*H).toFixed(1)}" r="${(r()*.9+.3).toFixed(1)}" fill="${p.ln}" opacity="${(r()*.4+.15).toFixed(2)}"/>`;
      break;}
    case 'campo':{ // campo de flujo: trazos que siguen una corriente
      body+=halo(90+r()*120,120+r()*140,70,.18);
      const ang=(x,y)=>Math.sin(x*.011+seed*.001)*1.6+Math.cos(y*.013)*1.2;
      for(let i=0;i<70;i++){let x=r()*W,y=r()*H;const pts=[[x,y]];for(let s=0;s<34;s++){const a=ang(x,y);x+=Math.cos(a)*5;y+=Math.sin(a)*5;pts.push([x,y])}
        body+=line(P2(pts),i===23,1,.55)}
      break;}
    case 'espiral':{ // una vuelta por semana; la semana actual en acento
      const weeks=o.weeks||6,now=o.now??3;body+=halo(150,190,60,.25);
      const seg=(w0,w1)=>{const pts=[];for(let t=w0*Math.PI*2;t<=w1*Math.PI*2+.01;t+=.06){const rr=14+t*3.4;pts.push([150+rr*Math.cos(t),190+rr*Math.sin(t)*1.12])}return P2(pts)};
      for(let w=0;w<weeks*2;w++)body+=line(seg(w/2,(w+1)/2),Math.floor(w/2)===now&&w%2===0,1.2,.8);
      break;}
    case 'eco':{ // la cifra del programa repetida en contornos, como un eco
      const t=o.num||'6';
      for(let k=9;k>=0;k--)body+=`<text x="150" y="${292-k*9}" text-anchor="middle" font-family="Inter" font-weight="600" font-size="270" letter-spacing="-8" fill="none" stroke="${k===0?p.a:p.ln}" stroke-width="${k===0?2:1.1}" opacity="${k===0?1:(.7-k*.065).toFixed(2)}" ${k===0?`filter="url(#w${id})"`:''}>${t}</text>`;
      break;}
    case 'sesion':{ // la sesión hecha: una línea por ejercicio, un pico por serie (alto = kg × reps); acento = ejercicio con marca
      const rows=o.rows||[[.7,.75,.8,.85],[.6,.62,.65],[.5,.5,.52],[.35,.36,.38],[.3,.3,.32]],pr=o.pr??0;body+=halo(150,140,70,.22);
      rows.forEach((sets,k)=>{const y0=88+k*30;const n=sets.length;const pts=[];
        for(let x=0;x<=W;x+=3){let h=0;sets.forEach((v,j)=>{const cx=60+j*(180/Math.max(1,n-1));h+=v*70*Math.exp(-Math.pow((x-cx)/(9+k),2))});pts.push([x,y0-h])}
        body+=`<path d="${P2(pts)}L${W} ${H}L0 ${H}Z" fill="${p.bg2}" opacity=".94"/>`+line(P2(pts),k===pr)});
      break;}
    case 'bruma':{ // el único estilo con color: difuminado, y líneas finas encima
      const c=[p.a,'#8fb2ff','#c9a8ff'];
      body+=`<g opacity="${dark?.55:.45}">${[[70,100,110],[240,210,100],[110,330,105]].map((q,i)=>`<circle cx="${q[0]}" cy="${q[1]}" r="${q[2]}" fill="${c[i]}" filter="url(#f${id})"/>`).join('')}</g>`;
      for(let k=0;k<20;k++){const y=40+k*16;const pts=[];for(let x=0;x<=W;x+=6)pts.push([x,y+Math.sin(x*.02+k*.4)*10+Math.sin(x*.05+k)*3]);body+=line(P2(pts),false,1,.42)}
      break;}
  }
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice" width="100%" height="100%" style="display:block" aria-hidden="true"><defs>${defs}<linearGradient id="bg${id}" x1="0" y1="0" x2=".3" y2="1"><stop offset="0" stop-color="${p.bg}"/><stop offset="1" stop-color="${p.bg2}"/></linearGradient></defs>${o.clear?"":`<rect width="${W}" height="${H}" fill="url(#bg${id})"/>`}${body}<rect width="${W}" height="${H}" filter="url(#g${id})"/></svg>`;
}

function spark(vals,color='var(--ink)',w=74,h=28){

  const mn=Math.min(...vals),mx=Math.max(...vals),r=mx-mn||1;
  const pts=vals.map((v,i)=>[2+i*(w-6)/(vals.length-1),h-4-(v-mn)/r*(h-8)]);
  const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const last=pts[pts.length-1];
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><path d="${d} L${last[0]} ${h} L2 ${h}Z" fill="${color}" opacity=".12"/><path d="${d}" fill="none" stroke="${color}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${last[0]}" cy="${last[1]}" r="2.6" fill="${color}"/></svg>`;
}

// Anima un bloque: las líneas [.draw] se dibujan escalonadas y las cifras [data-count] cuentan hacia arriba.
function animateIn(root){
  if(!root)return;
  root.querySelectorAll('.draw').forEach(svg=>{const ls=svg.querySelectorAll('.ln');ls.forEach((l,i)=>{l.style.animationDelay=(i*Math.min(60,1600/ls.length))+'ms'});svg.classList.add('go')});
  root.querySelectorAll('[data-count]').forEach(el=>{const to=Number(el.dataset.count),dec=Number(el.dataset.dec||0),t0=performance.now(),dur=reduceMotion()?0:1100;
    const fmt=v=>v.toFixed(dec).replace('.',',').replace(/\B(?=(\d{3})+(?!\d))/g,'.');
    const step=t=>{const k=dur?Math.min(1,(t-t0)/dur):1;el.textContent=fmt(to*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(step)};requestAnimationFrame(step)});
}

function meetRow(m){return `<div class="meet">${medal(m.medal,46)}<div class="tx"><strong>${m.name}${m.pr?'<span class="prc">RÉCORD</span>':''}</strong><span>${m.date} · ${m.city}</span></div><div class="tot"><b>${kg(m.total)}</b><em>${kg(m.pts)} ${m.ptsF}</em></div></div>`}
function totalsChart(){const v=[505,540,552.5],w=300,h=86;const X=i=>20+i*(w-40)/(v.length-1),mn=490,mx=560,Y=x=>h-12-(x-mn)/(mx-mn)*(h-26);
  return `<svg class="draw" viewBox="0 0 ${w} ${h}" width="100%" aria-hidden="true"><path class="ln" pathLength="1" d="${v.map((x,i)=>(i?'L':'M')+X(i)+' '+Y(x)).join('')}" fill="none" stroke="#f2eee6" stroke-width="2" stroke-linecap="round"/>${v.map((x,i)=>`<circle cx="${X(i)}" cy="${Y(x)}" r="${i===2?5:3.5}" fill="${i===2?'#f49a6e':'#0a0a0a'}" stroke="${i===2?'#f49a6e':'#f2eee6'}" stroke-width="1.6"/><text x="${X(i)}" y="${Y(x)-10}" fill="#8e8980" font-size="10" text-anchor="middle" font-family="Inter">${kg(x)}</text>`).join('')}</svg>`}

scene({tab:'competencias',id:'c-log',title:'Registrar el resultado',html:()=>`<div class="scroll" style="padding-top:52px">${back('Ya competí')}

  <div class="tot-bar"><div><div class="lbl">Total</div><div class="big" style="font-size:calc(44px*var(--fs))"><span data-count="552.5" data-dec="1">0</span><small>kg</small></div></div><div style="text-align:right"><div class="cap">IPF GL</div><b class="syne" style="font-size:calc(20px*var(--fs));display:block">79,4</b><span class="pchip" style="margin-top:6px">+12,5 kg</span></div></div>

scene({tab:'competencias',id:'c-feel',title:'Fotos y cómo te sentiste',html:()=>`<div class="scroll" style="padding-top:52px">${back('Ya competí')}

scene({tab:'competencias',id:'c-cele',title:'¡Celebración!',after:ph=>{animateIn(ph);ph.querySelector('.cele svg')?.classList.add('go')},html:()=>`<div class="cele">${confetti(30)}${burst()}

scene({tab:'competencias',id:'c-run-next',title:'Carrera · próxima (maratón)',after:drawAfter,html:()=>`<div class="scroll" style="padding-top:52px">${back('Voy a competir')}

function wzHead(done,total=9){return `<div class="wzh glass"><button class="ib" aria-label="Cerrar">${ic('close')}</button><div class="t"><strong>Nuevo programa</strong><span>Solo entreno · ${done} de ${total}</span></div></div><div class="wzp"><i style="width:${Math.round(done/total*100)}%"></i></div>`}
const sumRow=(k,v,id)=>`<div class="wzsum" data-tag="setup-summary-${id}"><span class="k">${k}</span><span class="v">${v}</span>${ic('edit',16)}</div>`;
const symRow=(sym,t,s,on)=>`<button class="wzopt ${on?'on':''}"><span class="sym">${ic(sym,40)}</span><span class="tx"><strong>${t}</strong>${s?`<span>${s}</span>`:''}</span><span class="rad">${on?ic('check',16):''}</span></button>`;
const wzStep=(t,sub,body)=>`<section class="wzstep"><h2>${t}</h2>${sub?`<p>${sub}</p>`:''}${body}</section>`;
const wzBtn=(t='Continuar',dis=false)=>`<div class="wzbtn glass"><button class="pill pri" style="width:100%;${dis?'opacity:.35':''}">${t}</button></div>`;
const peek=(t)=>`<section class="wzstep peek"><h2>${t}</h2></section>`;

/* ================= REGISTRO DE COMIDA · DESCRIBIR ================= */
const MACC={p:'var(--mus)',c:'var(--ene)',f:'var(--col)'};
function lgHead(title='Registrar comida'){return `<div class="lg-head"><button class="ib fill" aria-label="Cerrar">${ic('close')}</button><div class="t"><strong>${title}</strong><span>${ic('cal',13)}Hoy · 08:40</span></div><button class="ib fill" aria-label="Ajustes del registro">${ic('sliders')}</button></div>`}
const mealChips=(on=0)=>`<div class="meal-chips">${['Desayuno','Almuerzo','Merienda','Cena'].map((m,i)=>`<span class="chip ${i===on?'on':''}" style="height:34px">${m}</span>`).join('')}</div>`;
const seg2=(on=0)=>`<div class="seg2"><button class="${on===0?'on':''}">${ic('edit',16)}Describir</button><button class="${on===1?'on':''}">${ic('search',16)}Buscar</button></div>`;
function textWithTokens(state){let t=MEAL_TEXT;FOODS.forEach((f,i)=>{const cls=state==='all'?'done':state===i?'on':(typeof state==='number'&&i<state)?'done':'';if(cls)t=t.replace(f.tok,`<span class="tok ${cls}">${f.tok}</span>`)});return t}
// Animación «leyendo tu comida»: un plato que se dibuja y los alimentos detectados que orbitan y caen en él.
function plateAnim(){const icons=[['egg',60,70],['bread',230,62],['avo',52,170],['cup',238,168]];
  return `<svg class="plate" viewBox="0 0 300 250" width="300" height="250" aria-hidden="true">
  <circle class="ln" pathLength="1" cx="150" cy="125" r="78" fill="none" stroke="#f2eee6" stroke-width="1.4" opacity=".75"/>
  <circle class="ln" pathLength="1" cx="150" cy="125" r="58" fill="none" stroke="#f2eee6" stroke-width="1" opacity=".35" style="animation-delay:.25s"/>
  <path class="ln" pathLength="1" d="M60 125a90 90 0 0 1 180 0" fill="none" stroke="#f49a6e" stroke-width="2" stroke-linecap="round" style="animation-delay:.5s;filter:drop-shadow(0 0 6px #f49a6e)"/>
  <g class="orbit"><circle cx="150" cy="40" r="3" fill="#f49a6e"/></g>
  ${icons.map((c,i)=>`<g transform="translate(${c[1]-18} ${c[2]-18})" style="color:#f2eee6"><g class="float${i+1}"><g transform="scale(1.5)"><g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">${P[c[0]]}</g></g></g></g>`).join('')}
  </svg>`}
function foodCard(f,i,{open=false,answered=false}={}){const mt=f.p*4+f.c*4+f.f*9;const q=f.ask&&!answered;
  return `<div class="food ${q?'ask':''}" style="animation-delay:${150+i*140}ms"><div class="food-h"><span class="fi">${ic(f.ic,24)}</span><div class="tx"><strong>${f.n}</strong><span>${f.q}${f.approx?' · aprox.':''}</span></div><div class="k"><b>${f.approx?'≈ ':''}${f.k}</b><span>kcal</span></div></div>
  <div class="mbar"><i style="flex:${f.p*4};background:${MACC.p}"></i><i style="flex:${f.c*4};background:${MACC.c}"></i><i style="flex:${f.f*9};background:${MACC.f}"></i></div>
  ${q&&f.ask==='oil'?`<div class="q"><p><i></i>¿Las tostaste con aceite o mantequilla?</p><div class="qopts"><span>Nada</span><span>Un poco</span><span>Bastante</span></div><span class="qskip">Seguir con «nada»</span></div>`:''}
  ${q&&f.ask==='milk'?`<div class="q"><p><i></i>¿Qué leche llevaba?</p><div class="qopts"><span>Entera</span><span class="on">Semidesnatada</span><span>Desnatada</span><span>Vegetal</span></div></div>`:''}
  ${open?`<div class="q" style="border-top-color:var(--div)"><div class="sizes">${[['Pequeña',22],['Mediana',30],['Grande',38],['Extra',46]].map((s,j)=>`<button class="${j===1?'on':''}"><i style="width:${s[1]}px;height:${s[1]}px"></i>${s[0]}</button>`).join('')}</div></div>`:''}</div>`}
function sumCard(k=548,c=0){return `<div class="sumcard">${ringSvg(k,2300)}<div class="mac">${[['Proteína',25,'p',.32],['Carbos',46,'c',.43],['Grasa',30,'f',.25]].map(m=>`<div>${m[0]}<i style="--w:${Math.round(m[3]*100)}%;--c:${MACC[m[2]]}"></i><b>${m[1]} g</b></div>`).join('')}</div></div>`}
const saveBar=(k=548,{off=false,label='Guardar en desayuno'}={})=>`<div class="savebar glass"><div class="k"><b>${k} kcal</b><span>${off?'Resuelve 2 dudas o sigue con la estimación':'4 alimentos · 25 g de proteína'}</span></div><button class="go ${off?'off':''}">${label}</button></div>`;

scene({tab:'comida',id:'f-empty',title:'Describir · al abrir',html:()=>`<div class="lg">${lgHead()}${mealChips()}${seg2()}
  <div class="write focus"><div class="txt"><span class="ph">¿Qué comiste? Escríbelo como lo contarías</span><span class="caret"></span></div>
  <div class="acts"><span class="cap">Cantidades, marcas y cómo lo cocinaste</span><button class="ib fill" aria-label="Dictar">${ic('mic')}</button></div></div>
  <div class="group-l">Repetir</div><div class="hrow">${RECENT.map(r=>`<div class="hcard"><strong>${r[0]}</strong><span>${r[1]}</span></div>`).join('')}</div>
  <div class="group-l">Favoritos<span style="text-transform:none;letter-spacing:0" class="act faint">Ver todos</span></div>
  <div class="mod tight">${[['Yogur griego con miel','190 kcal'],['Batido de proteína','160 kcal']].map(f=>`<div class="sres"><span class="fi" style="width:36px;height:36px;border-radius:12px;background:#ffffff0a;display:flex;align-items:center;justify-content:center;color:var(--ene)">${ic('starOn',16)}</span><div class="tx"><strong>${f[0]}</strong><span>${f[1]}</span></div><button class="add" aria-label="Añadir">${ic('plus',18)}</button></div>`).join('')}</div></div>`,
 notes:{tags:[['new','Repetir lo de siempre'],['fix','Favoritos sin tapar el campo']],
  p:['El campo es lo primero, grande y con el teclado abierto; la comida (desayuno, almuerzo…) se elige con chips arriba y la hora sale de la cabecera.',
     'Debajo, <b>«Repetir»</b>: lo que sueles registrar a esta hora y las comidas recientes (hoy no existen recientes). Favoritos con tope de dos filas y «Ver todos»: hoy favoritos, recetas y plantillas se apilan sin tope <b>encima</b> de las dos pestañas.',
     'El micrófono dicta al campo (el reconocedor de voz ya existe en el código y no tenía uso en Nutrición).']}});

scene({tab:'comida',id:'f-typed',title:'Describir · escrito',html:()=>`<div class="lg">${lgHead()}${mealChips()}${seg2()}
  <div class="write focus"><div class="txt">${MEAL_TEXT}<span class="caret"></span></div><div class="acts"><span class="cap">Enter para analizar</span><button class="pill pri sm">${ic('spark',16)}Analizar</button></div></div></div>`,
 notes:{tags:[['fix','Un solo verbo']],p:['Un solo botón: <b>«Analizar»</b>. Hoy el mismo botón dice «Interpretar comida» o «Actualizar y buscar», y este último no busca: vuelve a interpretar. Si cambias el texto después de analizar, el botón dice «Volver a analizar».']}});

scene({tab:'comida',id:'f-ana',title:'Analizando',after:ph=>{animateIn(ph)},html:()=>`<div class="lg">${lgHead()}${mealChips()}
  <div class="write"><div class="txt" style="font-size:calc(17px*var(--fs))">${textWithTokens(2)}</div></div>
  <div class="ana">${plateAnim()}<div class="msg">Encontré huevos y pan<small>Estimando cantidades…</small></div></div></div>`,
 notes:{tags:[['new','Animación de comidas'],['keep','Motor local, sin conexión']],
  p:['Al analizar, un plato de líneas se dibuja y los alimentos aparecen como iconos de línea que flotan alrededor y van cayendo en él. A la vez, <b>las palabras del texto se subrayan</b> en color acento mientras se leen y pasan a verde cuando se convierten en alimento.',
     'Los mensajes dicen lo que de verdad pasa («Encontré huevos y pan», «Estimando cantidades…»), no frases rotatorias genéricas. El motor sigue siendo local y sin conexión: la animación tapa el tiempo de carga del catálogo la primera vez.',
     'Con movimiento reducido: el texto se subraya sin animar y un solo mensaje.']}});

scene({tab:'comida',id:'f-result',title:'Lo que comiste',after:drawAfter,html:()=>`<div class="lg">${lgHead()}${mealChips()}
  <div class="write" style="min-height:0;padding:12px 14px"><div class="txt" style="font-size:calc(14px*var(--fs));color:var(--muted)">${textWithTokens('all')}</div></div>
  <div class="pending">${ic('qmark',16)}2 dudas: tócalas para afinar o guarda con la estimación</div>
  <div style="margin-top:12px">${sumCard()}</div>
  ${FOODS.map((f,i)=>foodCard(f,i)).join('')}
  <button class="act" style="margin-top:8px">${ic('plus',16)}Añadir otro alimento</button></div>${saveBar()}`,
 notes:{tags:[['new','Resumen con anillo'],['fix','Todas las dudas a la vista']],
  p:['Arriba, el anillo de calorías con los tres macros como arcos (cuenta al aparecer). Cada alimento es una tarjeta con su icono, cantidad legible («2 huevos · 110 g»), calorías y una barra de macros.',
     '<b>Las dudas viven en su tarjeta</b>, con fondo cálido y chips de respuesta. Hoy solo se ve la primera duda de la primera tarjeta y las demás quedan ocultas.',
     'Se puede guardar con dudas: cada una tiene su respuesta por defecto («Seguir con “nada”»). Hoy el guardado queda bloqueado con un aviso.']}});

scene({tab:'comida',id:'f-edit',title:'Ajustar un alimento',html:()=>`<div class="lg">${lgHead()}${sumCard()}${FOODS.slice(0,2).map((f,i)=>foodCard(f,i)).join('')}</div>${sheet(`<div style="display:flex;gap:12px;align-items:center"><span class="fi" style="width:48px;height:48px;border-radius:16px;background:#ffffff0a;display:flex;align-items:center;justify-content:center">${ic('egg',26)}</span><div style="flex:1"><h3>Huevos revueltos</h3><div class="cap">Coincidencia alta · base KPKN</div></div><button class="act">Cambiar</button></div>
  <div class="mgroup">Cantidad</div><div class="stepper"><button aria-label="Menos">−</button><b>2<small>huevos</small></b><button aria-label="Más">+</button></div>
  <div class="units">${chips(['Huevos','Gramos','Raciones'],0,34)}</div>
  <div class="mgroup">Cómo lo cocinaste</div><div class="drop3">${[['pan','Con aceite',1],['raw','Sin grasa',0],['drop','Con mantequilla',0]].map(o=>`<button class="${o[2]?'on':''}">${ic(o[0],24)}${o[1]}</button>`).join('')}</div>
  <div class="mgroup">Aporta</div><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px">${[['182','kcal'],['13 g','prot.'],['2 g','carb.'],['14 g','grasa']].map(k=>`<div class="kpi" style="padding:8px 10px"><b style="font-size:calc(16px*var(--fs));margin:0">${k[0]}</b><span>${k[1]}</span></div>`).join('')}</div>
  <div class="cap" style="margin-top:8px">Toca una cifra para corregirla a mano.</div>
  <div style="display:flex;gap:8px;margin-top:16px"><button class="pill sec" style="flex:0 0 auto;color:var(--danger);border-color:#ff9b9255">${ic('trash',18)}</button><button class="pill pri" style="flex:1">Listo</button></div>`)}`,
 notes:{tags:[['keep','Mismos ajustes'],['fix','Sin deslizador defectuoso']],
  p:['Tocar una tarjeta abre su hoja: cantidad en la unidad natural del alimento (huevos, rebanadas, tazas) con −/+, y gramos o raciones a un toque. Sustituye al deslizador de 1 g, cuyo tope se fijaba al abrir y dejaba el pulgar al final cuando el valor escrito era mayor.',
     'La cocción (aceite, sin grasa, mantequilla) es una elección visual; los macros se ven en cuatro cifras y se corrigen tocándolas (hoy son botones de ±5 kcal que no hacen nada si el alimento tiene 0 kcal).',
     '«Cambiar» abre las otras coincidencias. La papelera quita el alimento con deshacer.']}});

scene({tab:'comida',id:'f-identity',title:'Duda: ¿es este el alimento?',html:()=>`<div class="lg">${lgHead()}${sumCard()}</div>${sheet(`<div class="ey">Escribiste «tostadas»</div><h3 style="margin-top:6px">¿Cuál se parece más?</h3>
  ${[['Pan de molde tostado','2 rebanadas · 158 kcal','h'],['Pan integral tostado','2 rebanadas · 146 kcal','m'],['Biscote','4 unidades · 152 kcal','m'],['Tostada de pan de barra','2 rebanadas · 190 kcal','m']].map((c,i)=>`<div class="cand">${radio(i===0)}<div class="tx"><strong>${c[0]}</strong><span>${c[1]}</span></div><span class="conf ${c[2]}">${c[2]==='h'?'Muy probable':'Posible'}</span></div>`).join('')}
  <button class="act" style="margin-top:6px">${ic('search',16)}Buscar otro</button>
  <button class="pill pri" style="width:100%;margin-top:14px">Usar este</button>`)}`,
 notes:{tags:[['keep','Duda «identidad»']],p:['La duda de identidad («¿Es este el alimento?» + «Coincidencia aproximada…») como una lista corta de candidatos con su ración y cuánto encaja, en vez de un texto con el nombre técnico de la coincidencia.']}});

scene({tab:'comida',id:'f-clar',title:'Todas las dudas',html:()=>`<div class="lg">${lgHead()}
  <div class="pending">${ic('qmark',16)}Así se ve cada tipo de duda dentro de su tarjeta</div>
  ${[['Arroz','150 g','¿La cantidad era en crudo o cocida?',['En crudo','Cocida'],'raw'],['Ensalada','1 plato','¿Qué llevaba la ensalada?',['Lechuga y tomate','Con atún','César','Otra'],'bowl'],['Tortilla','1 porción','¿De qué era la tortilla?',['De papas','De huevo','Trigo (wrap)','De maíz'],'egg'],['Galletas','1 envase','¿Comiste todo el envase?',['Todo (180 g)','Una porción (30 g)'],'bread'],['Lomo de cerdo','1 pieza','¿Qué corte era?',['Lomo','Solomillo','Chuleta'],'pan']].map((f,i)=>`<div class="food ask" style="animation-delay:${i*120}ms"><div class="food-h"><span class="fi">${ic(f[4],24)}</span><div class="tx"><strong>${f[0]}</strong><span>${f[1]}</span></div></div><div class="q"><p><i></i>${f[2]}</p><div class="qopts">${f[3].map(o=>`<span>${o}</span>`).join('')}</div></div></div>`).join('')}
  <div class="food ask" style="animation-delay:620ms"><div class="food-h"><span class="fi">${ic('drop',24)}</span><div class="tx"><strong>Verduras salteadas</strong><span>1 plato</span></div></div><div class="q"><p><i></i>¿Cuánto aceite tenía?</p><div class="drop3">${[['Nada',0],['Poco',1],['Medio',2],['Mucho',3]].map((o,j)=>`<button class="${j===1?'on':''}" style="padding:10px 2px"><span style="display:flex;gap:2px;height:22px;align-items:flex-end">${Array.from({length:Math.max(1,o[1])},()=>ic('drop',14)).join('')}</span><span style="${o[1]?'':'opacity:.4'}">${o[0]}</span></button>`).join('')}</div></div></div></div>`,
 notes:{tags:[['keep','Los ocho tipos de duda'],['fix','Respuestas marcadas']],
  p:['Los ocho tipos que existen (composición, tortilla, identidad, corte, crudo o cocido, aceite, envase y cantidad declarada) con el mismo patrón: una pregunta corta en la tarjeta y respuestas como chips. El aceite se elige con gotas.',
     'Arregla que hoy los chips de respuesta nunca se ven elegidos (<code>selected=false</code> siempre). La respuesta elegida queda en tinta y la tarjeta pierde el tono cálido con una transición.',
     '«Cantidad declarada» (no pudimos leer tu medida) abre directamente el ajuste de cantidad.']}});

scene({tab:'comida',id:'f-saved',title:'Guardado',html:()=>`<div class="lg">${lgHead()}${sumCard()}</div><div class="savedone">
  <svg class="draw go" viewBox="0 0 120 120" width="140" height="140" aria-hidden="true"><circle class="ln" pathLength="1" cx="60" cy="60" r="50" fill="none" stroke="#43d18c" stroke-width="3"/><path class="ln" pathLength="1" d="M38 62l15 15 30-32" fill="none" stroke="#43d18c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" style="animation-delay:.5s"/></svg>
  <b>Desayuno guardado</b><span>548 kcal · te quedan 1.752 para hoy</span></div>`,after:drawAfter,
 notes:{tags:[['keep','Check animado']],p:['El check verde que se dibuja (ya existe) con lo que importa justo después de guardar: cuánto te queda del día. Se cierra solo a los 0,8 s.']}});

scene({tab:'comida',id:'f-error',title:'Si algo falla',html:()=>`<div class="lg">${lgHead()}${mealChips()}
  <div class="write"><div class="txt" style="font-size:calc(16px*var(--fs))">Un plato de lentejas de mi abuela con chorizo</div></div>
  <div class="mod" style="margin-top:12px;border-color:#f7cf7333"><div class="ey" style="color:var(--ene)">${ic('info',14)} Lo leí a medias</div><p class="body" style="margin:8px 0 10px">Reconocí las lentejas y el chorizo, pero no las cantidades. Las dejé en una ración normal: revísalas antes de guardar.</p><div style="display:flex;gap:8px"><button class="pill sec sm">Volver a analizar</button><button class="pill sec sm">Buscar a mano</button></div></div>
  ${foodCard({n:'Lentejas guisadas',q:'1 plato · 300 g',k:342,p:20,c:44,f:8,ic:'bowl',approx:true},0)}${foodCard({n:'Chorizo',q:'40 g',k:182,p:10,c:1,f:15,ic:'pan',approx:true},1)}</div>${saveBar(524)}`,
 notes:{tags:[['fix','Sin jerga técnica']],p:['Los cuatro avisos de error de hoy hablan de «dataset de porciones no cargado» o muestran el nombre de la excepción. Ahora dicen qué se reconoció, qué se supuso y qué puedes hacer, con un icono de aviso (no de información). El detalle técnico queda solo en los registros de la app.']}});

/* --- v2: registrador rápido en Inicio, sin salir de la pantalla --- */
function homeBase(k=1240,{bump=false}={}){return `<div class="home"><div class="cap" style="letter-spacing:1.4px;font-weight:600">MIÉRCOLES 29</div><div class="ptitle" style="margin-top:4px">Hola, Matías</div>
  <div class="mod" style="margin-top:14px"><div class="mod-h"><span class="ey">Hoy en tu entreno</span><span class="cap">Tirón · 48 min</span></div><button class="pill pri sm" style="width:100%;margin-top:10px">${ic('play',16)}Empezar Tirón</button></div>
  <div class="mod"><div class="mod-h"><span class="ey">Nutrición de hoy</span><span class="cap">objetivo 2.300</span></div><div class="hm-ring ${bump?'bump':''}" style="margin-top:8px">${ringSvg(k,2300)}<div class="mac">${[['Proteína',bump?92:67,'p',.4],['Carbos',bump?150:104,'c',.45],['Grasa',bump?52:38,'f',.5]].map(m=>`<div>${m[0]}<i style="--w:${Math.round(m[3]*100)}%;--c:${MACC[m[2]]}"></i><b>${m[1]} g</b></div>`).join('')}</div></div></div>
  <div class="mod tight"><div class="rowx"><div class="tx"><strong>Desayuno</strong><span>Avena con plátano · 412 kcal</span></div></div><div class="rowx"><div class="tx"><strong>Almuerzo</strong><span>${bump?'Pollo con arroz y ensalada · 652 kcal':'Sin registrar'}</span></div></div></div></div>`}
const qbar=(t='',on=false)=>`<div class="qbar glass"><span class="t ${on?'on':''}">${t||'¿Qué comiste? Escríbelo aquí'}</span><button class="ib fill" aria-label="Dictar">${ic('mic')}</button>${on?`<button class="go" style="height:44px;border-radius:22px;background:var(--ink);color:#111;padding:0 16px;font-weight:600">Analizar</button>`:''}</div>`;
const HOME_FOODS=[{n:'Pechuga de pollo',q:'180 g · a la plancha',k:297,p:56,c:0,f:7,ic:'pan'},{n:'Arroz blanco',q:'1 plato · 200 g cocido',k:260,p:5,c:57,f:1,ic:'bowl',ask:'raw'},{n:'Ensalada mixta',q:'1 bol · con aceite',k:95,p:2,c:6,f:7,ic:'avo'}];
function homeCard(f,i){const q=f.ask;return `<div class="food ${q?'ask':''}" style="animation-delay:${120+i*120}ms"><div class="food-h"><span class="fi">${ic(f.ic,20)}</span><div class="tx"><strong>${f.n}</strong><span>${f.q}</span></div><div class="k"><b>${f.k}</b><span>kcal</span></div></div>${q?`<div class="q"><p><i></i>¿Los 200 g eran en crudo o cocidos?</p><div class="qopts"><span>En crudo</span><span class="on">Cocidos</span></div></div>`:''}</div>`}

scene({tab:'comida',id:'f-home',title:'Inicio · escribir sin salir',html:()=>`${homeBase()}${qbar()}${navbar(0)}`,
 notes:{tags:[['new','Registrador en Inicio'],['keep','El mismo motor']],
  p:['En Inicio aparece una barra de vidrio flotante «¿Qué comiste?» justo encima de la barra de navegación. Escribes o dictas ahí mismo: <b>no se abre otra pantalla</b>. Hoy el icono «Registrar comida» de Inicio lleva a la hoja completa de Nutrición.',
     'La barra solo aparece si hay plan de nutrición; la comida se elige sola por la hora (almuerzo a las 14:10) y se puede cambiar en la hoja.']}});

scene({tab:'comida',id:'f-home-type',title:'Inicio · escrito',html:()=>`${homeBase()}${qbar('Pollo a la plancha con arroz y ensalada<span class="caret"></span>',true)}${navbar(0)}`,
 notes:{p:['El texto crece en la propia barra (hasta tres líneas). «Analizar» con el botón o con Enter.']}});

scene({tab:'comida',id:'f-home-ana',title:'Inicio · analizando',after:ph=>animateIn(ph),html:()=>`${homeBase()}<div class="scrim" style="background:#0007"></div><div class="qsheet"><div class="grab"></div>
  <div class="lg-head" style="margin:0 -6px 6px"><div class="t"><strong style="font-size:calc(16px*var(--fs))">Almuerzo · 14:10</strong><span>Pollo a la plancha con arroz y ensalada</span></div></div>
  <div class="ana" style="height:210px;margin-top:4px">${plateAnim()}<div class="msg">Encontré pollo, arroz y ensalada<small>Estimando cantidades…</small></div></div></div>`,
 notes:{tags:[['new','Media hoja sobre Inicio']],p:['Al analizar, una media hoja sube desde la barra con la misma animación del plato. Inicio sigue visible arriba, atenuado.']}});

scene({tab:'comida',id:'f-home-res',title:'Inicio · revisar y guardar',after:drawAfter,html:()=>`${homeBase()}<div class="scrim" style="background:#0007"></div><div class="qsheet" style="max-height:82%"><div class="grab"></div>
  <div class="lg-head" style="margin:0 -6px 2px"><div class="t"><strong style="font-size:calc(16px*var(--fs))">Almuerzo · 14:10</strong><span>3 alimentos · 1 duda</span></div><button class="act faint">Abrir completo${ic('fwd',14)}</button></div>
  ${HOME_FOODS.map(homeCard).join('')}
  <div style="display:flex;gap:8px;margin-top:12px"><button class="pill sec" style="flex:0 0 auto">${ic('plus',18)}</button><button class="pill pri" style="flex:1">Guardar · 652 kcal</button></div></div>`,
 notes:{tags:[['keep','Mismas tarjetas y dudas']],p:['Las mismas tarjetas del registro completo, más compactas, con sus dudas dentro. Tocar una tarjeta abre su hoja de ajuste encima. «Abrir completo» pasa al registro de Nutrición con todo lo escrito, por si quieres buscar o añadir más.','«+» añade otro alimento escribiéndolo en la misma hoja.']}});

scene({tab:'comida',id:'f-home-done',title:'Inicio · guardado',after:ph=>animateIn(ph),html:()=>`${homeBase(1892,{bump:true})}<div class="toast glass" style="bottom:160px">${ic('check',18)}Almuerzo guardado · 652 kcal<button class="act">Deshacer</button></div>${qbar()}${navbar(0)}`,
 notes:{tags:[['new','Se queda en Inicio']],p:['La hoja baja, el anillo de Nutrición de hoy cuenta hasta el nuevo total con un pequeño rebote y el almuerzo aparece en la lista. Un aviso con «Deshacer» durante 4 s. No has salido de Inicio en ningún momento.']}});

/* ================= REGISTRO DE COMIDA · BUSCAR Y MENÚS ================= */
const sfield=(t='',ph='Busca un alimento')=>`<div class="searchf">${ic('search',18)}<span class="t">${t||`<span style="color:var(--dim)">${ph}</span>`}${t?'<span class="caret"></span>':''}</span><button class="ib" aria-label="Escanear código">${ic('barcode')}</button></div>`;
const sres=(n,s,k,{star=false,src=''}={})=>`<div class="sres"><div class="tx"><strong>${n}</strong><span>${s}${src?` · <span style="color:var(--faint)">${src}</span>`:''}</span></div><span class="tn" style="font:700 calc(14px*var(--fs)) Syne">${k}</span><button class="ib" aria-label="Favorito" style="width:36px;height:36px;color:${star?'var(--ene)':'var(--dim)'}">${ic(star?'starOn':'star',18)}</button><button class="add" aria-label="Añadir ${n}">${ic('plus',18)}</button></div>`;

scene({tab:'busqueda',id:'s-start',title:'Buscar · al abrir',html:()=>`<div class="lg">${lgHead()}${mealChips()}${seg2(1)}${sfield()}
  <div class="group-l">Recientes</div><div class="mod tight">${sres('Avena en copos','40 g · desayuno de ayer','150')}${sres('Plátano','1 mediano','105',{star:true})}${sres('Leche semidesnatada','200 ml','92')}</div>
  <div class="group-l">Atajos</div><div class="opt-grid">${[['barcode','Escanear','Código de barras'],['bolt','Entrada rápida','Solo calorías y macros'],['book','Recetas','Tus 4 recetas'],['copy','Plantillas','Comidas guardadas']].map(o=>`<button class="opt" style="min-height:92px"><span class="ic">${ic(o[0])}</span><strong>${o[1]}</strong><span>${o[2]}</span></button>`).join('')}</div></div>`,
 notes:{tags:[['new','Recientes'],['move','Recetas y plantillas a atajos']],
  p:['Antes de escribir ya hay algo útil: recientes (no existían) y cuatro atajos. Recetas, plantillas, escáner y entrada rápida estaban repartidos por la hoja, el escáner y la pantalla de Nutrición; ahora están juntos aquí.',

function medalSvg(m='oro'){const d=MEDAL[m];return `<svg viewBox="0 0 200 200" width="100%" aria-hidden="true"><defs><radialGradient id="mg" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#fff" stop-opacity=".6"/><stop offset=".35" stop-color="${d.c}"/><stop offset="1" stop-color="${d.c2}"/></radialGradient><filter id="mglow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9"/></filter></defs>
  <circle cx="100" cy="100" r="62" fill="${d.c}" opacity=".35" filter="url(#mglow)"/>${Array.from({length:24},(_,i)=>{const a=i/24*Math.PI*2;return `<path class="ln" pathLength="1" d="M${100+Math.cos(a)*74} ${100+Math.sin(a)*74}L${100+Math.cos(a)*(92+(i%3)*6)} ${100+Math.sin(a)*(92+(i%3)*6)}" stroke="${i%4?'#f2eee6':d.c}" stroke-width="${i%4?1:2}" stroke-linecap="round" opacity="${i%4?.5:1}"/>`}).join('')}
  <circle cx="100" cy="100" r="56" fill="url(#mg)"/><circle cx="100" cy="100" r="44" fill="none" stroke="#0004" stroke-width="2"/><text x="100" y="118" text-anchor="middle" font-family="Syne" font-weight="800" font-size="52" fill="#1b1206">1</text></svg>`}

function bodyChart(){const v=BODY.w,w=300,h=200,mn=79.8,mx=85,X=i=>14+i*(w-28)/(v.length-1),Y=x=>h-20-(x-mn)/(mx-mn)*(h-50);

  <path d="${v.map((x,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(x).toFixed(1)).join('')}L${X(v.length-1)} ${h}L${X(0)} ${h}Z" fill="url(#bf)"/><path class="ln" pathLength="1" d="${v.map((x,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(x).toFixed(1)).join('')}" fill="none" stroke="#f2eee6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="${X(0)}" cy="${Y(v[0])}" r="4" fill="#0a0a0a" stroke="#f2eee6" stroke-width="1.6"/><circle cx="${X(v.length-1)}" cy="${Y(v[v.length-1])}" r="6" fill="#f49a6e" style="filter:drop-shadow(0 0 6px #f49a6e)"/></svg>`}

scene({tab:'historias',id:'h-meet-score',title:'Competencia · Intentos',after:drawAfter,html:()=>fullStory(storyMeetScore),notes:{p:['El marcador de nueve intentos: válidos en tinta llena, nulos tachados. Para quien quiere enseñar el día entero.']}});
scene({tab:'historias',id:'h-meet-photo',title:'Competencia · Foto',after:drawAfter,html:()=>fullStory(storyMeetPhoto),notes:{p:['Tu foto de la competencia (aquí un degradado en su lugar) con curvas de nivel finas encima, la medalla pequeña y tres cifras en una línea.']}});
scene({tab:'historias',id:'h-meet-next',title:'Competencia · Próxima',after:drawAfter,html:()=>fullStory(storyMeetNext),notes:{p:['Antes de competir: cuenta atrás y con qué abres. Se ofrece desde la tarjeta «Próxima».']}});
scene({tab:'historias',id:'h-meet-video',title:'Competencia · vídeo (6 s)',after:ph=>{animateIn(ph);ph.querySelector('.cele svg')?.classList.add('go')},html:()=>`<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#000"><div class="story" style="--sw:100%"><div class="cele" style="position:absolute">${confetti(30)}${burst()}
  <div style="position:absolute;left:50%;top:30%;transform:translate(-50%,-50%)"><div class="spin-medal">${medal('oro',120)}</div></div>
  <div style="position:absolute;left:7%;right:7%;top:52%"><div class="st-ey rise" style="opacity:0;animation:rise .7s .6s forwards">Copa de otoño · oro</div><div class="st-name pop-in" style="animation-delay:.8s"><span data-count="552.5" data-dec="1">0</span> kg</div><div class="st-meta" style="opacity:0;animation:rise .7s 1.1s forwards">Mejor total: +12,5 kg</div></div>
  <div class="st-in" style="top:auto"><div class="st-foot">KPKN<span>Mi competencia</span></div></div></div></div></div>`,
 notes:{tags:[['new','Felicitación animada']],p:['La versión en vídeo: confeti, estallido de líneas, la medalla que entra girando y el total que cuenta. Al exportar se graba a 30 fps en 1080 × 1920 (MP4 de unos 2 MB). Instagram lo acepta como historia normal.']}});

scene({tab:'historias',id:'h-body-sheet',title:'Cuerpo · compartir',after:drawAfter,html:()=>`<div class="scroll" style="padding-top:60px"><div class="ptitle">Cuerpo</div></div>${shareSheet('Compartir tu progreso',storyBodyChange,['Cambio','Medidas'],[['Peso actual',0],['Cambio en kg',1],['Medidas',1],['% de grasa',1]])}`,
 notes:{tags:[['new','Privado por defecto']],p:['Desde Cuerpo (botón compartir en el módulo de peso) y desde el ⋯ del historial. Dos plantillas: <b>Cambio</b> (la curva de tu peso y lo que cambió) y <b>Medidas</b> (perímetros).',
  '<b>Privacidad</b>: por defecto nunca sale tu peso, solo los cambios. Tu peso actual se incluye solo si lo activas.',
  'Fotos de progreso: la app no las tiene hoy (las fotos son de entrenos). Si las quieres, es una función nueva para otra ronda: «antes y después» con las mismas líneas.']}});
scene({tab:'historias',id:'h-body-change',title:'Cuerpo · Cambio',after:drawAfter,html:()=>fullStory(storyBodyChange),notes:{p:['La curva de 12 semanas con el último punto en acento, el cambio como título y tres cambios más. Sin cifra de peso absoluto.']}});
scene({tab:'historias',id:'h-body-measures',title:'Cuerpo · Medidas',after:drawAfter,html:()=>fullStory(storyBodyMeasures),notes:{p:['Los perímetros que cambiaron, con el fondo «Eco» que repite la cifra principal.']}});
scene({tab:'historias',id:'h-nutri-sheet',title:'Nutrición · compartir',after:drawAfter,html:()=>`<div class="scroll" style="padding-top:60px"><div class="ptitle">Nutrición</div></div>${shareSheet('Compartir tu semana',storyNutriWeek,['Semana','Macros','Racha'],[['Calorías',1],['Objetivo',1]])}`,
 notes:{tags:[['new','Tres plantillas']],p:['Desde la tendencia semanal de Nutrición. <b>Semana</b> (días en objetivo y la barra de cada día), <b>Macros</b> (media diaria frente a objetivo) y <b>Racha</b> (días seguidos registrando, del hábito «Comidas» que ya existe).','Nunca sale qué comiste ni tu peso.']}});
scene({tab:'historias',id:'h-nutri-week',title:'Nutrición · Semana',after:ph=>{animateIn(ph)},html:()=>fullStory(storyNutriWeek),notes:{p:['El anillo de la media con los macros como arcos y siete barras, en acento el día que te pasaste.']}});
scene({tab:'historias',id:'h-nutri-macros',title:'Nutrición · Macros',after:drawAfter,html:()=>fullStory(storyNutriMacros),notes:{p:['Tres barras finas con el objetivo como fondo y la proteína como titular.']}});
scene({tab:'historias',id:'h-nutri-streak',title:'Nutrición · Racha',after:drawAfter,html:()=>fullStory(storyNutriStreak),notes:{p:['La espiral cuenta las semanas de la racha.']}});

  inner:`<div class="st-lifts">${[['Marca personal','−3:41'],['Último kilómetro','4:21'],['Categoría M35','187.º']].map(l=>`<div><span>${l[0]}</span><b>${l[1]}</b></div>`).join('')}</div>`});
const storyStage=(o={})=>storyShell({photo:true,art:coverSvg('bruma','carbon',{seed:4,clear:true}),artBottom:'52%',top:'60%',ey:'Regional · Men’s Physique',title:'2.º puesto',w:o.w,foot:'Mi competencia',
  extra:`<div class="st-medal" style="width:28%;top:48%;left:80%">${medalSvg('plata')}</div>`,
  inner:`<div class="st-inline"><span>14<small>competidores</small></span><i></i><span>9<small>semanas de prep</small></span></div>`});
const storyCombat=(o={})=>storyShell({art:coverSvg('campo','carbon',{seed:7}),artBottom:'50%',top:'42%',end:true,ey:'Open de BJJ · -82,3 kg',title:'Plata · 3–1',sub:'Azul · adulto',w:o.w,foot:'Mi competencia',
  inner:`<div class="st-lifts">${[['Octavos','Puntos 6–2'],['Cuartos','Sumisión'],['Semifinal','Ventaja'],['Final','0–2']].map(l=>`<div><span>${l[0]}</span><b style="font-size:4.6cqw">${l[1]}</b></div>`).join('')}</div>`});
Object.assign(STORIES,{race:storyRace,stage:storyStage,combat:storyCombat});
scene({tab:'historias',id:'h-race',title:'Carrera · tiempo',after:drawAfter,html:()=>fullStory(storyRace),notes:{tags:[['new','Contra el reloj']],p:['El tiempo como titular, distancia, ritmo y puesto; abajo la marca personal y el kilómetro más rápido. Igual para trail (con desnivel), ciclismo, natación, remo y triatlón (con segmentos).']}});
scene({tab:'historias',id:'h-stage',title:'Culturismo · tarima',after:drawAfter,html:()=>fullStory(storyStage),notes:{tags:[['new','Jueceo']],p:['Tu foto de tarima a pantalla completa con la medalla y el puesto. Sin peso corporal salvo que lo actives.']}});
scene({tab:'historias',id:'h-combat',title:'Combate · cuadro',after:drawAfter,html:()=>fullStory(storyCombat),notes:{tags:[['new','Combates']],p:['Medalla y balance como titular y el camino ronda a ronda. Sirve para todas las disciplinas de combate y para armwrestling.']}});
