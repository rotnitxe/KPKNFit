                'SetupDraftResolverTest', 'SetupDraftCompatibilityTest', 'SetupDraftRepairTableTest',
                'SetupStepGraphTest', 'SetupStepDefinitionsTest', 'SetupWizardActivationGateTest',
                'SetupWizardFullJourneyTest', 'SetupWelcomeScreenTest', 'PreSessionPreparationDialogTest',
                'WorkoutPreparationCommitterRoomTest', 'NativeWorkoutProgressionRuntimeTest',
                'ExerciseCatalogContractTest', 'AprendeCatalogAuditTest', 'RetiredPendingDeloadTest',
                'PostExerciseFeedbackDraftTest', 'TrainingFactChartTest',
                'InitialPermissionRequestEffectTest', 'RecommendedPermissionsDialogTest', 'PostRingsWizardMigrationTest', 'ApreLiveCalibrationTest', 'ApreLateralCalibrationTest', 'WorkoutCalibrationRecorderRoomTest', 'WorkoutCalibrationVariantTest', 'WorkoutVoicePreparationParserTest', 'WorkoutVoiceHandsFreeTest', 'SetupPersistenceTest', 'SetExecutionCardCalibrationTest',
