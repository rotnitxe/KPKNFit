name: Android stability
on:
  pull_request:
    paths: ["android-native/**", "cloud-sync/**", "data/**", "scripts/**", ".github/workflows/android-stability.yml"]
  workflow_dispatch:
    inputs:
      voice_corpus_run_id:
        description: "Run ID containing the authorized private kpkn-voice-field-corpus artifact"
        required: false
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: android-stability-${{ github.ref }}
  cancel-in-progress: true
jobs:
  shared-swift-contract:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - working-directory: ios-native/KPKNContracts
        run: swift test
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: {distribution: temurin, java-version: "21"}
      - uses: actions/setup-python@v7
        with: {python-version: "3.13"}
      - uses: android-actions/setup-android@v4
      - run: pip install pillow==12.3.0 pyyaml
      - run: python scripts/stability/verify_distribution_surface.py
      - run: python scripts/stability/verify_storage_inventory.py --output storage-classification.json
      - run: python scripts/stability/test_storage_inventory.py
      - run: python scripts/stability/test_native_packaging.py
      - run: python scripts/stability/test_voice_corpus_input.py
      - name: Read the authorized private field corpus
        if: github.event_name == 'workflow_dispatch' && inputs.voice_corpus_run_id != ''
        uses: actions/download-artifact@v8
        with:
          name: kpkn-voice-field-corpus
          run-id: ${{ inputs.voice_corpus_run_id }}
          github-token: ${{ github.token }}
          path: .ci-private/input
      - name: Verify consent, bounds and hashes without logging transcripts
        if: github.event_name == 'workflow_dispatch' && inputs.voice_corpus_run_id != ''
        run: python scripts/stability/prepare_voice_corpus.py --source .ci-private/input --output .ci-private/voice-corpus
      - working-directory: android-native
        run: python scripts/process_dataset.py --check
      - run: python scripts/catalog_v2_ficha_lint.py
      - run: python scripts/catalog_v2_gate.py --strict
      - name: JVM tests and migration contracts
        working-directory: android-native
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain --max-workers=1 -Dorg.gradle.jvmargs=-Xmx5g -PKPKN_VOICE_REPLAY_DIR="$GITHUB_WORKSPACE/.ci-private/voice-corpus" testDebugUnitTest assembleDebug
      - name: Require executed real voice replay before release acceptance
        if: always()
        run: python scripts/stability/verify_voice_replay_execution.py --output voice-replay-gate.json
      - name: Full release lint in a separate compiler process
        if: always()
        working-directory: android-native
        run: ./gradlew --no-daemon --console=plain --max-workers=1 -Dorg.gradle.jvmargs=-Xmx5g lintRelease
      - name: Compile the release shrinker without publishing or using signing secrets
        working-directory: android-native
        run: ./gradlew --no-daemon --console=plain --max-workers=1 -Dorg.gradle.jvmargs=-Xmx5g minifyReleaseWithR8
      - name: Release crash reporting lifecycle with simulated SDKs on API26 and API34
        working-directory: android-native
        run: ./gradlew --no-daemon --console=plain --max-workers=1 -Dorg.gradle.jvmargs=-Xmx5g -Pandroid.onlyEnableUnitTestForTheTestedBuildType=false --init-script ../scripts/stability/crash_release_probe.init.gradle testReleaseUnitTest --tests com.example.kpkn.data.diagnostics.CrashReportLifecycleAdversarialTest
      - name: Inspect native LOAD, RELRO and ZIP alignment
        if: always()
        run: python scripts/stability/verify_native_packaging.py --apk android-native/app/build/outputs/apk/debug/app-debug.apk --output native-packaging.json
      - name: Preserve results and commit identity
        if: always()
        run: |
          mkdir -p artifacts/ci
          printf '%s\n' "$GITHUB_SHA" > artifacts/ci/commit.txt
          find android-native/app/build/outputs -type f \( -name '*.apk' -o -name '*.aab' \) -exec sha256sum {} \; > artifacts/ci/hashes.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-${{ github.sha }}
          retention-days: 14
          path: |
            android-native/app/build/reports/
            android-native/app/build/test-results/
            android-native/app/build/outputs/apk/debug/
            artifacts/ci/
            storage-classification.json
            native-packaging.json
            voice-replay-gate.json
  emulator-startup:
    needs: android
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - {api: 26, target: google_apis, arch: x86, pages: 4096}
          - {api: 36, target: google_apis, arch: x86_64, pages: 4096}
          - {api: 35, target: google_apis_ps16k, arch: x86_64, pages: 16384}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.13"}
      - uses: actions/download-artifact@v8
        with:
          name: android-${{ github.sha }}
          path: ci-input
      - name: Enable the runner's KVM device
        run: |
          sudo chmod a+rw /dev/kvm
      - name: Validate API, memory page size and visible MainActivity
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          ram-size: 3072M
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: |
            APK=$(find ci-input -type f -name app-debug.apk -print -quit)
            test -n "$APK"
            python scripts/stability/emulator_ci_smoke.py --apk "$APK" --api ${{ matrix.api }} --page-size ${{ matrix.pages }} --output artifacts/emulator-${{ matrix.api }}-${{ matrix.pages }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: emulator-${{ github.sha }}-${{ matrix.api }}-${{ matrix.pages }}
          retention-days: 14
          path: artifacts/emulator-*
  firebase:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: {distribution: temurin, java-version: "21"}
      - name: Install the Functions and CLI runtime
        uses: actions/setup-node@v7
        with: {node-version: "22"}
      - name: Preserve the Node 22 executable
        run: echo "KPKN_FUNCTIONS_NODE=$(command -v node)" >> "$GITHUB_ENV"
      - name: Install the rules test client runtime
        uses: actions/setup-node@v7
        with: {node-version: "24"}
      - name: Verify the test client runtime
        run: |
          node -e 'const [major, minor] = process.versions.node.split(".").map(Number); if (major !== 24 || minor < 12) throw new Error("Rules tests require Node 24.12+")'
          echo "KPKN_RULES_NODE=$(command -v node)" >> "$GITHUB_ENV"
      - working-directory: cloud-sync
        run: npm ci --ignore-scripts --no-audit
      - working-directory: cloud-sync/functions
        run: npm ci --ignore-scripts --no-audit
      - name: Run server contracts on Node 22
        working-directory: cloud-sync/functions
        run: '"$KPKN_FUNCTIONS_NODE" --test test/*.test.mjs'
      - name: Run Functions on Node 22 and rules tests on Node 24
        working-directory: cloud-sync
        env: {FUNCTIONS_DISCOVERY_TIMEOUT: "60"}
        run: |
          export PATH="$(dirname "$KPKN_FUNCTIONS_NODE"):$PATH"
          "$KPKN_FUNCTIONS_NODE" node_modules/firebase-tools/lib/bin/firebase.js emulators:exec --project demo-kpkn-stability --only firestore,auth,storage,functions "cd functions && \"$KPKN_RULES_NODE\" --test --test-concurrency=1 integration/*.test.mjs"
  release:
    if: github.event_name == 'workflow_dispatch'
    needs: [android, emulator-startup, firebase, shared-swift-contract]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: kpkn-release-verification
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: {distribution: temurin, java-version: "21"}
      - uses: actions/setup-python@v7
        with: {python-version: "3.13"}
      - run: pip install pillow==12.3.0
      - uses: android-actions/setup-android@v4
      - name: Configure upload signing in the runner's temporary directory
        env:
          UPLOAD_KEY_BASE64: ${{ secrets.KPKN_UPLOAD_KEY_BASE64 }}
        run: |
          test -n "$UPLOAD_KEY_BASE64"
          printf '%s' "$UPLOAD_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/kpkn-upload.jks"
          chmod 600 "$RUNNER_TEMP/kpkn-upload.jks"
      - name: Signed release with R8
        working-directory: android-native
        env:
          KPKN_RELEASE_STORE_FILE: ${{ runner.temp }}/kpkn-upload.jks
          KPKN_RELEASE_STORE_PASSWORD: ${{ secrets.KPKN_RELEASE_STORE_PASSWORD }}
          KPKN_RELEASE_KEY_ALIAS: ${{ secrets.KPKN_RELEASE_KEY_ALIAS }}
          KPKN_RELEASE_KEY_PASSWORD: ${{ secrets.KPKN_RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain --max-workers=1 -Dorg.gradle.jvmargs=-Xmx5g bundleRelease assembleRelease
      - run: find android-native/app/build/outputs -type f \( -name '*.apk' -o -name '*.aab' \) -exec sha256sum {} \; > release-hashes.txt
      - uses: actions/upload-artifact@v7
        with:
          name: release-verification-${{ github.sha }}
          retention-days: 14
          path: |
            android-native/app/build/outputs/apk/release/
            android-native/app/build/outputs/bundle/release/
            android-native/app/build/outputs/mapping/release/
            release-hashes.txt
      - if: always()
        run: rm -f "$RUNNER_TEMP/kpkn-upload.jks"
